to orchestrate the response when a virus is detected on company devices. Which of the following would be the BEST way to implement this function?"}],"opts":[{"k":"A","t":"Active reconnaissance"},{"k":"B","t":"Log aggregation"},{"k":"C","t":"Vulnerability scan"},{"k":"D","t":"Escalation scripting"}],"ans":["D"],"es":"Escalation scripting: automatizar u orquestar la respuesta al detectar un virus. El escaneo de vulnerabilidades y la agregación de logs no responden a eventos.","en":"D. Escalation scripting Scripting and automation can provide methods to automate or orchestrate the escalation response when a security issue is detected.","enw":"A. Active reconnaissance Active reconnaissance will gather information about a system, but it does not provide any ongoing monitoring or response features. B. Log aggregation Log aggregation provides a method of centralizing evidence and log files for reporting and future analysis. The aggregated log does not inherently provide a response to a security event. C. Vulnerability scan A vulnerability scan will identify any known vulnerabilities that may be associated with a system. However, a vulnerability scan will not identify real-time infections or automate the response."},{"id":"B11","exam":"B","n":11,"type":"mc","dom":2,"obj":"2.1","objtxt":"SY0-701, Objective 2.1 - Phishing","qparts":[{"k":"p","v":"A user in the accounting department has received a text message from the CEO. The message requests payment by cryptocurrency for a recently purchased tablet. Which of the following would BEST describe this attack?"}],"opts":[{"k":"A","t":"Brand impersonation"},{"k":"B","t":"Watering hole attack"},{"k":"C","t":"Smishing"},{"k":"D","t":"Typosquatting"}],"ans":["C"],"es":"Smishing: phishing por SMS. Un mensaje del supuesto CEO que pide un pago inusual con criptomonedas es un caso típico.","en":"C. Smishing Smishing is phishing using SMS (Short Message Service), and is more commonly referenced as text messaging. A message allegedly from the CEO asking for an unusual payments using cryptocurrency or gift cards would be categorized as smishing.","enw":"A. Brand impersonation Brand impersonation usually involves a third-party pretending to be an employee or representative of another (usually well-known) company. This text message did not claim a particular brand or trademark as part of the attack. B. Watering hole attack A watering hole attack requires users to visit a central website or location. Viewing this text message did not require the user to visit any third-party websites. D. Typosquatting A typosquatting attack commonly uses a misspelling of a domain name to redirect victims to a malicious website."},{"id":"B12","exam":"B","n":12,"type":"mc","dom":2,"obj":"2.3","objtxt":"SY0-701, Objective 2.3 - Virtualization Vulnerabilities","qparts":[{"k":"p","v":"A company has been informed of a hypervisor vulnerability that could allow users on one virtual machine to access resources on another virtual machine. Which of the following would BEST describe this vulnerability?"}],"opts":[{"k":"A","t":"Containerization"},{"k":"B","t":"Jailbreaking"},{"k":"C","t":"SDN"},{"k":"D","t":"Escape"}],"ans":["D"],"es":"VM escape (escape de máquina virtual): una vulnerabilidad del hipervisor permite acceder a recursos de otra VM.","en":"D. Escape A VM (Virtual Machine) escape is a vulnerability that allows communication between separate VMs.","enw":"A. Containerization Containerization is an application deployment architecture that uses a self-contained group of application code and dependencies. Using containerization, many separate containers can be deployed simultaneously on a single system. B. Jailbreaking Jailbreaking describes the replacement of firmware on a mobile phone or tablet with the goal of enabling or allowing features that would not normally be available. For example, a jailbroken phone or tablet can install software from locations other than the primary app store. C. SDN SDN (Software-Defined Networking) separates the control plane of devices from the data plane. This allows for more automation and dynamic changes to the infrastructure."},{"id":"B13","exam":"B","n":13,"type":"mc","dom":2,"obj":"2.4","objtxt":"SY0-701, Objective 2.4 - DNS Attacks","qparts":[{"k":"p","v":"While working from home, users are attending a project meeting over a web conference. When typing in the meeting link, the browser is unexpectedly directed to a different website than the web conference. Users in the office do not have any issues accessing the conference site. Which of the following would be the MOST likely reason for this issue?"}],"opts":[{"k":"A","t":"Buffer overflow"},{"k":"B","t":"Wireless disassociation"},{"k":"C","t":"Amplified DDoS"},{"k":"D","t":"DNS poisoning"}],"ans":["D"],"es":"DNS poisoning: solo los usuarios que usan cierto servidor DNS (en casa) son redirigidos; los de la oficina no ven problema.","en":"D. DNS poisoning An attacker with access to a DNS (Domain Name System) server can modify the DNS configuration files and redirect users to a different website. Anyone using a different DNS server may not see any problems with connectivity to the original site.","enw":"A. Buffer overflow A buffer overflow vulnerability is associated with application input that exceeds the expected input size. A buffer overflow would cause an application to fail or perform unusually, but a buffer overflow would not appear as a redirected web server from a DNS lookup. B. Wireless deauthentication Wireless deauthentication would cause users on a wireless network to constantly disconnect. Wireless deauthentication would not cause a redirection of a website. C. Amplified DDoS An amplified DDOS (Distributed Denial of Service) would attack a service from many different devices and cause the service to be unavailable. This attack sends specially crafted packets to maximize the amount of traffic seen in the response. In this example, the service did not document any availability problems."},{"id":"B14","exam":"B","n":14,"type":"mc","dom":1,"obj":"1.2","objtxt":"SY0-701, Objective 1.2","qparts":[{"k":"p","v":"A company is launching a new internal application that will not start until a username and password is entered and a smart card is plugged into the computer. Which of the following BEST describes this process?"}],"opts":[{"k":"A","t":"Federation"},{"k":"B","t":"Accounting"},{"k":"C","t":"Authentication"},{"k":"D","t":"Authorization"}],"ans":["C"],"es":"Autenticación: demostrar quién eres con contraseña y smart card (dos factores). La autorización y la contabilidad ocurren después.","en":"C. Authentication The process of proving who you say you are is authentication. In this example, the password and smart card are two factors of authentication, and both reasonably prove that the person with the login credentials is authentic.","enw":"A. Federation Federation provides a way to authenticate and authorize between two different organizations. In this example, the authentication process uses internal information without any type of connection or trust to a third-party. B. Accounting Accounting will document information regarding a user’s session, such as login time, data sent and received, files transferred, and logout time. D. Authorization The authorization process assigns users to resources. This process commonly occurs after the authentication process is complete."},{"id":"B15","exam":"B","n":15,"type":"mc","dom":5,"obj":"5.5","objtxt":"SY0-701, Objective 5.5 - Penetration Tests","qparts":[{"k":"p","v":"An online retailer is planning a penetration test as part of their PCI DSS validation. A third-party organization will be performing the test, and the online retailer has provided the Internet-facing IP addresses for their public web servers. No other details were provided. What penetration testing methodology is the online retailer using?"}],"opts":[{"k":"A","t":"Known environment"},{"k":"B","t":"Passive reconnaissance"},{"k":"C","t":"Partially known environment"},{"k":"D","t":"Benchmarks"}],"ans":["C"],"es":"Partially known environment: el probador conoce algo (las IP públicas) pero no todo. Known environment sería información completa.","en":"C. Partially known environment A partially known environment test is performed when the attacker knows some information about the victim, but not all information is available.","enw":"A. Known environment A known environment test is performed when the attacker has complete details about the victim’s systems and infrastructure. B. Passive reconnaissance Passive reconnaissance is the process of gathering information from publicly available sites, such as social media or corporate websites. D. Benchmarks Security benchmarks describe a set of best practices to apply to an application, operating system, or any other service. A benchmark does not describe the information provided to a vulnerability scanning service."},{"id":"B16","exam":"B","n":16,"type":"mc","dom":2,"obj":"2.2","objtxt":"SY0-701, Objective 2.2 - Common Threat Vectors","qparts":[{"k":"p","v":"A manufacturing company produces radar used by commercial and military organizations. A recently proposed policy change would allow the use of mobile devices inside the facility. Which of the following would be the MOST significant threat vector issue associated with this change in policy?"}],"opts":[{"k":"A","t":"Unauthorized software on rooted devices"},{"k":"B","t":"Remote access clients on the mobile devices"},{"k":"C","t":"Out of date mobile operating systems"},{"k":"D","t":"Loss of intellectual property"}],"ans":["D"],"es":"Con móviles en una planta de radares, el mayor riesgo es la pérdida de propiedad intelectual (fotos, videos, archivos).","en":"D. Loss of intellectual property The exfiltration of confidential information and intellectual property is relatively simple with an easily transportable mobile phone. Organizations associated with sensitive products or services must always be aware of the potential for information leaks using files, photos, or video.","enw":"A. Unauthorized software on rooted devices Although unauthorized software use can be a security issue, it isn’t as significant as the exfiltration of intellectual property. B. Remote access clients on the mobile devices It’s sometimes convenient to have a remote access client available, and this type of access can certainly be a concern if the proper security is not in place. However, the much more significant security issue in this list would be associated with the ease of photos and videography when working with confidential information. C. Out of date mobile operating systems Having an outdated operating system can potentially include security vulnerabilities, but these vulnerabilities do not have the significance of an active data exfiltration method."},{"id":"B17","exam":"B","n":17,"type":"mc","dom":4,"obj":"4.5","objtxt":"SY0-701, Objective 4.5 - Email Security","qparts":[{"k":"p","v":"Which of the following would be the BEST way for an organization to verify the digital signature provided by an external email server?"}],"opts":[{"k":"A","t":"Perform a vulnerability scan"},{"k":"B","t":"View the server's device certificate"},{"k":"C","t":"Authenticate to a RADIUS server"},{"k":"D","t":"Check the DKIM record"}],"ans":["D"],"es":"El registro DKIM en DNS contiene la clave pública para verificar la firma digital del servidor de correo.","en":"D. Check the DKIM record A DKIM (Domain Keys Identified Mail) record is a DNS (Domain Name System) entry that includes the public key associated with an email server's digital signatures. A legitimate email server will digitally sign all outgoing emails and provide the public key in their DNS for third-party validation.","enw":"A. Perform a vulnerability scan A vulnerability scan can provide information on any unpatched applications or services, but it won't provide digital signature verification for incoming email messages. B. View the server's device certificate A device certificate can validate the trust of a system, but it does not provide digital signature validation for email servers. C. Authenticate to a RADIUS server A RADIUS server can verify account credentials, but it does not provide a method for validating the digital signatures provided by a third-party email server."},{"id":"B18","exam":"B","n":18,"type":"mc","dom":3,"obj":"3.4","objtxt":"SY0-701, Objective 3.4 - Resiliency","qparts":[{"k":"p","v":"A company is using older operating systems for their web servers and are concerned of their stability during periods of high use. Which of the following should the company use to maximize the uptime and availability of this service?"}],"opts":[{"k":"A","t":"Cold site"},{"k":"B","t":"UPS"},{"k":"C","t":"Redundant routers"},{"k":"D","t":"Load balancer"}],"ans":["D"],"es":"Un load balancer mantiene un grupo de servidores; si uno falla, los demás siguen dando el servicio y se reparte la carga.","en":"D. Load balancer A load balancer maintains a pool of servers and can distribute the load across those devices. If a device fails, the other servers will continue to operate and provide the necessary services.","enw":"A. Cold site A cold site is commonly used for disaster recovery and would require building an infrastructure and installing software before the site would be functional. Moving the web services to a cold site would not be an efficient form of server resiliency. B. UPS A UPS (Uninterruptible Power Supply) provides an alternative power source when the main power is no longer available. Although this would provide additional uptime for power faults, it does not provide resiliency if an operating system crashes. C. Redundant routers Maintaining multiple routers is common in highly available networks, but multiple routers will not provide uptime if the server operating system was to fail."},{"id":"B19","exam":"B","n":19,"type":"mc","dom":1,"obj":"1.4","objtxt":"SY0-701, Objective 1.4 - Encrypting Data","qparts":[{"k":"p","v":"A user in the accounting department would like to email a spreadsheet with sensitive information to a list of third-party vendors. Which of the following would be the BEST way to protect the data in this email?"}],"opts":[{"k":"A","t":"Full disk encryption"},{"k":"B","t":"Key exchange algorithm"},{"k":"C","t":"Salted hash"},{"k":"D","t":"Asymmetric encryption"}],"ans":["D"],"es":"Cifrado asimétrico: se cifra con la clave pública del destinatario y solo él descifra con su clave privada (PGP/GPG).","en":"D. Asymmetric encryption Asymmetric encryption uses a recipient's public key to encrypt data, and this data can only be decrypted with the recipient's private key. This encryption method is commonly used with software such as PGP or GPG.","enw":"A. Full disk encryption Full disk encryption protects all data saved on a storage drive, but it does not provide any data protection for messages or attachments sent between email servers. B. Key exchange algorithm A key exchange algorithm can be used to securely exchange key information between devices, but it does not provide a method of encrypting data. C. Salted hash A salted hash describes a hash value that includes some additional data (the salt) to provide randomization. A salted hash does not provide data confidentiality or encryption."},{"id":"B20","exam":"B","n":20,"type":"mc","dom":2,"obj":"2.5","objtxt":"SY0-701, Objective 2.5 - Segmentation and Access Control","qparts":[{"k":"p","v":"A system administrator would like to segment the network to give the marketing, accounting, and manufacturing departments their own private network. The network communication between departments would be restricted for additional security. Which of the following should be configured on this network?"}],"opts":[{"k":"A","t":"VPN"},{"k":"B","t":"RBAC"},{"k":"C","t":"VLAN"},{"k":"D","t":"SDN"}],"ans":["C"],"es":"VLAN: segmenta la red lógicamente por departamento, y un router puede controlar el tráfico entre ellas.","en":"C. VLAN A VLAN (Virtual Local Area Network) is a common method of using a switch to logically segment a network. The devices in each segmented VLAN can only communicate with other devices in the same VLAN. A router is used to connect VLANs, and this router can often be used to control traffic flows between the VLANs.","enw":"A. VPN A VPN (Virtual Private Network) is an encryption technology used to secure network connections between sites or remote end-user communication. VPNs are not commonly used to segment internal network communication. B. RBAC RBAC (Role-Based Access Control) describes a control mechanism for managing rights and permissions in an operating system. RBAC is not used for network segmentation. D. SDN SDN (Software Defined Networking) separates the planes of operation so that infrastructure devices would have a defined control plane and data plane. SDN would not be used when segmenting internal networks."},{"id":"B21","exam":"B","n":21,"type":"mc","dom":3,"obj":"3.2","objtxt":"SY0-701, Objective 3.2 - Network Appliances","qparts":[{"k":"p","v":"A technician at an MSP has been asked to manage devices on third-party private network. The technician needs command line access to internal routers, switches, and firewalls. Which of the following would provide the necessary access?"}],"opts":[{"k":"A","t":"HSM"},{"k":"B","t":"Jump server"},{"k":"C","t":"NAC"},{"k":"D","t":"Air gap"}],"ans":["B"],"es":"Jump server: equipo endurecido para entrar a redes de terceros; el técnico se conecta por SSH o VPN y salta a routers, switches y firewalls.","en":"B. Jump server A jump server is a highly secured device commonly used to access secure areas of another network. The technician would first connect to the jump server using SSH or a VPN tunnel, and then \"jump\" from the jump server to other devices on the inside of the protected network. This would allow technicians at an MSP (Managed Service Provider) to securely access devices on their customer's private networks.","enw":"A. HSM An HSM (Hardware Security Module) is a secure method of cryptographic key backup and hardware-based cryptographic offloading. C. NAC NAC (Network Access Control) is a broad term describing access control based on a health check or posture assessment. NAC will deny access to devices that don't meet the minimum security requirements. D. Air gap An air gap is a segmentation strategy that separates devices or networks by physically disconnecting them from each other."},{"id":"B22","exam":"B","n":22,"type":"mc","dom":5,"obj":"5.2","objtxt":"SY0-701, Objective 5.2 - Business Impact Analysis","qparts":[{"k":"p","v":"A transportation company is installing new wireless access points in their corporate office. The manufacturer estimates the access points will operate an average of 100,000 hours before a hardware-related outage. Which of the following describes this estimate?"}],"opts":[{"k":"A","t":"MTTR"},{"k":"B","t":"RPO"},{"k":"C","t":"RTO"},{"k":"D","t":"MTBF"}],"ans":["D"],"es":"MTBF (Mean Time Between Failures): tiempo promedio esperado entre fallas de hardware.","en":"D. MTBF The MTBF (Mean Time Between Failures) is the average time expected between outages. This is usually an estimation based on the internal device components and their expected operational lifetime.","enw":"A. MTTR MTTR (Mean Time to Repair) is the time required to repair a product or system after a failure. B. RPO RPO (Recovery Point Objectives) define how much data loss would be acceptable during a recovery. C. RTO RTO (Recovery Time Objectives) define the minimum objectives required to get up and running to a particular service level."},{"id":"B23","exam":"B","n":23,"type":"mc","dom":3,"obj":"3.3","objtxt":"SY0-701, Objective 3.3 - Protecting Data","qparts":[{"k":"p","v":"A security administrator is creating a policy to prevent the disclosure of credit card numbers in a customer support application. Users of the application would only be able to view the last four digits of a credit card number. Which of the following would provide this functionality?"}],"opts":[{"k":"A","t":"Hashing"},{"k":"B","t":"Tokenization"},{"k":"C","t":"Masking"},{"k":"D","t":"Salting"}],"ans":["C"],"es":"Data masking: se muestran solo los últimos cuatro dígitos y el número completo sigue guardado. Tokenización reemplazaría el dato.","en":"C. Masking Data masking hides data from being viewed. The full credit card numbers are stored in a database, but only a limited view of this data is available when accessing the information from the application.","enw":"A. Hashing Hashing is a method of storing a digital fingerprint of data. In this example, the last four digits displayed are the actual card numbers and not a hash of the card numbers. B. Tokenization Tokenization replaces sensitive data with a non-sensitive placeholder. In this example, the only visible information is part of the actual card number. Tokenization is not used to replace any of the card numbers. D. Salting Salting adds randomized data when performing a hashing function. Salting is often used to add additional randomization when storing passwords."},{"id":"B24","exam":"B","n":24,"type":"mc","dom":4,"obj":"4.6","objtxt":"SY0-701, Objective 4.6 - Multi-factor Authentication","qparts":[{"k":"p","v":"A user is authenticating through the use of a PIN and a fingerprint. Which of the following would describe these authentication factors?"}],"opts":[{"k":"A","t":"Something you know, something you are"},{"k":"B","t":"Something you are, somewhere you are"},{"k":"C","t":"Something you have, something you know"},{"k":"D","t":"Somewhere you are, something you are"}],"ans":["A"],"es":"PIN = algo que sabes; huella = algo que eres.","en":"A. Something you know, something you are A PIN (Personal Identification Number) is something you know, and a fingerprint is something you are.","enw":"B. Something you are, somewhere you are A fingerprint would be categorized as something you are, but a somewhere you are could be a set of GPS coordinates or IP addresses. C. Something you have, something you know Something you have could be an smart ID card or phone app, and something you know could be a PIN or password. D. Somewhere you are, something you are Somewhere you are would be a location, and something you are would be a biometric reading."},{"id":"B25","exam":"B","n":25,"type":"mc","dom":4,"obj":"4.1","objtxt":"SY0-701, Objective 4.1 - Wireless Security Settings","qparts":[{"k":"p","v":"A security administrator is configuring the authentication process used by technicians when logging into wireless access points and switches. Instead of using local accounts, the administrator would like to pass all login requests to a centralized database. Which of the following would be the BEST way to implement this requirement?"}],"opts":[{"k":"A","t":"COPE"},{"k":"B","t":"AAA"},{"k":"C","t":"IPsec"},{"k":"D","t":"SIEM"}],"ans":["B"],"es":"AAA (Authentication, Authorization, Accounting) centraliza la autenticación en una base de datos en lugar de cuentas locales.","en":"B. AAA Using AAA (Authentication, Authorization, and Accounting) is a common method of centralizing authentication. Instead of having separate local accounts on different devices, users can authenticate with account information maintained in a centralized database.","enw":"A. COPE COPE (Corporate-owned, personally enabled) devices are purchased by the organization and enabled for both business and personal use. A COPE device does not provide any centralized authentication functionality. C. IPsec IPsec is commonly used as an encrypted tunnel between sites or endpoints. It’s useful for protecting data sent over the network, but IPsec isn’t used to centralize the authentication process. D. SIEM A SIEM (Security Information and Event Management) service provides centralized logging and reporting for network infrastructure devices. A SIEM service does not provide any centralized authentication features."},{"id":"B26","exam":"B","n":26,"type":"mc","dom":4,"obj":"4.6","objtxt":"SY0-701, Objective 4.6 - Access Controls","qparts":[{"k":"p","v":"A recent audit has determined that many IT department accounts have been granted Administrator access. The audit recommends replacing these permissions with limited access rights. Which of the following would describe this policy?"}],"opts":[{"k":"A","t":"Password vaulting"},{"k":"B","t":"Offboarding"},{"k":"C","t":"Least privilege"},{"k":"D","t":"Discretionary access control"}],"ans":["C"],"es":"Least privilege (mínimo privilegio): dar solo los permisos necesarios y reemplazar el acceso de administrador.","en":"C. Least privilege The policy of least privilege limits the rights and permissions of a user account to only the access required to accomplish their objectives. This policy would limit the scope of an attack originating from a user in the IT department.","enw":"A. Password vaulting Password vaulting is a secure way to store and retrieve passwords, but it doesn't include a policy for limiting system access. B. Offboarding The offboarding process describes the policies and procedures associated with someone leaving the organization or someone who is no longer an employee of the company. D. Discretionary access control With discretionary access control (DAC), access and permissions are determined by the owner or originator of the files or resources."},{"id":"B27","exam":"B","n":27,"type":"mc","dom":4,"obj":"4.5","objtxt":"SY0-701, Objective 4.5 - Secure Protocols","qparts":[{"k":"p","v":"A recent security audit has discovered usernames and passwords which can be easily viewed in a packet capture. Which of the following did the audit identify?"}],"opts":[{"k":"A","t":"Weak encryption"},{"k":"B","t":"Improper patch management"},{"k":"C","t":"Insecure protocols"},{"k":"D","t":"Open ports"}],"ans":["C"],"es":"Protocolos inseguros: las credenciales viajan sin cifrar y se ven en una captura de paquetes.","en":"C. Insecure protocols An insecure authentication protocol will transmit information \"in the clear,\" or without any type of encryption or protection.","enw":"A. Weak encryption A weak encryption cipher will appear to protect data, but instead can be commonly circumvented to reveal the plaintext. In this example, the usernames and passwords were not encrypted in any way and could be viewed in a packet capture. B. Improper patch management Maintaining systems to the latest patch version will protect against vulnerabilities and security issues. Sending information in the clear over the network is not commonly associated with an unpatched system. D. Open ports Open ports are usually associated with a service or application on a device. An open port is not commonly associated with any encryption or protected network communication."},{"id":"B28","exam":"B","n":28,"type":"mc","dom":5,"obj":"5.4","objtxt":"SY0-701, Objective 5.4 - Compliance","qparts":[{"k":"p","v":"Before deploying a new application, a company is performing an internal audit to ensure all of their servers are configured with the appropriate security features. Which of the following would BEST describe this process?"}],"opts":[{"k":"A","t":"Due care"},{"k":"B","t":"Active reconnaissance"},{"k":"C","t":"Data retention"},{"k":"D","t":"Statement of work"}],"ans":["A"],"es":"Due care: actividad interna para actuar de buena fe y mantener la seguridad. Due diligence suele ser con terceros.","en":"A. Due care Due care describes a duty to act honestly and in good faith. Due diligence is often associated with third-party activities, and due care tends to refer to internal activities.","enw":"B. Active reconnaissance Active reconnaissance refers to the process of collecting information before a penetration test. Active reconnaissance includes activities that will communicate to devices where traffic can be logged. C. Data retention Data retention involves the collection and storage of data over time. For example, many organizations are required to collect and store years of email records or financial documents. D. Statement of work A statement of work is often used during a professional services engagement to detail a list of specific tasks to complete. In this example, all of the work is part of an internal audit and does not include any mention of third-party professional services."},{"id":"B29","exam":"B","n":29,"type":"mc","dom":5,"obj":"5.2","objtxt":"SY0-701, Objective 5.2 - Risk Management Strategies","qparts":[{"k":"p","v":"An organization has previously purchased insurance to cover a ransomware attack, but the costs of maintaining the policy have increased above the acceptable budget. The company has now decided to cancel the insurance policies and address potential ransomware issues internally. Which of the following would best describe this action?"}],"opts":[{"k":"A","t":"Mitigation"},{"k":"B","t":"Acceptance"},{"k":"C","t":"Transference"},{"k":"D","t":"Risk-avoidance"}],"ans":["B"],"es":"Aceptación del riesgo: cancelar el seguro y asumir el costo de un posible ransomware. Comprar el seguro era transferencia.","en":"B. Acceptance Risk acceptance is a business decision that places the responsibility of the risky activity on the organization itself.","enw":"A. Mitigation If the organization was to purchase additional backup facilities and update their backup processes to include offline backup storage, they would be mitigating the risk of a ransomware infection. C. Transference Purchasing insurance to cover a risky activity is a common method of transferring risk from the organization to the insurance company. D. Risk-avoidance To avoid the risk of ransomware, the organization would need to completely disconnect from the Internet and disable all methods that ransomware might use to infect a system. This risk response technique would most likely not apply to ransomware."},{"id":"B30","exam":"B","n":30,"type":"mc","dom":2,"obj":"2.1","objtxt":"SY0-701, Objective 2.1 - Threat Actors","qparts":[{"k":"p","v":"Which of these threat actors would be MOST likely to install a company's internal application on a public cloud provider?"}],"opts":[{"k":"A","t":"Organized crime"},{"k":"B","t":"Nation state"},{"k":"C","t":"Shadow IT"},{"k":"D","t":"Hacktivist"}],"ans":["C"],"es":"Shadow IT: áreas internas que evaden a TI y montan sus propias aplicaciones en la nube pública.","en":"C. Shadow IT Shadow IT is an internal organization within the company but is not part of the IT department. Shadow IT often circumvents or ignores existing IT policies to build their own infrastructure with company resources.","enw":"A. Organized crime Organized crime is usually motivated by money. An organized crime group is more interested in stealing information than installing company applications in a public cloud. B. Nation state Nation states are highly sophisticated hackers, and their efforts are usually focused on obtaining confidential government information or disrupting governmental operations. D. Hacktivist A hacktivist often has a political statement to make, and their hacking efforts would commonly result in a public display of that information. However, a hacktivist would not install company application on a public cloud provider's network."},{"id":"B31","exam":"B","n":31,"type":"mc","dom":4,"obj":"4.8","objtxt":"SY0-701, Objective 4.8 - Incident Response","qparts":[{"k":"p","v":"An IPS report shows a series of exploit attempts were made against externally facing web servers. The system administrator of the web servers has identified a number of unusual log entries on each system. Which of the following would be the NEXT step in the incident response process?"}],"opts":[{"k":"A","t":"Check the IPS logs for any other potential attacks"},{"k":"B","t":"Create a plan for removing malware from the web servers"},{"k":"C","t":"Disable any breached user accounts"},{"k":"D","t":"Disconnect the web servers from the network"}],"ans":["D"],"es":"Tras detectar el compromiso, lo siguiente es la contención: desconectar los servidores. La erradicación y recuperación vienen después.","en":"D. Disconnect the web servers from the network The unusual log entries on the web server indicate that the system may have been exploited. In that situation, the servers should be contained to prevent all connectivity to those systems.","enw":"A. Check the IPS logs for any other potential attacks Before looking for additional intrusions, the devices showing a potential exploit should be contained. B. Create a plan for removing malware from the web servers The eradication and recovery processes should occur after the systems have been isolated and contained. C. Disable any breached user accounts Disabling accounts is part of the recovery process, and it should occur after the exploited servers are contained."},{"id":"B32","exam":"B","n":32,"type":"mc","dom":4,"obj":"4.9","objtxt":"SY0-701, Objective 4.9- Log Data","qparts":[{"k":"p","v":"A security administrator is viewing the logs on a laptop in the shipping and receiving department and identifies these events:"},{"k":"code","v":"8:55:30 AM | D:\\Downloads\\ChangeLog-5.0.4.scr | Quarantine Success\n9:22:54 AM | C:\\Program Files\\Photo Viewer\\ViewerBase.dll | Quarantine Failure\n9:44:05 AM | C:\\Sales\\Sample32.dat | Quarantine Success"},{"k":"p","v":"Which of the following would BEST describe the circumstances surrounding these events?"}],"opts":[{"k":"A","t":"The antivirus application identified three viruses and quarantined two viruses"},{"k":"B","t":"The host-based firewall blocked two traffic flows"},{"k":"C","t":"A host-based allow list has blocked two applications from executing"},{"k":"D","t":"A network-based IPS has identified two known vulnerabilities"}],"ans":["A"],"es":"Son logs de antivirus: dos archivos pasaron a cuarentena con éxito y uno falló (en uso por el SO). No son firewall, allow list ni IPS.","en":"A. The antivirus application identified three viruses and quarantined two viruses The logs are showing the name of files on the local device and a quarantine disposition, which indicates that two of the files were moved (quarantined) to a separate area of the drive. This will prevent the malicious files from executing and will safely store the files for any future investigation. The second file in the list failed the quarantine process, and was most likely because the library was already in use by the operating system and could not be moved.","enw":"B. The host-based firewall blocked two traffic flows A host-based firewall will allow or deny traffic flows based on IP address, port number, application, or other criteria. A host-based firewall does not block traffic flows based on the name of an existing file, and the firewall process would not quarantine or move files to other folders. 8:55:30 AM | D:\\Downloads\\ChangeLog-5.0.4.scr | Quarantine Success 9:22:54 AM | C:\\Program Files\\Photo Viewer\\ViewerBase.dll | Quarantine Failure 9:44:05 AM | C:\\Sales\\Sample32.dat | Quarantine Success C. A host-based allow list has blocked two applications from executing The “quarantine” disposition refers to a file that has been moved from one location to another. An allow list function would simply stop the application from executing without changing the location of an application file. D. A network-based IPS has identified two known vulnerabilities The logs from a network-based IPS (Intrusion Prevention System) would not commonly be located on a user’s laptop, and those logs would display allow or deny dispositions based on the name of a known vulnerability. A network-based IPS would also not commonly move (quarantine) files on an end-user’s computer."},{"id":"B33","exam":"B","n":33,"type":"mc","dom":2,"obj":"2.3","objtxt":"SY0-701, Objective 2.3 - Mobile Device Vulnerabilities","qparts":[{"k":"p","v":"In the past, an organization has relied on the curated Apple App Store to avoid issues associated with malware and insecure applications. However, the IT department has discovered an iPhone in the shipping department with applications not available on the Apple App Store. How did the shipping department user install these apps on their mobile device?"}],"opts":[{"k":"A","t":"Side loading"},{"k":"B","t":"Malicious update"},{"k":"C","t":"VM escape"},{"k":"D","t":"Cross-site scripting"}],"ans":["A"],"es":"Side loading: instalar apps fuera de la tienda oficial, posible en iPhone tras hacer jailbreak.","en":"A. Side loading If Apple’s iOS has been circumvented using jailbreaking, a user can install apps without using the Apple App Store. Circumventing a curated app store to install an app manually is called side loading.","enw":"B. Malicious update A malicious update would patch an existing app and would not commonly install a different app onto a mobile device. C. VM escape VM (Virtual Machine) escape describes the unauthorized access of one VM from a different VM on the same hypervisor. An app installation on a phone is not related to virtual machines. D. Cross-site scripting Cross-site scripting is an attack that uses the trust in a browser to gain access to a third-party site. The installation of an app isn't commonly associated with cross-site scripting."},{"id":"B34","exam":"B","n":34,"type":"mc","dom":5,"obj":"5.6","objtxt":"SY0-701, Objective 5.6 - User Training","qparts":[{"k":"p","v":"A company has noticed an increase in support calls from attackers. These attackers are using social engineering to gain unauthorized access to customer data. Which of the following would be the BEST way to prevent these attacks?"}],"opts":[{"k":"A","t":"User training"},{"k":"B","t":"Next-generation firewall"},{"k":"C","t":"Internal audit"},{"k":"D","t":"Penetration testing"}],"ans":["A"],"es":"La ingeniería social por teléfono no la detiene la tecnología; la mejor defensa es capacitar a los usuarios.","en":"A. User training Many social engineering attacks do not involve technology, so the best way to prevent the attack is to properly train users to watch for these techniques.","enw":"B. Next-generation firewall A next-generation firewall can provide extensive protection against attacks involving technology, but a firewall can't stop a phone conversation or similar type of social engineering. C. Internal audit An internal audit may be able to recognize and report on the increase in social engineering attacks, but an audit does not provide a method of stopping the attack from originally occurring. D. Penetration testing Penetration testing can identify vulnerabilities and can attempt to exploit those vulnerabilities. Penetration testing does not block an attack from occurring."},{"id":"B35","exam":"B","n":35,"type":"mc","dom":5,"obj":"5.5","objtxt":"SY0-701, Objective 5.5 - Audits and Assessments","qparts":[{"k":"p","v":"As part of an internal audit, each department of a company has been asked to compile a list of all devices, operating systems, and applications in use. Which of the following would BEST describe this audit?"}],"opts":[{"k":"A","t":"Attestation"},{"k":"B","t":"Self-assessment"},{"k":"C","t":"Regulatory compliance"},{"k":"D","t":"Vendor monitoring"}],"ans":["B"],"es":"Self-assessment: la propia organización revisa sus activos y controles, sin auditor externo ni regulador.","en":"B. Self-assessment A self-assessment describes an organization performing their own security checks.","enw":"A. Attestation Attestation is commonly one of the last steps when performing an audit. This attestation is an opinion of the truth or accuracy of a company’s security position. C. Regulatory compliance Regulatory compliance is often required to validate a specific security posture. For example, an organization storing credit card information may be required by regulation to ensure the confidentiality of that data. This question does not mention any type of regulation as the reason for this information gathering. D. Vendor monitoring When working with a third-party, it's often important to maintain an ongoing audit and monitoring processes with the vendor. In this example, all of the information gathering is with internal company departments."},{"id":"B36","exam":"B","n":36,"type":"mc","dom":1,"obj":"1.2","objtxt":"SY0-701, Objective 1.2 - Gap Analysis","qparts":[{"k":"p","v":"A company is concerned about security issues at their remote sites. Which of the following would provide the IT team with more information of potential shortcomings?"}],"opts":[{"k":"A","t":"Gap analysis"},{"k":"B","t":"Policy administrator"},{"k":"C","t":"Change management"},{"k":"D","t":"Dependency list"}],"ans":["A"],"es":"Gap analysis compara la postura de seguridad actual con la deseada y muestra las deficiencias.","en":"A. Gap analysis A gap analysis is a formal process comparing the current security posture with where the company would like to be. This often examines many different aspects of the overall security environment.","enw":"B. Policy administrator The Policy Administrator is used in a zero-trust environment to generate access tokens or credentials. C. Change management The change management process is important for the controlled deployment of system changes, but it doesn't help provide an overview of security shortcomings. D. Dependency list A list of dependencies is often used during technical change management to plan for any potential changes. Before a change can occur, all of the dependencies associated with that change must be addressed."},{"id":"B37","exam":"B","n":37,"type":"mc","dom":2,"obj":"2.2","objtxt":"SY0-701, Objective 2.2 - Common Threat Vectors","qparts":[{"k":"p","v":"An attacker has identified a number of devices on a corporate network with the username of “admin” and the password of “admin.” Which of the following describes this situation?"}],"opts":[{"k":"A","t":"Open service ports"},{"k":"B","t":"Default credentials"},{"k":"C","t":"Unsupported systems"},{"k":"D","t":"Phishing"}],"ans":["B"],"es":"Credenciales por defecto (admin/admin) que nunca se cambiaron.","en":"B. Default credentials When a device is first installed, it will often have a default set of credentials such as admin/password or admin/admin. If these default credentials are never changed, they would allow access by anyone who knows the default configuration.","enw":"A. Open service ports Service ports are commonly opened when an inbound connection needs to be made to a service. For example, a web server will open ports 80 and 443 to allow all incoming traffic requests by the service. C. Unsupported systems Unsupported systems describe devices or services no longer supported by the manufacturer. An unsupported system may not receive ongoing security patches or updates. D. Phishing Phishing uses social engineering to obtain sensitive or private information. A device using the default credentials would not require a phishing attack to determine the valid username and password."},{"id":"B38","exam":"B","n":38,"type":"mc","dom":2,"obj":"2.2","objtxt":"SY0-701, Objective 2.2 - Watering Hole Attacks","qparts":[{"k":"p","v":"A security administrator attends an annual industry convention with other security professionals from around the world. Which of the following attacks would be MOST likely in this situation?"}],"opts":[{"k":"A","t":"Smishing"},{"k":"B","t":"Supply chain"},{"k":"C","t":"SQL injection"},{"k":"D","t":"Watering hole"}],"ans":["D"],"es":"Watering hole: atacar un lugar que visitan las víctimas, como una convención de profesionales de seguridad.","en":"D. Watering hole A watering hole attack infects a third-party visited by the intended victims. An industry convention would be a perfect location to attack security professionals.","enw":"A. Smishing Smishing, or SMS phishing, is a phishing attack over text messaging. A security administrator attending an industry event would not be the best possible scenario for smishing. B. Supply chain A supply chain attack infects part of the product manufacturing process in an attempt to also infect everything further down the chain. An industry trade event would not be a common vector for a supply chain attack. C. SQL injection A SQL (Structured Query Language) injection attack takes advantage of a software vulnerability to allow direct access to a SQL database. A SQL injection is not commonly directed towards an individual or an event."},{"id":"B39","exam":"B","n":39,"type":"mc","dom":3,"obj":"3.4","objtxt":"SY0-701, Objective 3.4 - Power Resiliency","qparts":[{"k":"p","v":"A transportation company headquarters is located in an area with frequent power surges and outages. The security administrator is concerned about the potential for downtime and hardware failures. Which of the following would provide the most protection against these issues? Select TWO."}],"opts":[{"k":"A","t":"UPS"},{"k":"B","t":"Parallel processing"},{"k":"C","t":"Snapshots"},{"k":"D","t":"Multi-cloud system"},{"k":"E","t":"Load balancing"},{"k":"F","t":"Generator"}],"ans":["A","F"],"es":"UPS (respaldo temporal) y generador (respaldo prolongado) protegen contra cortes y picos de energía. Balanceo o multi-nube no resuelven problemas eléctricos locales.","en":"A. UPS and F. Generator A UPS (Uninterruptible Power Supply) can provide backup power for a limited time when the main power source is unavailable, and a generator can maintain uptime as long as a fuel source is available.","enw":"B. Parallel processing Parallel processing uses multiple processors across multiple systems to improve the performance of an application. Parallel processing will not protect against power outages. C. Snapshots A snapshot is a type of backup commonly associated with virtual machines (VMs). Taking the snapshot of a VM can provide an easy method of reverting to an earlier configuration, but it doesn't help for power issues. D. Multi-cloud system An application hosted across multiple cloud providers would not provide any resiliency for power-related issues in a local data center. E. Load balancing Load balancers provide a method of managing busy services by increasing the number of available servers and balancing the load between them. A load balancer won't provide any help with power issues, however."},{"id":"B40","exam":"B","n":40,"type":"mc","dom":1,"obj":"1.4","objtxt":"SY0-701, Objective 1.4 - Certificates","qparts":[{"k":"p","v":"An organization has developed an in-house mobile device app for order processing. The developers would like the app to identify revoked server certificates without sending any traffic over the corporate Internet connection. Which of the following must be configured to allow this functionality?"}],"opts":[{"k":"A","t":"CSR generation"},{"k":"B","t":"OCSP stapling"},{"k":"C","t":"Key escrow"},{"k":"D","t":"Wildcard"}],"ans":["B"],"es":"OCSP stapling: el servidor adjunta el estado de revocación en el handshake TLS, así el cliente no consulta a la CA por Internet.","en":"B. OCSP stapling The use of OCSP (Online Certificate Status Protocol) requires communication between the client and the issuing CA (Certificate Authority). If the CA is an external organization, then validation checks will communicate across the Internet. The certificate holder can verify their own status and avoid client Internet traffic by storing the status information on an internal server and “stapling” the OCSP status into the SSL/TLS handshake.","enw":"A. CSR generation A CSR (Certificate Signing Request) is used during the key creation process. The certificate is sent to the CA to be signed as part of the CSR. C. Key escrow Key escrow will provide a third-party with access to decryption keys. The escrow process is not involved in real-time server revocation updates. D. Wildcard A wildcard certificate can be used across many different systems matching the fully qualified domain name associated with the wildcard."},{"id":"B41","exam":"B","n":41,"type":"mc","dom":3,"obj":"3.2","objtxt":"SY0-701, Objective 3.2 - Secure Communication","qparts":[{"k":"p","v":"A security administrator has been asked to build a network link to secure all communication between two remote locations. Which of the following would be the best choice for this task?"}],"opts":[{"k":"A","t":"SCAP"},{"k":"B","t":"Screened subnet"},{"k":"C","t":"IPsec"},{"k":"D","t":"Network access control"}],"ans":["C"],"es":"IPsec crea un túnel cifrado (VPN) entre dos ubicaciones.","en":"C. IPsec IPsec (Internet Protocol Security) is commonly used to create a VPN (Virtual Private Network) protected tunnel between devices or locations.","enw":"A. SCAP The SCAP (Security Content Automation Protocol) is used as a common protocol across multiple security tools. SCAP is not used to provide an encrypted tunnel between two locations. B. Screened subnet A screened subnet is a protected area commonly used to host public services without allowing access to an organization's internal private network. D. Network access control Network access control (NAC) describes the authentication and authorization process when devices connect to a network. NAC is not used to connect two sites over an encrypted channel."},{"id":"B42","exam":"B","n":42,"type":"mc","dom":2,"obj":"2.4","objtxt":"SY0-701, Objective 2.4 - Indicators of Compromise","qparts":[{"k":"p","v":"A Linux administrator has received a ticket complaining of response issues with a database server. After connecting to the server, the administrator views this information:"},{"k":"code","v":"Filesystem Size Used Avail Use% Mounted on\n/dev/xvda1 158G 158G 0 100% /"},{"k":"p","v":"Which of the following would BEST describe this information?"}],"opts":[{"k":"A","t":"Buffer overflow"},{"k":"B","t":"Resource consumption"},{"k":"C","t":"SQL injection"},{"k":"D","t":"Race condition"}],"ans":["B"],"es":"Resource consumption: el sistema de archivos está al 100% sin espacio disponible y el servidor responde lento.","en":"B. Resource consumption The available storage on the local filesystem has been depleted, and the information shows 0 bytes available. More drive space would need to be available for the server to return to normal response times.","enw":"A. Buffer overflow A buffer overflow allows an attacker to manipulate the contents of memory. A filesystem at 100% utilization does not describe the contents in memory. C. SQL injection A SQL injection is a network attack type used to access database information directly. A SQL injection would not cause significant storage drive utilization. D. Race condition A race condition is a programming issue where a portion of the application is making changes not seen by other parts of the application. A race condition does not commonly use all available storage space on the device."},{"id":"B43","exam":"B","n":43,"type":"mc","dom":3,"obj":"3.3","objtxt":"SY0-701, Objective 3.3 - Protecting Data","qparts":[{"k":"p","v":"Which of the following can be used for credit card transactions from a mobile device without sending the actual credit card number across the network?"}],"opts":[{"k":"A","t":"Tokenization"},{"k":"B","t":"Hashing"},{"k":"C","t":"Steganography"},{"k":"D","t":"Masking"}],"ans":["A"],"es":"Tokenización: se envía un token de un solo uso en lugar del número real de la tarjeta (por ejemplo, pagos NFC).","en":"A. Tokenization Tokenization replaces sensitive data with a non-sensitive placeholder. Tokenization is commonly used for NFC (Near-Field Communication) payment systems, and sends a single-use token across the network instead of the actual credit card information.","enw":"B. Hashing Hashing creates a digital \"fingerprint\" of data, but hashing isn't used to transfer card numbers or other financial details from one device to another. C. Steganography Steganography describes hiding data within other media types. For example, it's common to use steganography to hide text documents within an image file. However, steganography is not commonly used to transfer credit card transactions across the network. D. Masking Data masking hides some of the original data to protect sensitive information. Credit card transfers cannot omit or hide data necessary to complete the transaction."},{"id":"B44","exam":"B","n":44,"type":"mc","dom":4,"obj":"4.4","objtxt":"SY0-701, Objective 4.4 - Security Monitoring","qparts":[{"k":"p","v":"A security administrator receives a report each week showing a Linux vulnerability associated with a Windows server. Which of the following would prevent this information from appearing in the report?"}],"opts":[{"k":"A","t":"Alert tuning"},{"k":"B","t":"Application benchmarking"},{"k":"C","t":"SIEM aggregation"},{"k":"D","t":"Data archiving"}],"ans":["A"],"es":"Alert tuning: ajustar las reglas de alertas para eliminar falsos positivos, como una vulnerabilidad de Linux en un servidor Windows.","en":"A. Alert tuning Our monitoring systems are not always perfect, and many require ongoing tuning to properly configure alerts and notifications of important events.","enw":"B. Application benchmarking Creating an application benchmark can help with the planning and implementation of security monitoring. However, the creation of an application benchmark does not change the alert messages created by a third-party monitoring system. C. SIEM aggregation A SIEM (Security Information and Event Manager) can be used to aggregate all log files to a centralized reporting system. Creating a centralized log repository does not remove invalid alerts from a weekly report. D. Data archiving Many organizations are required to archive data for long-term security monitoring. Simply archiving the data does not change the alert notification in a weekly report."},{"id":"B45","exam":"B","n":45,"type":"mc","dom":4,"obj":"4.3","objtxt":"SY0-701, Objective 4.3 - Analyzing Vulnerabilities","qparts":[{"k":"p","v":"Which of the following would a company use to calculate the loss of a business activity if a vulnerability is exploited?"}],"opts":[{"k":"A","t":"Risk tolerance"},{"k":"B","t":"Vulnerability classification"},{"k":"C","t":"Environmental variables"},{"k":"D","t":"Exposure factor"}],"ans":["D"],"es":"Exposure factor (factor de exposición): porcentaje de pérdida de valor si se explota la vulnerabilidad.","en":"D. Exposure factor An exposure factor describes a loss of value to the organization. For example, a network throughput issue might limit access to half of the users, creating a 50% exposure factor. A completely disabled service would calculated as a 100% exposure factor.","enw":"A. Risk tolerance Risk tolerance describes the amount of risk that would be acceptable to an organization. For example, an organization may tolerate the risk involved with a delay so that patches can be tested prior to deployment. B. Vulnerability classification Most vulnerabilities are classified into categories and are often assigned a score to designate the severity of the known vulnerability. C. Environmental variables An environmental variable is considered when prioritizing patches and security responses. For example, a device in the production network environment will probably have priority over the devices in a test lab environment."},{"id":"B46","exam":"B","n":46,"type":"mc","dom":5,"obj":"5.4","objtxt":"SY0-701, Objective 5.4 - Compliance","qparts":[{"k":"p","v":"An administrator is designing a network to be compliant with a security standard for storing credit card numbers. Which of the following would be the BEST choice to provide this compliance?"}],"opts":[{"k":"A","t":"Implement RAID for all storage systems"},{"k":"B","t":"Connect a UPS to all servers"},{"k":"C","t":"DNS should be available on redundant servers"},{"k":"D","t":"Perform regular audits and vulnerability scans"}],"ans":["D"],"es":"Para cumplir con el estándar de tarjetas (confidencialidad) lo adecuado son auditorías periódicas y escaneos de vulnerabilidades.","en":"D. Perform regular audits and vulnerability scans A focus of credit card storage compliance is to keep credit card information private. The only option matching this requirement is scheduled audits and ongoing vulnerability scans.","enw":"A. Implement RAID for all storage systems RAID (Redundant Array of Independent Disks) is an important consideration for any project that stores data, but using a RAID array is not part of this compliance requirement. Although compliance may include backups, RAID is not a backup technology. B. Connect a UPS to all servers Integrating a UPS (Uninterruptible Power Supply) is an important way to maintain power during an outage, but it's not required for security compliance for data storage. C. DNS should be available on redundant servers Name resolution can be an important service on the network, but maintaining redundant DNS servers isn't required for compliance with sensitive data storage."},{"id":"B47","exam":"B","n":47,"type":"mc","dom":5,"obj":"5.3","objtxt":"SY0-701, Objective 5.3 - Third-party Risk Assessment","qparts":[{"k":"p","v":"A company is accepting proposals for an upcoming project, and one of the responses is from a business owned by a board member. Which of the following would describe this situation?"}],"opts":[{"k":"A","t":"Due diligence"},{"k":"B","t":"Vendor monitoring"},{"k":"C","t":"Conflict of interest"},{"k":"D","t":"Right-to-audit"}],"ans":["C"],"es":"Conflicto de interés: una propuesta de una empresa de un miembro de la junta puede comprometer la imparcialidad.","en":"C. Conflict of interest A conflict of interest occurs when a personal interest in a business transaction could compromise the judgment of the people involved. Personal and family relationships between organizations may potentially be a conflict of interest.","enw":"A. Due diligence Due diligence is the process of investigating and verifying information before doing business with an organization. B. Vendor monitoring Vendor monitoring involves ongoing management of the vendor relationship, including ongoing reviews, periodic audits, and other checks and balances. D. Right-to-audit A right-to-audit clause is commonly added to business contracts to ensure access to periodic audits when working with a third-party."},{"id":"B48","exam":"B","n":48,"type":"mc","dom":4,"obj":"4.6","objtxt":"SY0-701, Objective 4.6 - Multi-factor Authentication","qparts":[{"k":"p","v":"A company has rolled out a new application that requires the use of a hardware-based token generator. Which of the following would be the BEST description of this access feature?"}],"opts":[{"k":"A","t":"Something you know"},{"k":"B","t":"Somewhere you are"},{"k":"C","t":"Something you are"},{"k":"D","t":"Something you have"}],"ans":["D"],"es":"Un generador de tokens de hardware es algo que tienes.","en":"D. Something you have The use of the hardware token generator requires the user be in possession of the device during the login process.","enw":"A. Something you know The number, or token, created by the token generator isn’t previously known by the user, and there’s no requirement to remember the tokens once the authentication process is complete. B. Somewhere you are The location of an individual can be a useful authentication factor when evaluating the validity of a login request. Someone authenticating from an unexpected location or country may be subject to additional authentication checks. C. Something you are Something you are describes a biometric factor, such as a fingerprint or facial scan. The token generator works without any type of biometric scan."},{"id":"B49","exam":"B","n":49,"type":"mc","dom":5,"obj":"5.3","objtxt":"SY0-701, Objective 5.3 - Agreement Types","qparts":[{"k":"p","v":"A company has signed an SLA with an Internet service provider. Which of the following would BEST describe the requirements of this SLA?"}],"opts":[{"k":"A","t":"The customer will connect to remote sites over an IPsec tunnel"},{"k":"B","t":"The service provider will provide 99.99% uptime"},{"k":"C","t":"The customer applications use HTTPS over tcp/443"},{"k":"D","t":"Customer application use will be busiest on the 15th of each month"}],"ans":["B"],"es":"Un SLA (Service Level Agreement) fija mínimos del servicio, como 99.99% de disponibilidad.","en":"B. The service provider will provide 99.99% uptime An SLA (Service Level Agreement) is a contract specifying the minimum terms for provided services. It’s common to include uptime, response times, and other service metrics in an SLA.","enw":"A. The customer will connect to remote sites over an IPsec tunnel A service level agreement describes the minimum service levels provided to the customer. You would not commonly see descriptions of how the service will be used in the SLA contract. C. The customer applications use HTTPS over tcp/443 The protocols used by the customer’s applications aren’t part of the service requirements from the ISP. D. Customer application use will be busiest on the 15th of each month The customer’s application usage isn’t part of the service requirements from the ISP."},{"id":"B50","exam":"B","n":50,"type":"mc","dom":2,"obj":"2.4","objtxt":"SY0-701, Objective 2.4 - Other Social Engineering Attacks","qparts":[{"k":"p","v":"An attacker has created multiple social media accounts and is posting information in an attempt to get the attention of the media. Which of the following would BEST describe this attack?"}],"opts":[{"k":"A","t":"On-path"},{"k":"B","t":"Watering hole"},{"k":"C","t":"Misinformation campaign"},{"k":"D","t":"Phishing"}],"ans":["C"],"es":"Campaña de desinformación (misinformation): cuentas falsas en redes sociales para atraer a los medios.","en":"C. Misinformation campaign Misinformation campaigns are carefully crafted attacks that exploit social media and traditional media.","enw":"A. On-path An on-path attack uses an attacker in the middle of a conversation to capture or modify information as it traverses the network. B. Watering hole A watering hole attack uses a carefully selected attack location to infect visitors to a specific website. D. Phishing A phishing attack uses social engineering to convince the victim to disclose private or sensitive information."},{"id":"B51","exam":"B","n":51,"type":"mc","dom":3,"obj":"3.3","objtxt":"SY0-701, Objective 3.3 - Protecting Data","qparts":[{"k":"p","v":"Which of the following would be the BEST way to protect credit card account information when performing real-time purchase authorizations?"}],"opts":[{"k":"A","t":"Masking"},{"k":"B","t":"DLP"},{"k":"C","t":"Tokenization"},{"k":"D","t":"NGFW"}],"ans":["C"],"es":"Tokenización protege el número de tarjeta en autorizaciones en tiempo real, porque no se transmite el número real.","en":"C. Tokenization Tokenization is a technique that replaces user data with a non-sensitive placeholder, or token. Tokenization is commonly used on mobile devices during a purchase to use a credit card without transmitting the physical credit card number across the network.","enw":"A. Masking Data masking hides sensitive data by replacing the information with a non-sensitive alternative. An example of masking would be replacing an account number on a receipt with hash marks or asterisks. B. DLP DLP (Data Loss Prevention) solutions can identify and block sensitive data from being sent over the network. DLP does not provide any additional security or protection for real-time financial transactions. D. NGFW An NGFW (Next-Generation Firewall) is an application-aware security technology. NGFW solutions can provide additional controls for specific applications, but they won't provide any additional account protections when sending financial details."},{"id":"B52","exam":"B","n":52,"type":"mc","dom":3,"obj":"3.3","objtxt":"SY0-701, Objective 3.3 - States of Data","qparts":[{"k":"p","v":"A company must comply with legal requirements for storing customer data in the same country as the customer's mailing address. Which of the following would describe this requirement?"}],"opts":[{"k":"A","t":"Geographic dispersion"},{"k":"B","t":"Least privilege"},{"k":"C","t":"Data sovereignty"},{"k":"D","t":"Exfiltration"}],"ans":["C"],"es":"Data sovereignty: los datos están sujetos a las leyes del país donde residen y pueden exigir que se guarden allí.","en":"C. Data sovereignty Data sovereignty laws can mandate how data is handled and stored. Data residing in a country is usually subject to the laws of that country, and compliance regulations may not allow the data to be moved outside of the country.","enw":"A. Geographic dispersion Geographic dispersion describes a data resiliency technique for distributing data to different locations to maintain uptime and availability. B. Least privilege Least privilege refers to a set of rights and permissions that would limit access based on a user's job requirements. Least privilege does not describe the storage of information based on a geographic location. D. Exfiltration Exfiltration describes the removal or theft of data by a third-party. Exfiltration is not associated with the geographic storage of information."},{"id":"B53","exam":"B","n":53,"type":"mc","dom":4,"obj":"4.1","objtxt":"SY0-701, Objective 4.1 - Wireless Security Settings","qparts":[{"k":"p","v":"A company is installing access points in all of their remote sites. Which of the following would provide confidentiality for all wireless data?"}],"opts":[{"k":"A","t":"802.1X"},{"k":"B","t":"WPA3"},{"k":"C","t":"RADIUS"},{"k":"D","t":"MDM"}],"ans":["B"],"es":"WPA3 cifra todo el tráfico inalámbrico (confidencialidad). 802.1X y RADIUS son para autenticación.","en":"B. WPA3 WPA3 (Wi-Fi Protected Access 3) is an encryption protocol used on wireless networks. All data sent over a WPA3-protected wireless network will be encrypted.","enw":"A. 802.1X 802.1X is a standard for authentication using AAA (Authentication, Authorization and Accounting) services. 802.1X is commonly used in conjunction with LDAP, RADIUS, or similar authentication services. C. RADIUS RADIUS (Remote Authentication Dial-In User Service) is an authentication protocol used for centralized authentication. RADIUS is commonly used in conjunction with 802.1X, but RADIUS does not provide data confidentiality or encryption. D. MDM An MDM (Mobile Device Manager) is used to manage and control an organization's mobile phones and tablets. MDM policies are not used to manage the confidentiality settings of a wireless access point."},{"id":"B54","exam":"B","n":54,"type":"mc","dom":2,"obj":"2.4","objtxt":"SY0-701, Objective 2.4 - Other Malware Types","qparts":[{"k":"p","v":"A security administrator has found a keylogger installed in an update of the company's accounting software. Which of the following would prevent the transmission of the collected logs?"}],"opts":[{"k":"A","t":"Prevent the installation of all software"},{"k":"B","t":"Block all unknown outbound network traffic at the Internet firewall"},{"k":"C","t":"Install host-based anti-virus software"},{"k":"D","t":"Scan all incoming email attachments at the email gateway"}],"ans":["B"],"es":"Un keylogger graba y envía lo capturado. Bloquear el tráfico saliente desconocido en el firewall impide la transmisión.","en":"B. Block all unknown outbound network traffic at the Internet firewall Keylogging software has two major functions; record user input, and transmit that information to a remote location. Local file scanning and software best-practices can help prevent the initial installation, and controlling outbound network traffic can block unauthorized file transfers.","enw":"A. Prevent the installation of all software Blocking software installations may prevent the initial malware infection, but it won’t provide any control of outbound data. C. Install host-based anti-virus software A good anti-virus application can identify malware before the installation occurs, but anti-virus does not commonly provide any control of network communication. D. Scan all incoming email attachments at the email gateway Malware can be installed from many sources, and sometimes the source is unexpected. Scanning or blocking executables at the email gateway can help prevent infection but it won’t provide any control of outbound file transfers."},{"id":"B55","exam":"B","n":55,"type":"mc","dom":1,"obj":"1.4","objtxt":"SY0-701, Objective 1.4 - Certificates","qparts":[{"k":"p","v":"A user in the marketing department is unable to connect to the wireless network. After authenticating with a username and password, the user receives this message:"},{"k":"code","v":"-- -- --\nThe connection attempt could not be completed.\nThe Credentials provided by the server could not be validated.\nRadius Server: radius.example.com\nRoot CA: Example.com Internal CA Root Certificate\n-- -- --"},{"k":"p","v":"The access point is configured with WPA3 encryption and 802.1X authentication."},{"k":"p","v":"Which of the following is the MOST likely reason for this login issue?"}],"opts":[{"k":"A","t":"The user’s computer is in the incorrect VLAN"},{"k":"B","t":"The RADIUS server is not responding"},{"k":"C","t":"The user’s computer does not support WPA3 encryption"},{"k":"D","t":"The user is in a location with an insufficient wireless signal"},{"k":"E","t":"The client computer does not have the proper certificate installed"}],"ans":["E"],"es":"El error dice que no se pudo validar el servidor RADIUS: el cliente no tiene instalado el certificado de la CA raíz correcta.","en":"E. The client computer does not have the proper certificate installed The error message states that the server credentials could not be validated. This indicates that the certificate authority that signed the server’s certificate is either different than the CA certificate installed on the client’s workstation, or the client workstation does not have an installed copy of the CA’s certificate. This validation process ensures that the client is communicating to a trusted server and there are no on-path attacks occurring.","enw":"A. The user’s computer is in the incorrect VLAN The RADIUS server certificate validation process should work properly from all VLANs. The error indicates that the communication process is working properly, so an incorrect VLAN would not be the cause of this issue. B. The RADIUS server is not responding If the RADIUS server had no response to the user, then the process would simply timeout. In this example, the error message indicates that the communication process is working between the RADIUS server and the client’s computer. C. The user’s computer does not support WPA3 encryption The first step when connecting to a wireless network is to associate with the 802.11 access point. If WPA3 encryption was not supported, the authentication process would not have occurred and the user’s workstation would not have seen the server credentials. D. The user is in a location with an insufficient wireless signal The error message regarding server validation indicates that the wireless signal is strong enough to send and receive data on the wireless network."},{"id":"B56","exam":"B","n":56,"type":"mc","dom":2,"obj":"2.4","objtxt":"SY0-701, Objective 2.4 - Cryptographic Attacks","qparts":[{"k":"p","v":"A security administrator has created a new policy prohibiting the use of MD5 hashes due to collision problems. Which of the following describes the reason for this new policy?"}],"opts":[{"k":"A","t":"Two different messages have different hashes"},{"k":"B","t":"The original message can be derived from the hash"},{"k":"C","t":"Two identical messages have the same hash"},{"k":"D","t":"Two different messages share the same hash"}],"ans":["D"],"es":"Colisión: dos mensajes distintos generan el mismo hash, por eso MD5 ya no es recomendable.","en":"D. Two different messages share the same hash A well-designed hashing algorithm will create a unique hash value for every possible input. If two different inputs create the same hash, the hash algorithm has created a collision.","enw":"A. Two different messages have different hashes In normal operation, two different inputs will create two different hash outputs. B. The original message can be derived from the hash Hashing is a one-way cipher, and you cannot derive the original message from a hash value. C. Two identical messages have the same hash Two identical messages should always create exactly the same hash output."},{"id":"B57","exam":"B","n":57,"type":"mc","dom":2,"obj":"2.5","objtxt":"SY0-701, Objective 2.5 - Hardening Techniques","qparts":[{"k":"p","v":"A security administrator has been tasked with hardening all internal web servers to control access from certain IP address ranges and ensure all transferred data remains confidential. Which of the following should the administrator include in his project plan? (Select TWO)"}],"opts":[{"k":"A","t":"Change the administrator password"},{"k":"B","t":"Use HTTPS for all server communication"},{"k":"C","t":"Uninstall all unused software"},{"k":"D","t":"Enable a host-based firewall"},{"k":"E","t":"Install the latest operating system update"}],"ans":["B","D"],"es":"HTTPS cifra las comunicaciones y un firewall de host permite filtrar por rangos de IP. Las otras tareas son válidas pero no cumplen ambos objetivos.","en":"B. Use HTTPS for all server communication, and D. Enable a host-based firewall Using the secure HTTPS (Hypertext Transfer Protocol Secure) protocol will ensure that all network communication is encrypted between the web server and the client devices. A host-based firewall can be used to allow or disallow traffic from certain IP address ranges.","enw":"A. Change the administrator password Occasionally changing administrator passwords is a good best practice, but it doesn't directly address the goals of IP address filtering and data confidentiality. C. Uninstall all unused software Uninstalling unused software is an important hardening technique, but uninstalling software does not control access from IP address ranges, and it does not provide any data confidentiality. E. Install the latest operating system update Installing an operating system update can be a useful security task, but an OS update does not directly encrypt network traffic and does not control access from certain IP addresses."},{"id":"B58","exam":"B","n":58,"type":"mc","dom":4,"obj":"4.8","objtxt":"SY0-701, Objective 4.8 - Digital Forensics","qparts":[{"k":"p","v":"A security administrator has identified the installation of ransomware on a database server and has quarantined the system. Which of the following should be followed to ensure that the integrity of the evidence is maintained?"}],"opts":[{"k":"A","t":"E-discovery"},{"k":"B","t":"Non-repudiation"},{"k":"C","t":"Chain of custody"},{"k":"D","t":"Legal hold"}],"ans":["C"],"es":"Chain of custody: registro documentado de quién tocó la evidencia, que conserva su integridad.","en":"C. Chain of custody A chain of custody is a documented record of the evidence. The chain of custody also documents the interactions of every person who comes into contact with the evidence to maintain the integrity.","enw":"A. E-discovery E-discovery is the process of collecting, preparing, reviewing, interpreting, and producing electronic documents. However, e-discovery does not provide any additional integrity of the data. B. Non-repudiation Non-repudiation ensures the author of a document cannot be disputed. Non-repudiation does not provide any method of tracking and managing digital evidence. D. Legal hold A legal hold is a technique for preserving important evidence, but it doesn't provide any mechanism for the ongoing integrity of that evidence."},{"id":"B59","exam":"B","n":59,"type":"mc","dom":3,"obj":"3.1","objtxt":"SY0-701, Objective 3.1 - Network Infrastructure Concepts","qparts":[{"k":"p","v":"Which of the following would be the BEST option for application testing in an environment completely separated from the production network?"}],"opts":[{"k":"A","t":"Virtualization"},{"k":"B","t":"VLANs"},{"k":"C","t":"Cloud computing"},{"k":"D","t":"Air gap"}],"ans":["D"],"es":"Air gap: aislamiento físico total; no existe ruta posible hacia producción. VLAN y virtualización pueden mal configurarse.","en":"D. Air gap An air gapped network removes all connectivity between components and ensures there would be no possible communication path between the test network and the production network.","enw":"A. Virtualization Although virtualization provides the option to connect devices in a private network, there’s still the potential for a misconfigured network configuration or an application to communicate externally. B. VLANs VLANs (Virtual Local Area Networks) are a common segmentation technology, but a router could easily connect the VLANs to the production network. C. Cloud computing Cloud-based technologies provide for many network options, and it’s common to maintain a connection between the cloud and the rest of the network."},{"id":"B60","exam":"B","n":60,"type":"mc","dom":3,"obj":"3.2","objtxt":"SY0-701, Objective 3.2 - Intrusion Prevention","qparts":[{"k":"p","v":"A security engineer is planning the installation of a new IPS. The network must remain operational if the IPS is turned off or disabled. Which of the following would describe this configuration?"}],"opts":[{"k":"A","t":"Containerization"},{"k":"B","t":"Load balancing"},{"k":"C","t":"Fail open"},{"k":"D","t":"Tunneling"}],"ans":["C"],"es":"Fail open: si el IPS falla o se apaga, el tráfico sigue pasando y la red continúa operativa.","en":"C. Fail open An IPS (Intrusion Prevention System) designed to fail open will maintain network connectivity during an outage or failure of the IPS. Even if the IPS was not actively preventing an intrusion, the network would still be up and running.","enw":"A. Containerization Application containerization describes the process of creating a deployment strategy where each application runs in a self-contained image. Containerization allows organizations to quickly deploy and run different application instances on the same hardware. B. Load balancing A load balancer will divide a single load among many different servers to provide faster response and a more efficient use of network resources. Load balancers do not maintain connectivity for an intrusion prevention system. D. Tunneling Tunneling describes the process of transferring data inside of another protocol type, such as sending encrypted data over a VPN (Virtual Private Network). Tunneling would not maintain network connectivity if an IPS was to fail."},{"id":"B61","exam":"B","n":61,"type":"mc","dom":3,"obj":"3.3","objtxt":"SY0-701, Objective 3.3 - Protecting Data","qparts":[{"k":"p","v":"Which of the following describes the process of hiding data from others by embedding the data inside of a different media type?"}],"opts":[{"k":"A","t":"Hashing"},{"k":"B","t":"Obfuscation"},{"k":"C","t":"Encryption"},{"k":"D","t":"Masking"}],"ans":["B"],"es":"Esconder datos dentro de otro medio (esteganografía) es una forma de ofuscación (obfuscation).","en":"B. Obfuscation Obfuscation is the process of taking something normally understandable and making it very difficult to understand or to be seen. One common obfuscation method used by steganography is to embed a document within an image file.","enw":"A. Hashing Hashing creates a digital \"fingerprint\" based on the contents of data. This hash provides a method of checking data integrity, but it doesn't hide data within other media types. C. Encryption Encrypting source code will provide data confidentiality, but encrypting the data does not require any type of subterfuge. Conversely, hiding data within another media type does not necessarily require any type of encryption. D. Masking Data masking hides portions of the data by replacing it with a different value. For example, replacing a credit card number with a series of asterisks would be a common form of data masking."},{"id":"B62","exam":"B","n":62,"type":"mc","dom":2,"obj":"2.1","objtxt":"SY0-701, Objective 2.1 - Threat Actors","qparts":[{"k":"p","v":"Which of the following vulnerabilities would be the MOST significant security concern when protecting against a hacktivist?"}],"opts":[{"k":"A","t":"D
