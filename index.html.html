cación.","en":"C. SQL injection The SQL injection is contained in the application data. The attacker was attempting to circumvent the authentication through the use of equivalent SQL statements ('x'='x').","enw":"A. Phishing Phishing attempts use social engineering to gain access to private or sensitive information. This example does not appear to contain any private information. B. Brute force A brute force attempt would include many failed attempts at a password. This log does not appear to have any repeated password attempts. D. Cross-site scripting Cross-site scripting takes advantage of the trust a user has for a site. This example does not appear to take advantage of any previous authentication or trust."},{"id":"C26","exam":"C","n":26,"type":"mc","dom":3,"obj":"3.4","objtxt":"SY0-701, Objective 3.4 - Recovery Testing","qparts":[{"k":"p","v":"An incident response team would like to validate their disaster recovery plans without making any changes to the infrastructure. Which of the following would be the best course of action?"}],"opts":[{"k":"A","t":"Tabletop exercise"},{"k":"B","t":"Hot site fail-over"},{"k":"C","t":"Simulation"},{"k":"D","t":"Penetration test"}],"ans":["A"],"es":"Tabletop exercise: se repasa el plan de recuperación en una sala, sin cambios a la infraestructura.","en":"A. Tabletop exercise A tabletop exercise is a walk-through exercise where the disaster recovery process can be discussed in a conference room without making any changes to the existing systems.","enw":"B. Hot site fail-over A fail-over to a hot site would involve significant changes to the infrastructure, services, and operations teams. C. Simulation A simulation is a useful test of disaster recovery processes, but it often requires a change to the existing systems to properly test the simulated disaster. D. Penetration test A penetration test will identify vulnerabilities, but it will not provide any evaluation of the disaster recovery process or policies."},{"id":"C27","exam":"C","n":27,"type":"mc","dom":4,"obj":"4.5","objtxt":"SY0-701, Objective 4.5 - Firewalls","qparts":[{"k":"p","v":"A system administrator has installed a new firewall between the corporate user network and the data center network. When the firewall is turned on with the default settings, users complain the application in the data center is no longer working. Which of the following would be the BEST way to correct this application issue?"}],"opts":[{"k":"A","t":"Create a single firewall rule with an explicit deny"},{"k":"B","t":"Build a separate VLAN for the application"},{"k":"C","t":"Create firewall rules that match the application traffic flow"},{"k":"D","t":"Enable firewall threat blocking"}],"ans":["C"],"es":"Los firewalls niegan todo por defecto (implicit deny). Hay que crear reglas que coincidan con el flujo de la aplicación.","en":"C. Create firewall rules that match the application traffic flow By default, most firewalls implicitly deny all traffic. Firewall rules must be built to match the traffic flows, and only then will traffic pass through the firewall.","enw":"A. Create a single firewall rule with an explicit deny By default, most firewalls have an implicit deny as the last policy in the firewall rules. If traffic does not match any other firewall rule, then the implicit deny drops the traffic. Manually configuring an explicit deny doesn’t provide any additional traffic control because of the already\u0002existing implicit deny, and it doesn’t allow any traffic to pass through the firewall because the rule itself denies all traffic. B. Build a separate VLAN for the application VLAN (Virtual Local Area Network) separation can be used to manage traffic flows or provide additional security options, but creating a VLAN won’t bypass an existing firewall deny rule. D. Enable firewall threat blocking Many next-generation firewalls can identify and block malicious network traffic in real-time. However, enabling this feature would not resolve any existing communication issues between the user network and the data center network."},{"id":"C28","exam":"C","n":28,"type":"mc","dom":3,"obj":"3.4","objtxt":"SY0-701, Objective 3.4 - Power Resiliency","qparts":[{"k":"p","v":"Which of these would be used to provide HA for a web-based database application?"}],"opts":[{"k":"A","t":"SIEM"},{"k":"B","t":"UPS"},{"k":"C","t":"DLP"},{"k":"D","t":"VPN concentrator"}],"ans":["B"],"es":"De esta lista, el UPS es lo que aporta alta disponibilidad (HA), porque mantiene la energía si falla la red eléctrica.","en":"B. UPS HA (High Availability) means the service should always be on and available. The only device on this list providing HA is the UPS (Uninterruptible Power Supply). If power is lost, the UPS will provide electricity using battery power or a gas-powered generator.","enw":"A. SIEM A SIEM (Security Information and Event Management) system consolidates data from devices on the network and provides log searching and reporting features. A SIEM does not provide any HA functionality. C. DLP DLP (Data Loss Prevention) is a method of identifying and preventing the transfer of personal or confidential information through the network. DLP does not provide any HA functionality. D. VPN concentrator A VPN (Virtual Private Network) concentrator is used as an endpoint to an endpoint VPN solution. VPN concentrators do not provide any HA functionality."},{"id":"C29","exam":"C","n":29,"type":"mc","dom":5,"obj":"5.2","objtxt":"SY0-701, Objective 5.2 - Risk Analysis","qparts":[{"k":"p","v":"Each year, a certain number of laptops are lost or stolen and must be replaced by the company. Which of the following would describe the total cost the company spends each year on laptop replacements?"}],"opts":[{"k":"A","t":"SLE"},{"k":"B","t":"SLA"},{"k":"C","t":"ALE"},{"k":"D","t":"ARO"}],"ans":["C"],"es":"ALE (Annual Loss Expectancy): costo total anual (SLE x ARO), aquí por reposición de laptops.","en":"C. ALE The ALE (Annual Loss Expectancy) is the total amount of the financial loss over an entire year.","enw":"A. SLE SLE (Single Loss Expectancy) describes the loss for a single incident. B. SLA SLA (Service Level Agreement) is a contractual agreement that specifies a minimum service level. D. ARO An ARO (Annualized Rate of Occurrence) is the number of times an event is expected to occur in a year."},{"id":"C30","exam":"C","n":30,"type":"mc","dom":4,"obj":"4.1","objtxt":"SY0-701, Objective 4.1 - Application Security","qparts":[{"k":"p","v":"A network administrator is viewing a log file from a web server:"},{"k":"code","v":"https://www.example.com/?s=/Index/think/app/invokefunction&function=call_user_func_array&vars[0]=md5&vars[1][0]=__HelloThinkPHP"},{"k":"p","v":"Which of the following would be the BEST way to prevent this attack?"}],"opts":[{"k":"A","t":"Static code analyzer"},{"k":"B","t":"Input validation"},{"k":"C","t":"Allow list"},{"k":"D","t":"Secure cookies"}],"ans":["B"],"es":"La URL intenta ejecutar código remoto mediante parámetros. La validación de entrada (input validation) lo bloquea.","en":"B. Input validation In this example, the attacker is attempting to use a remote code execution exploit. Input validation can be used to create a very specific filter of allowed input, and a strict validation process would have prevented the web server from processing this attack information.","enw":"A. Static code analyzer A static code analyzer is useful when evaluating the security of existing source code. In this example, the input is dynamic and is initiated by the attacker. C. Allow list An allow list would limit user access to an application, but it would not limit the type of input from the users. D. Secure cookies Secure cookies ensure the information contained in the browser cookie is encrypted and only viewable by the end user. Secure cookies would not prevent a remote code execution attack."},{"id":"C31","exam":"C","n":31,"type":"mc","dom":1,"obj":"1.4","objtxt":"SY0-701, Objective 1.4 - Hashing and Digital Signatures","qparts":[{"k":"p","v":"Sam would like to send an email to Jack and have Jack verify that Sam was the sender of the email. Which of these should Sam use to provide this verification?"}],"opts":[{"k":"A","t":"Digitally sign with Sam’s private key"},{"k":"B","t":"Digitally sign with Sam’s public key"},{"k":"C","t":"Digitally sign with Jack’s private key"},{"k":"D","t":"Digitally sign with Jack’s public key"}],"ans":["A"],"es":"Sam firma con su clave privada y Jack verifica con la clave pública de Sam: integridad, autenticación y no repudio.","en":"A. Digitally sign with Sam’s private key The sender of a message digitally signs with their own private key to ensure integrity, authentication, and non-repudiation of the signed contents. The digital signature is validated with the sender’s public key.","enw":"B. Digitally sign with Sam’s public key Since everyone effectively has access to all public keys, adding a digital signature with a publicly available key doesn’t provide any security features. C. Digitally sign with Jack’s private key Jack’s private key would only be available to Jack, so Sam could not possibly use Jack’s private key when performing any cryptographic functions. D. Digitally sign with Jack’s public key Since Jack's public key would be available to anyone, using Jack’s public key for a digital signature would not provide any security features."},{"id":"C32","exam":"C","n":32,"type":"mc","dom":5,"obj":"5.1","objtxt":"SY0-701, Objective 5.1 - Security Procedures","qparts":[{"k":"p","v":"The contract of a long-term temporary employee is ending. Which of these would be the MOST important part of the off-boarding process?"}],"opts":[{"k":"A","t":"Perform an on-demand audit of the user’s privileges"},{"k":"B","t":"Archive the decryption keys associated with the user account"},{"k":"C","t":"Document the user’s outstanding tasks"},{"k":"D","t":"Obtain a signed copy of the Acceptable Use Policies"}],"ans":["B"],"es":"Sin las claves de descifrado archivadas, los archivos cifrados del usuario quedarían inaccesibles: es lo más crítico en el offboarding.","en":"B. Archive the decryption keys associated with the user account Without the decryption keys, it will be impossible to access any of the user’s protected files once they leave the company. Given the other possible answers, this one is the only one that would result in unrecoverable data loss if not properly followed.","enw":"A. Perform an on-demand audit of the user’s privileges The user’s account will be disabled once they leave the organization, so an audit of their privileges would not be very useful. C. Document the user’s outstanding tasks Creating documentation is important, but it’s not as important as retaining the user’s data with the decryption keys. D. Obtain a signed copy of the Acceptable Use Policies Acceptable Use Policies (AUPs) are usually signed during the on-boarding process. You won’t need an AUP if the user is no longer accessing the network."},{"id":"C33","exam":"C","n":33,"type":"mc","dom":4,"obj":"4.8","objtxt":"SY0-701, Objective 4.8 - Digital Forensics","qparts":[{"k":"p","v":"A cybersecurity analyst has been asked to respond to a denial of service attack against a web server, and the analyst has collected the log files and data from the server. Which of the following would allow a future analyst to verify the data as original and unaltered?"}],"opts":[{"k":"A","t":"E-discovery"},{"k":"B","t":"Root cause analysis"},{"k":"C","t":"Legal hold"},{"k":"D","t":"Data hashing"}],"ans":["D"],"es":"El hash de los datos permite verificar más adelante que los logs siguen siendo originales y no fueron alterados.","en":"D. Data hashing Data hashing creates a unique message digest based on stored data. If the data is tampered with, a hash taken after the change will differ from the original value. This allows the forensic engineer to identify if information has been changed. .","enw":"A. E-discovery E-Discovery (Electronic Discovery) describes the collection, preparation, review, interpretation, and production of electronic documents. Collecting information through e-discovery does not guarantee the integrity of the data. B. Root cause analysis A root cause analysis examines the evidence and determines the reason for the breach or attack. Performing a root cause analysis can help prevent future attacks, but it would not ensure the integrity of the collected data. C. Legal hold A legal hold is a legal technique to preserve relevant information. This legal hold will ensure the data remains accessible for any legal preparation that needs to occur prior to litigation."},{"id":"C34","exam":"C","n":34,"type":"mc","dom":2,"obj":"2.4","objtxt":"SY0-701, Objective 2.4 - Password Attacks","qparts":[{"k":"p","v":"A security administrator is reviewing authentication logs. The logs show a large number of accounts with at least three failed authentication attempts during the previous week. Which of the following would BEST explain this report data?"}],"opts":[{"k":"A","t":"Downgrade attack"},{"k":"B","t":"Phishing"},{"k":"C","t":"Injection"},{"k":"D","t":"Spraying"}],"ans":["D"],"es":"Muchas cuentas con solo unos pocos intentos fallidos es password spraying, que evita el bloqueo de cuentas.","en":"D. Spraying A spraying attack attempts to discover login credentials using a small number of authentication attempts. If the password isn't discovered in those few attempts, the brute force process stops before any account lockouts occur. An attacker could potentially perform a spraying attack across many accounts without any noticeable alerts or alarms.","enw":"A. Downgrade attack A downgrade attack takes advantage of a cryptographic weakness or vulnerability to gain access. This weakness is often due to an unpatched application or a poorly implemented cryptographic process. In this example, the attack is focused on a small number of brute force attempts and not on a cryptographic issue. B. Phishing Phishing is a useful attack for gathering information. Since a phishing attack often gathers valid authentication details, it's not necessary for the phishing process to also perform a brute force attack. C. Injection An injection attack adds additional information to a data stream in an attempt to access systems or data which would normally not be accessible. An injection attack does not generally perform a brute force attack."},{"id":"C35","exam":"C","n":35,"type":"mc","dom":4,"obj":"4.5","objtxt":"SY0-701, Objective 4.5 - Web Filtering","qparts":[{"k":"p","v":"A security administrator has been asked to block all browsing to casino gaming websites. Which of the following would be the BEST way to implement this requirement?"}],"opts":[{"k":"A","t":"Tune the IPS signatures"},{"k":"B","t":"Block port tcp/443 on the firewall"},{"k":"C","t":"Configure 802.1X for web browsing"},{"k":"D","t":"Add a content filter rule"}],"ans":["D"],"es":"Un filtro de contenido (content filter) bloquea categorías de sitios web, como casinos.","en":"D. Add a content filter rule Web filters contain a large database of categorized website addresses, and this allows an administrator to create rules to block browsing attempts to specific content. For example, a content filter may allow browsing to news and business sites, but block browsing attempts to gaming and shopping sites.","enw":"A. Tune the IPS signatures An IPS (Intrusion Prevention System) can identify and block known exploits within network traffic. An IPS does not maintain a categorized list of websites, and tuning the IPS signatures would not block specific website categories. B. Block port tcp/443 on the firewall Blocking a single port would not provide filtering on a specific website category. In this example, blocking all tcp/443 traffic would effectively block all web browsing traffic to secure sites. C. Configure 802.1X for web browsing 802.1X is an authentication protocol often used with network access control. The 802.1X protocol does not provide any filtering or categorization of website traffic."},{"id":"C36","exam":"C","n":36,"type":"mc","dom":1,"obj":"1.3","objtxt":"SY0-701, Objective 1.3 - Change Management Process","qparts":[{"k":"p","v":"A company is experiencing downtime and outages when application patches and updates are deployed during the week. Which of the following would help to resolve these issues?"}],"opts":[{"k":"A","t":"Onboarding considerations"},{"k":"B","t":"Incident response policies"},{"k":"C","t":"Change management procedures"},{"k":"D","t":"Decentralized governance"}],"ans":["C"],"es":"Change management: procesos formales que reducen las caídas al desplegar parches y actualizaciones.","en":"C. Change management procedures Change management defines a series of best practices for implementing changes in a complex technical environment. The goals of change management are to implement updates and changes while also maintaining the uptime and availability of critical business systems.","enw":"A. Onboarding considerations The onboarding process occurs when new employees join the organization. A change to the onboarding process would not correct the outages created by patches and updates. B. Incident response policies An operating system update or application patch is not categorized as a security incident, so updating or modifying an incident response process would not have any effect on system availability. D. Decentralized governance In this example, the governance of a system does not appear to be effective in managing changes, and decentralizing the governance would not commonly provide any resolution for unmanaged changes."},{"id":"C37","exam":"C","n":37,"type":"mc","dom":5,"obj":"5.1","objtxt":"SY0-701, Objective 5.1 - Security Procedures","qparts":[{"k":"p","v":"A company is implementing a series of steps to follow when responding to a security event. Which of the following would provide this set of processes and procedures?"}],"opts":[{"k":"A","t":"MDM"},{"k":"B","t":"DLP"},{"k":"C","t":"Playbook"},{"k":"D","t":"Zero trust"}],"ans":["C"],"es":"Un playbook es el conjunto de pasos condicionales a seguir ante un evento de seguridad.","en":"C. Playbook A playbook provides a conditional set of steps to follow when addressing a specific event. An organization might have separate playbooks for investigating a data breach, responding to a virus infection, or recovering from a ransomware attack.","enw":"A. MDM An MDM (Mobile Device Management) service provides configuration and control of remote devices. An MDM does not provide a checklist for handling security events. B. DLP DLP (Data Loss Prevention) is a security solution for identifying and blocking the transfer of sensitive information across the network. A DLP would not provide steps to follow during a security event. D. Zero trust Zero trust is a security philosophy which considers all devices to be untrusted. Inherent trust and trusted connections between devices are not part of a zero trust model. Zero trust does not provide checklists for security tasks."},{"id":"C38","exam":"C","n":38,"type":"mc","dom":3,"obj":"3.4","objtxt":"SY0-701, Objective 3.4 - Backups","qparts":[{"k":"p","v":"A transportation company maintains a scheduling application and a database in a virtualized cloud-based environment. Which of the following would be the BEST way to backup these services?"}],"opts":[{"k":"A","t":"Journaling"},{"k":"B","t":"Snapshot"},{"k":"C","t":"RTOS"},{"k":"D","t":"Containerization"}],"ans":["B"],"es":"Snapshot: captura de una VM completa, ideal para respaldar servicios virtualizados en la nube.","en":"B. Snapshot Virtual machines (VMs) have a snapshot feature to capture both a full backup of the virtual system and incremental changes that occur over time. It’s common to take a snapshot of a VM for backup purposes or before making any significant changes to the VM. If the changes need to be rolled back, a previous snapshot can be selected and instantly applied to the VM.","enw":"A. Journaling Journaling protects the integrity of a file system or database by writing information to a journal before making any changes to the primary data source. This allows the system to recover from a potential fault and prevent file corruption. C. RTOS An RTOS (Real-Time Operating System) has a deterministic processing schedule and is often associated with time-sensitive applications. An RTOS is not a backup mechanism. D. Containerization Containerization describes an application deployment strategy where a single file or container includes everything required to run an application. Containerization itself is not a backup mechanism."},{"id":"C39","exam":"C","n":39,"type":"mc","dom":4,"obj":"4.6","objtxt":"SY0-701, Objective 4.6 - Access Controls","qparts":[{"k":"p","v":"In an environment using discretionary access controls, which of these would control the rights and permissions associated with a file or directory?"}],"opts":[{"k":"A","t":"Administrator"},{"k":"B","t":"Owner"},{"k":"C","t":"Group"},{"k":"D","t":"System"}],"ans":["B"],"es":"En DAC (Discretionary Access Control) el propietario (owner) decide quién accede a su archivo o directorio.","en":"B. Owner The owner of an object controls access in a discretionary access control model. The object and type of access is at the discretion of the owner, and they can determine who can access the file and the type of access they would have.","enw":"A. Administrator Administrators generally label objects when using mandatory access control, but they are not involved with discretionary access control. C. Group Assigning rights and permissions to a group and then assigning users to the group are common when using role-based access control. D. System The system does not determine individual user rights and permissions when using discretionary access control."},{"id":"C40","exam":"C","n":40,"type":"mc","dom":3,"obj":"3.3","objtxt":"SY0-701, Objective 3.3 - States of Data","qparts":[{"k":"p","v":"A security administrator has installed a network-based DLP solution to determine if file transfers contain PII. Which of the following describes the data during the file transfer?"}],"opts":[{"k":"A","t":"In-use"},{"k":"B","t":"In-transit"},{"k":"C","t":"Highly available"},{"k":"D","t":"At-rest"}],"ans":["B"],"es":"Durante la transferencia por la red, el dato está en tránsito (data in-transit).","en":"B. In-transit Data in-transit describes information actively moving across the network. As the information passes through switches and routers, it is considered to be in-transit.","enw":"A. In-use Data in-use is in the memory of a system and is accessible to an application. C. Highly available High availability (HA) is usually associated with redundancy or fault\u0002tolerance. Data moving through the network would not be considered highly available. D. At-rest Data at-rest resides on a storage device."},{"id":"C41","exam":"C","n":41,"type":"mc","dom":5,"obj":"5.3","objtxt":"SY0-701, Objective 5.3 - Agreement Types","qparts":[{"k":"p","v":"A medical imaging company would like to connect all remote locations together with high speed network links. The network connections must maintain high throughput rates and must always be available during working hours. In which of the following should these requirements be enforced with the network provider?"}],"opts":[{"k":"A","t":"Service level agreement"},{"k":"B","t":"Memorandum of understanding"},{"k":"C","t":"Non-disclosure agreement"},{"k":"D","t":"Acceptable use policy"}],"ans":["A"],"es":"Un SLA (Service Level Agreement) fija por contrato el rendimiento y la disponibilidad que exige la empresa al proveedor.","en":"A. Service level agreement A service level agreement (SLA) is used to contractually define the minimum terms for services. In this example, the medical imaging company would require an SLA from the network provider for the necessary throughput and uptime metrics.","enw":"B. Memorandum of understanding A memorandum of understanding (MOU) is an informal letter of intent. The MOU is not a signed contract, and there are no contractual obligations associated with the content of an MOU. C. Non-disclosure agreement A non-disclosure agreement (NDA) is used between entities to prevent the use and dissemination of confidential information. D. Acceptable use policy An acceptable use policy (AUP) commonly details the rules of behavior for employees using an organization’s network and computing resources."},{"id":"C42","exam":"C","n":42,"type":"mc","dom":5,"obj":"5.6","objtxt":"SY0-701, Objective 5.6 - User Training","qparts":[{"k":"p","v":"A company is implementing a security awareness program for their user community. Which of the following should be included for additional user guidance and training?"}],"opts":[{"k":"A","t":"Daily firewall exception reporting"},{"k":"B","t":"Information on proper password management"},{"k":"C","t":"Periodic vulnerability scanning of external services"},{"k":"D","t":"Adjustments to annualized loss expectancy"}],"ans":["B"],"es":"La capacitación de concientización incluye guía práctica para todos los usuarios, como el manejo de contraseñas.","en":"B. Information on proper password management User awareness programs focus on security fundamentals that everyone in the organization can use during their normal work day. Protecting and managing passwords is an important security consideration for all users in the company.","enw":"A. Daily firewall exception reporting Daily security reports can provide important insight into the organization's security posture, but it doesn't provide security guidance for the user community. C. Periodic vulnerability scanning of external services Periodic audits and security scans can provide validation and identify potential issues, but the vulnerability scan results don't provide any help to the user community with their ongoing security responsibilities. D. Adjustments to annualized loss expectancy Annualized loss expectancy estimates can be important for budgeting and security planning, but those expenses aren't related to user community guidance and training."},{"id":"C43","exam":"C","n":43,"type":"mc","dom":5,"obj":"5.6","objtxt":"SY0-701, Objective 5.6 - Security Awareness","qparts":[{"k":"p","v":"A security administrator is preparing a phishing email as part of a periodic employee security awareness campaign. The email is spoofed to appear as an unknown third-party and asks employees to immediately click a link or their state licensing will be revoked. Which of the following should be the expected response from the users?"}],"opts":[{"k":"A","t":"Delete the message"},{"k":"B","t":"Click the link and make a note of the URL"},{"k":"C","t":"Forward the message to others in the department"},{"k":"D","t":"Report the suspicious link to the help desk"}],"ans":["D"],"es":"Ante un correo sospechoso, el usuario debe reportarlo al help desk y no hacer clic ni reenviarlo.","en":"D. Report the suspicious link to the help desk The users should be trained to report anything suspicious, and unusual links in an email message would certainly be an important security concern.","enw":"A. Delete the message Deleting the email would avoid any interaction with the malicious link, but it wouldn't provide any additional security for others in the organization. The contents of the email might also provide important information for removing similar messages and blocking future emails. B. Click the link and make a note of the URL The links inside of email messages are inherently insecure, and a best practice is to never click unknown or unexpected links or attachments inside of email messages. C. Forward the message to others in the department Forwarding a message with potentially malicious links would be a significant security concern, and it would be more secure to forward a copy to the IT security team."},{"id":"C44","exam":"C","n":44,"type":"mc","dom":1,"obj":"1.4","objtxt":"SY0-701, Objective 1.4 - Certificates","qparts":[{"k":"p","v":"A security administrator would like to minimize the number of certificate status checks made by web site clients to the certificate authority. Which of the following would be the BEST option for this requirement?"}],"opts":[{"k":"A","t":"OCSP stapling"},{"k":"B","t":"Self-signed certificates"},{"k":"C","t":"CRL"},{"k":"D","t":"Wildcards"}],"ans":["A"],"es":"OCSP stapling incluye el estado del certificado en el handshake, así los clientes no consultan a la CA.","en":"A. OCSP stapling OCSP (Online Certificate Status Protocol) stapling allows the certificate holder verify their own certificate status. The OCSP status is commonly “stapled” into the SSL/TLS handshake process. Instead of contacting the certificate authority to verify the certificate, the verification is included with the initial network connection to the server.","enw":"B. Self-signed certificates Self-signed certificates could be created for internal company use, but this would not change the process for validating the status of a certificate. C. CRL A CRL (Certificate Revocation List) is a list of revoked certificates maintained by the certificate authority. To view the CRL, an end-user client would directly access the CA. D. Wildcards Wildcards are added to certificates for use across multiple devices. Wildcards would not decrease the number of certificate status checks for a particular service."},{"id":"C45","exam":"C","n":45,"type":"mc","dom":1,"obj":"1.1","objtxt":"SY0-701, Objective 1.1 - Security Controls","qparts":[{"k":"p","v":"A company is concerned their EDR solution will not be able to stop more advanced ransomware variants. Technicians have created a backup and restore utility to get most systems up and running less than an hour after an attack. What type of security control is associated with this restore process?"}],"opts":[{"k":"A","t":"Directive"},{"k":"B","t":"Compensating"},{"k":"C","t":"Preventive"},{"k":"D","t":"Detective"}],"ans":["B"],"es":"Un respaldo y restauración rápidos no previenen el ransomware, pero permiten recuperarse: control compensatorio.","en":"B. Compensating Instead of preventing an attack, a compensating control is used to restore systems using other means. A streamlined backup and restore process compensates for the limited security features of the EDR (Endpoint Detection and Response) software.","enw":"A. Directive Directive controls define policies and processes, but directive controls won't provide a method for recovering from a ransomware infection. C. Preventive A preventive control will block access. The EDR software on a workstation is an example of a preventive control. D. Detective A detective control may not be able to block an attack, but it can identify and alert if an attack is underway."},{"id":"C46","exam":"C","n":46,"type":"mc","dom":1,"obj":"1.3","objtxt":"SY0-701, Objective 1.3 - Change Management Process","qparts":[{"k":"p","v":"To upgrade an internal application, the development team provides the operations team with instructions for backing up, patching the application, and reverting the patch if needed. The operations team schedules a date for the upgrade, informs the business divisions, and tests the upgrade process after completion. Which of the following describes this process?"}],"opts":[{"k":"A","t":"Code signing"},{"k":"B","t":"Continuity planning"},{"k":"C","t":"Usage auditing"},{"k":"D","t":"Change management"}],"ans":["D"],"es":"Respaldo, plan de reversión, fecha programada, aviso a las áreas y pruebas: es change management.","en":"D. Change management Change management is the process for making any type of change, such as a software upgrade, a hardware replacement, or any other type of modification to the existing environment. Having a formal change management process minimizes the risk of a change and makes everyone aware of the changes as they occur.","enw":"A. Code signing Application developers often digitally sign their software to ensure no modifications are made before the software is installed. The code signing process does not provide any guidance for an organization's internal processes associated with installing updated software. B. Continuity planning Continuity planning focuses on keeping the business running when a disruption occurs. Disaster recovery planning is a type of continuity plan. C. Usage auditing Usage auditing determines how resources are used. For example, a system administrator may perform a usage audit to determine which resources are used with a particular application or service."},{"id":"C47","exam":"C","n":47,"type":"mc","dom":4,"obj":"4.6","objtxt":"SY0-701, Objective 4.6 - Identity and Access Management","qparts":[{"k":"p","v":"A company is implementing a public file-storage and cloud-based sharing service, and would like users to authenticate with an existing account on a trusted third-party web site. Which of the following should the company implement?"}],"opts":[{"k":"A","t":"SSO"},{"k":"B","t":"Federation"},{"k":"C","t":"Least privilege"},{"k":"D","t":"Discretionary access controls"}],"ans":["B"],"es":"Federación: autenticarse con una cuenta existente en un sitio externo de confianza.","en":"B. Federation Federation provides authentication and authorization between two entities using a separate trusted authentication platform. For example, a web site could allow authentication using an existing account on a third-party social media site.","enw":"A. SSO SSO (Single Sign-On) does not inherently require authentication to be processed by a third-party. SSO allows a user to authenticate one time to gain access to all assigned resources. No additional authentication is required after the initial SSO login process is complete. C. Least privilege Least privilege ensures users only receive the permissions necessary to perform their assigned functions. Least privilege is not used to authenticate users to a third-party site. D. Discretionary access controls Discretionary access controls are used by a data owner to allow or prevent access to the data. Discretionary access controls are not used to authenticate users to a third-party database."},{"id":"C48","exam":"C","n":48,"type":"mc","dom":2,"obj":"2.4","objtxt":"SY0-701, Objective 2.4 - Other Malware Types","qparts":[{"k":"p","v":"A system administrator is viewing this output from Microsoft’s System File Checker:"},{"k":"code","v":"15:43:01 - Repairing corrupted file C:\\Windows\\System32\\kernel32.dll\n15:43:03 - Repairing corrupted file C:\\Windows\\System32\\netapi32.dll\n15:43:07 - Repairing corrupted file C:\\Windows\\System32\\user32.dll\n15:43:43 - Repair complete"},{"k":"p","v":"Which of the following malware types is the MOST likely cause of this output?"}],"opts":[{"k":"A","t":"Ransomware"},{"k":"B","t":"Logic bomb"},{"k":"C","t":"Rootkit"},{"k":"D","t":"Keylogger"}],"ans":["C"],"es":"Reparar archivos centrales del sistema como kernel32.dll apunta a un rootkit que modifica el SO.","en":"C. Rootkit A rootkit modifies operating system files to become part of the core OS. The kernel, user, and networking libraries in Windows are core operating system files.","enw":"A. Ransomware Ransomware commonly presents itself as a warning message on the user's screen, and most aspects of the operating system would be disabled. Ransomware also encrypts user documents and would not easily be repaired by replacing system files. B. Logic bomb A logic bomb waits for a predefined event to begin operation. Logic bombs do not commonly modify core operating system files. D. Keylogger A keylogger does not commonly embed itself in core operating system files. Keyloggers often run as an independent process and compile logs and keystrokes to send across the network to the attacker."},{"id":"C49","exam":"C","n":49,"type":"mc","dom":2,"obj":"2.4","objtxt":"SY0-701, Objective 2.4 - Application Attacks","qparts":[{"k":"p","v":"What type of vulnerability would be associated with this log information?"},{"k":"code","v":"GET http://example.com/show.asp?view=../../Windows/system.ini HTTP/1.1"}],"opts":[{"k":"A","t":"Buffer overflow"},{"k":"B","t":"Directory traversal"},{"k":"C","t":"DoS"},{"k":"D","t":"Cross-site scripting"}],"ans":["B"],"es":"Las secuencias ../../ intentan salir del directorio del servidor web: directory traversal.","en":"B. Directory traversal Directory traversal attempts to read or access files outside the scope of the web server's file directory. The pair of dots in a file path (..) refers to the parent directory, so this example is attempt to move back two parent directories before proceeding into the /Windows directory. In a properly configured web server, this traversal should not be possible.","enw":"A. Buffer overflow A buffer overflow would attempt to store information into an area of memory that overflows the boundary of the buffer. The information in the log does not show any overflow attempt. C. DoS A DoS (Denial of Service) is designed to make a system or service unavailable. Although running any unknown command can be unpredictable, it would be unusual for these commands to cause any downtime. D. Cross-site scripting A cross-site scripting attack would normally include a script referencing another site trusted by the browser. In this example, the commands appear to be related to the existing URL and not a third-party site."},{"id":"C50","exam":"C","n":50,"type":"mc","dom":3,"obj":"3.3","objtxt":"SY0-701, Objective 3.3 - Protecting Data","qparts":[{"k":"p","v":"A developer has created an application to store password information in a database. Which of the following BEST describes a way of protecting these credentials by adding random data to the password?"}],"opts":[{"k":"A","t":"Hashing"},{"k":"B","t":"Data masking"},{"k":"C","t":"Salting"},{"k":"D","t":"Asymmetric encryption"}],"ans":["C"],"es":"Salting agrega datos aleatorios a la contraseña antes de aplicar el hash.","en":"C. Salting Passwords are often stored as hashes, but the hashes themselves are often subject to brute force or rainbow table attacks. It’s common to add some additional random data (a salt) to a password before the hashing process. This ensures that each password is truly random when stored, and it makes it more difficult for an attacker to discover all of the stored passwords.","enw":"A. Hashing Hashing is a one-way cryptographic function which takes an input, such as a password, and creates a fixed size string of random information. The process of adding additional information to the original data before the hashing process is called salting. B. Data masking Data masking hides data from human eyes. For example, instead of showing a credit card number, the data mask will show asterisks in all but the last four digits. D. Asymmetric encryption Asymmetric encryption is an encryption method which uses one key for encryption and a different key for decryption. Asymmetric encryption does not add additional random information to a hash."},{"id":"C51","exam":"C","n":51,"type":"mc","dom":4,"obj":"4.7","objtxt":"SY0-701, Objective 4.7 - Scripting and Automation","qparts":[{"k":"p","v":"Which of the following processes provides ongoing building and testing of newly written code?"}],"opts":[{"k":"A","t":"Continuous integration"},{"k":"B","t":"Continuity of operations"},{"k":"C","t":"Version control"},{"k":"D","t":"Race condition"}],"ans":["A"],"es":"Continuous integration (CI): compilar y probar el código nuevo de forma continua.","en":"A. Continuous integration With continuous integration, code can be constantly written and merged into the central repository many times each day.","enw":"B. Continuity of operations Continuity of operations is used during disaster recovery or incident recovery. This process provides options for keeping the business processes available during or after the incident. C. Version control Version control is used to track changes to a file or configuration information over time. This allows changes to be applied and, if necessary, easily reverted to a previous version. D. Race condition A race condition is caused when two related processes occur simultaneously without knowledge of each other. A race condition is not related the process of building or testing code."},{"id":"C52","exam":"C","n":52,"type":"mc","dom":3,"obj":"3.1","objtxt":"SY0-701, Objective 3.1 - Cloud Infrastructures","qparts":[{"k":"p","v":"Which of the following BEST describes a responsibility matrix?"}],"opts":[{"k":"A","t":"A visual summary of cloud provider accountability"},{"k":"B","t":"Identification of tasks at each step of a project plan"},{"k":"C","t":"A list of cybersecurity requirements based on the identified risks"},{"k":"D","t":"Ongoing group discussions regarding cybersecurity"}],"ans":["A"],"es":"La matriz de responsabilidades resume visualmente qué le corresponde al proveedor de nube y al cliente.","en":"A. A visual summary of cloud provider accountability A cloud provider commonly creates a responsibility matrix to document the service coverage between the cloud provider and the customer. For example, a cloud responsibility matrix may show the cloud provider responsible for network controls and the customer responsible for all stored data.","enw":"B. Identification of tasks at each step of a project plan A project plan will include many tasks, and the list of tasks is often shown as part of the overall project plan or in a summarized chart. C. A list of cybersecurity requirements based on the identified risks Risk assessment provides a security administrator with the information needed to build proper security controls for the documented risks. D. Ongoing group discussions regarding cybersecurity Risk assessment can involve constant monitoring and analysis of current trends, risks, and response options. This information can be gathered from group discussions, expert presentations, and security conferences and programs."},{"id":"C53","exam":"C","n":53,"type":"mc","dom":4,"obj":"4.6","objtxt":"SY0-701, Objective 4.6 - Identity and Access Management","qparts":[{"k":"p","v":"A security administrator is implementing an authentication system for the company. Which of the following would be the best choice for validating login credentials for all usernames and passwords in the authentication system?"}],"opts":[{"k":"A","t":"CA"},{"k":"B","t":"SIEM"},{"k":"C","t":"LDAP"},{"k":"D","t":"WAF"}],"ans":["C"],"es":"LDAP es un estándar abierto de autenticación para validar usuarios y contraseñas.","en":"C. LDAP LDAP (Lightweight Directory Access Protocol) is a common standard for authentication. LDAP is an open standard and is available across many different operating systems and devices.","enw":"A. CA A CA (Certificate Authority) is a trusted service for certificate creation and management. The CA itself is not responsible for validating login credentials. B. SIEM A SIEM (Security and Information Management) service consolidates log files from diverse systems and can create reports based on the correlation of this data. A SIEM is not part of the authentication process. D. WAF A WAF (Web Application Firewall) is used to protect a web-based application from exploits and other attacks. A WAF is not used to validate login credentials."},{"id":"C54","exam":"C","n":54,"type":"mc","dom":4,"obj":"4.9","objtxt":"SY0-701, Objective 4.9 - Log Data","qparts":[{"k":"p","v":"A technician is reviewing this information from an IPS log:"},{"k":"code","v":"MAIN_IPS: 22June2023 09:02:50 reject 10.1.111.7\nAlert: HTTP Suspicious Webdav OPTIONS Method Request; Host: Server\nSeverity: medium; Performance Impact:3;\nCategory: info-leak; Packet capture; disable\nProto:tcp; dst:192.168.11.1; src:10.1.111.7"},{"k":"p","v":"Which of the following can be associated with this log information? (Select TWO)"}],"opts":[{"k":"A","t":"The attacker sent a non-authenticated BGP packet to trigger the IPS"},{"k":"B","t":"The source of the attack is 192.168.11.1"},{"k":"C","t":"The event was logged but no packets were dropped"},{"k":"D","t":"The source of the attack is 10.1.111.7"},{"k":"E","t":"The attacker sent an unusual HTTP packet to trigger the IPS"}],"ans":["D","E"],"es":"Alerta de método HTTP WebDAV sospechoso (paquete HTTP inusual). El origen es el campo src: 10.1.111.7.","en":"D. The source of the attack is 10.1.111.7 and E. The attacker sent an unusual HTTP packet to trigger the IPS The second line of the IPS log shows the type of alert, and this record indicates a suspicious HTTP packet was sent. The last line of the IPS log shows the protocol, destination, and source IP address information. The source IP address is 10.1.111.7.","enw":"A. The attacker sent a non-authenticated BGP packet to trigger the IPS The alert for this IPS log does not indicate any non-authenticated packets or BGP packets. B. The source of the attack is 192.168.11.1 The last line of the log identifies the protocol and IP addresses. The “src” address is the source of the packet and is identified as 10.1.111.7. C. The event was logged but no packets were dropped The first line of the log shows the name of the IPS which identified the issue, the date and time, and disposition. In this log entry, the packet was rejected from IP address 10.1.111.7."},{"id":"C55","exam":"C","n":55,"type":"mc","dom":5,"obj":"5.5","objtxt":"SY0-701, Objective 5.5 - Penetration Tests","qparts":[{"k":"p","v":"A company has contracted with a third-party to provide penetration testing services. The service includes a port scan of each externally-facing device. This is an example of:"}],"opts":[{"k":"A","t":"Initial exploitation"},{"k":"B","t":"Privilege escalation"},{"k":"C","t":"Known environment"},{"k":"D","t":"Active reconnaissance"}],"ans":["D"],"es":"Un escaneo de puertos es reconocimiento activo: genera tráfico que se puede registrar.","en":"D. Active reconnaissance Active reconnaissance sends traffic across the network, and this traffic can be viewed and logged. Performing a port scan will send network traffic to a server, and most port scan attempts can be identified and logged by an IPS (Intrusion Prevention System).","enw":"A. Initial exploitation An exploit attempt is common when performing a penetration test, but a port scan is not exploiting any vulnerabilities. B. Privilege escalation If a penetration test is able to exploit a system and obtain a higher level of rights and permissions, then the test is successful at escalating the access privileges. A port scan does not gain access to a system, and it will not provide any privilege escalation. C. Known environment A known environment fully documents the network and systems within the scope of a penetration test. In this example, there's no mention of testing environment documentation provided to the penetration testers."},{"id":"C56","exam":"C","n":56,"type":"mc","dom":2,"obj":"2.2","objtxt":"SY0-701, Objective 2.2 - Common Threat Vectors","qparts":[{"k":"p","v":"An access point in a corporate headquarters office has the following configuration:"},{"k":"code","v":"IP address: 10.1.10.1\nSubnet mask: 255.255.255.0\nDHCPv4 Server: Enabled\nSSID: Wireless\nWireless Mode: 802.11n\nSecurity Mode: WEP-PSK\nFrequency band: 2.4 GHz\nSoftware revision: 2.1\nMAC Address: 60:3D:26:71:FF:AA\nIPv4 Firewall: Enabled"},{"k":"p","v":"Which of the following would apply to this configuration?"}],"opts":[{"k":"A","t":"Invalid frequency band"},{"k":"B","t":"Weak encryption"},{"k":"C","t":"Incorrect IP address and subnet mask"},{"k":"D","t":"Invalid software version"}],"ans":["B"],"es":"Usa WEP-PSK, un cifrado débil y obsoleto. Debería usar WPA2 o WPA3.","en":"B. Weak encryption A common issue is weak or outdated security configurations. Older encryptions such as DES and WEP should be updated to use newer and stronger encryption technologies.","enw":"A. Invalid frequency band The 2.4 GHz frequency band is a valid frequency range for 802.11n networks. C. Incorrect IP address and subnet mask None of the listed configuration settings show any issues with the IP address or subnet mask. D. Invalid software version The software version of the access point does not have any configuration options and would not be considered invalid."},{"id":"C57","exam":"C","n":57,"type":"mc","dom":2,"obj":"2.4","objtxt":"SY0-701, Objective 2.4 - Replay Attacks","qparts":[{"k":"p","v":"An attacker has gained access to an application through the use of packet captures. Which of the following would be MOST likely used by the attacker?"}],"opts":[{"k":"A","t":"Overflow"},{"k":"B","t":"Forgery"},{"k":"C","t":"Replay"},{"k":"D","t":"Injection"}],"ans":["C"],"es":"Un ataque de repetición (replay) reutiliza información capturada en paquetes para acceder a la aplicación.","en":"C. Replay A replay attack uses previously transmitted information to gain access to an application or service. This information is commonly captured in network packets and replayed to the service.","enw":"A. Overflow A buffer overflow attack attempts to store a large number into a smaller sized memory space. This can sometimes improperly change the value of memory areas that are outside of the smaller space. B. Forgery A cross-site request forgery commonly uses malicious links to take advantage of the trust a site might have for a user's browser. Packet captures are not necessary to perform a forgery attack. D. Injection The unwanted injection of data into a database, library, or any other data flow is an injection attack. The information contained in a packet capture is not commonly used during an injection attack."},{"id":"C58","exam":"C","n":58,"type":"mc","dom":2,"obj":"2.4","objtxt":"SY0-701, Objective 2.4 - Denial of Service","qparts":[{"k":"p","v":"A company is receiving complaints of slowness and disconnections to their Internet-facing web server. A network administrator monitors the Internet link and finds excessive bandwidth utilization from thousands of different IP addresses. Which of the following would be the MOST likely reason for these performance issues?"}],"opts":[{"k":"A","t":"DDoS"},{"k":"B","t":"DNS spoofing"},{"k":"C","t":"RFID cloning"},{"k":"D","t":"Wireless jamming"}],"ans":["A"],"es":"Miles de IP saturando el ancho de banda de un servidor web público: DDoS.","en":"A. DDoS A DDoS (Distributed Denial of Service) is the failure of a service caused by many different remote devices. In this example, the DDoS is related to a bandwidth utilization exhaustion caused by excessive server requests.","enw":"B. DNS spoofing DNS (Domain Name System) spoofing modifies DNS information on a DNS server or a client to direct users to an unauthorized site. DNS spoofing would not be the cause for these performance issues. C. RFID cloning RFID (Radio Frequency Identification) cloning is used to duplicate an existing RFID device. These devices are not commonly associated with network communication to a public web server. D. Wireless jamming Wireless jamming disrupts wireless networks and prevents any type of communication. The communication issues to a public web server would not be associated with wireless networking."},{"id":"C59","exam":"C","n":59,"type":"mc","dom":5,"obj":"5.3","objtxt":"SY0-701, Objective 5.3 - Agreement Types","qparts":[{"k":"p","v":"A company has created an itemized list of tasks to be completed by a third-party service provider. After the services are complete, this document will be used to validate the completion of the services. Which of the following would describe this agreement type?"}],"opts":[{"k":"A","t":"SLA"},{"k":"B","t":"SOW"},{"k":"C","t":"NDA"},{"k":"D","t":"BPA"}],"ans":["B"],"es":"SOW (Statement of Work): lista detallada de tareas a cumplir por un tercero y sirve para validar el trabajo.","en":"B. SOW A SOW (Statement of Work) is a detailed list of tasks, items, or processes to be completed by a third-party. The SOW lists the job scope, location, deliverables, and any other specifics associated with the agreement. The SOW is also used as a checklist to verify the job was completed properly by the service provider.","enw":"A. SLA An SLA (Service Level Agreement) sets the minimum terms of service between a customer and a service provider. This agreement often contains terms for expected uptime, response time requirements, and other minimum service levels required by the customer. C. NDA An NDA (Non-Disclosure Agreement) is a confidentiality agreement between parties. The agreement is designed to protect information such as trade secrets, business activities, or anything else included in the NDA. An NDA does not generally contain an itemized list of service requests. D. BPA A BPA (Business Partners Agreement) is used between entities going into business together. A list of itemized service requests would not be part of a BPA."},{"id":"C60","exam":"C","n":60,"type":"mc","dom":3,"obj":"3.2","objtxt":"SY0-701, Objective 3.2 - Secure Communication","qparts":[{"k":"p","v":"A company is deploying a series of internal applications to different cloud providers. Which of the following connection types should be deployed for this configuration?"}],"opts":[{"k":"A","t":"Air-gapped"},{"k":"B","t":"802.1X"},{"k":"C","t":"Site-to-site IPsec VPN"},{"k":"D","t":"Jump server"},{"k":"E","t":"SD-WAN"}],"ans":["E"],"es":"SD-WAN permite que los usuarios se comuniquen directamente con aplicaciones en varios proveedores de nube de manera eficiente.","en":"E. SD-WAN An SD-WAN (Software Defined Networking in a Wide Area Network) network allows users to efficiently communicate directly to cloud-based applications.","enw":"A. Air-gapped An air-gapped network would be physically isolated from other networks. In this question, connectivity is required between the users and the various cloud providers. B. 802.1X 802.1X is a standard for port-based network access control and would most likely be used when a user first connects to the network and before a user would connect to the Internet. C. Site-to-site IPsec VPN Although it's physically possible to connect every site to every other site (or to cloud providers), it's difficult to scale this design to larger environments. This connectivity also becomes difficult to manage as applications move from one cloud provider site to another. D. Jump server A jump server is often used to allow external access to internal devices, commonly for maintenance or administrative tasks. A jump server is not a router and does not forward traffic between users and cloud-based applications."},{"id":"C61","exam":"C","n":61,"type":"mc","dom":1,"obj":"1.2","objtxt":"SY0-701, Objective 1.2 - Zero Trust","qparts":[{"k":"p","v":"A company is updating components within the control plane of their zero-trust implementation. Which of the following would be part of this update?"}],"opts":[{"k":"A","t":"Policy engine"},{"k":"B","t":"Subjects"},{"k":"C","t":"Policy enforcement point"},{"k":"D","t":"Zone configurations"}],"ans":["A"],"es":"El policy engine está en el plano de control de zero trust y decide si se concede, niega o revoca el acceso.","en":"A. Policy engine The policy engine is located in the control plane and evaluates each access decision based on security policy and other information sources. The policy engine determines if access should be granted, denied, or revoked.","enw":"B. Subjects Subjects use the zero-trust data plane, and are often end-users, applications, or other non-human entities. C. Policy enforcement point A policy enforcement point resides in the data plane and is the gatekeeper for allowing, monitoring, and terminating connections. D. Zone configurations Zero-trust uses security zones to easily apply access policies, and these zones operate in the data plane."},{"id":"C62","exam":"C","n":62,"type":"mc","dom":2,"obj":"2.4","objtxt":"SY0-701, Objective 2.4 - Denial of Service","qparts":[{"k":"p","v":"Which of the following malware types would cause a workstation to participate in a DDoS?"}],"opts":[{"k":"A","t":"Bot"},{"k":"B","t":"Logic bomb"},{"k":"C","t":"Ransomware"},{"k":"D","t":"Keylogger"}],"ans":["A"],"es":"Un bot es malware que espera órdenes y se usa en botnets para ataques DDoS.","en":"A. Bot A bot (robot) is malware that installs itself on a system and then waits for instructions. It’s common for botnets to use thousands of bots to perform DDoS (Distributed Denial of Service) attacks.","enw":"B. Logic bomb A logic bomb waits for a predefined event to occur. The scope of devices infected with a logic bomb are relatively small and localized as compared to a botnet. C. Ransomware Ransomware locks a system and prevents it from operating. The locked device does not commonly participate in a DDoS. D. Keylogger A keylogger will silently capture keystrokes and transmit an archive of those keystrokes to a third-party. A keylogger does not commonly participate in a DDoS."},{"id":"C63","exam":"C","n":63,"type":"mc","dom":4,"obj":"4.8","objtxt":"SY0-701, Objective 4.8 - Digital Forensics","qparts":[{"k":"p","v":"Which of these are used to force the preservation of data for later use in court?"}],"opts":[{"k":"A","t":"Chain of custody"},{"k":"B","t":"Data loss prevention"},{"k":"C","t":"Legal hold"},{"k":"D","t":"E-discovery"}],"ans":["C"],"es":"Legal hold: técnica legal que obliga a preservar datos relevantes para un proceso judicial.","en":"C. Legal hold A legal hold is a legal technique to preserve relevant information. This process will ensure the data remains accessible for any legal preparation prior to litigation.","enw":"A. Chain of custody Chain of custody ensures the integrity of evidence is maintained. The contents of the evidence are documented, and each person who contacts the evidence is required to document their activity. B. Data loss prevention Data loss prevention (DLP) is a technique for identifying sensitive information transmitted across the network, such as Social Security numbers, credit card numbers, and other PII (Personally Identifiable Information). DLP is not a legal technique. D. E-discovery E-discovery describes the process of identifying and collecting electronic documents and media. The e-discovery process itself does not force the preservation of data."},{"id":"C64","exam":"C","n":64,"type":"mc","dom":1,"obj":"1.2","objtxt":"SY0-701, Objective 1.2 - Physical Security","qparts":[{"k":"p","v":"A company would like to automatically monitor and report on any movement occurring in an open field at the data center. Which of the following would be the BEST choice for this task?"}],"opts":[{"k":"A","t":"Bollard"},{"k":"B","t":"Microwave sensor"},{"k":"C","t":"Access control vestibule"},{"k":"D","t":"Fencing"}],"ans":["B"],"es":"Un sensor de microondas detecta movimiento en grandes áreas abiertas.","en":"B. Microwave sensor Microwave sensors can detect movement across large areas such as open fields.","enw":"A. Bollard A bollard is a barricade used to prevent access. Bollards often allow people to pass through a specific access point, but limit access for cars and other vehicles. C. Access control vestibule An access control vestibule is a room designed to manage the flow of people through the area. It's common to see access control vestibules used as an entry point to a data center or secure facility. D. Fencing Fencing can create a perimeter to prevent access to a large open field, but it wouldn't detect or alert on any type of movement."},{"id":"C65","exam":"C","n":65,"type":"mc","dom":3,"obj":"3.4","objtxt":"SY0-701, Objective 3.4 - Capacity Planning","qparts":[{"k":"p","v":"A company is releasing a new product, and part of the release includes the installation of load balancers to the public web site. Which of the following would best describe this process?"}],"opts":[{"k":"A","t":"Platform diversity"},{"k":"B","t":"Capacity planning"},{"k":"C","t":"Multi-cloud systems"},{"k":"D","t":"Permission restrictions"}],"ans":["B"],"es":"Capacity planning: aumentar la capacidad de los recursos (balanceadores) ante la demanda esperada.","en":"B. Capacity planning Capacity planning describes the process of matching the supply of a resource to the demand. In this example, the company is planning for an increased interest in their products and are increasing the overall capacity of their web server resources.","enw":"A. Platform diversity Platform diversity describes the use of different platforms to provide a similar service. For example, a company may decide to use both Linux and Windows platforms for their web services. In this question, the platform used by the web services is not mentioned. C. Multi-cloud systems Multi-cloud systems will use more than a single cloud provider to provide a service. In this question, there were no specific references to cloud providers. D. Permission restrictions Permission restrictions would limit access to data or resources, and the addition of multiple identical servers would not indicate a change to the existing permissions."},{"id":"C66","exam":"C","n":66,"type":"mc","dom":1,"obj":"1.2","objtxt":"SY0-701, Objective 1.2 - Non-repudiation","qparts":[{"k":"p","v":"A system administrator would like to prove an email message was sent by a specific person. Which of the following describes the verification of this message source?"}],"opts":[{"k":"A","t":"Non-repudiation"},{"k":"B","t":"Key escrow"},{"k":"C","t":"Asymmetric encryption"},{"k":"D","t":"Steganography"}],"ans":["A"],"es":"No repudio (non-repudiation): demuestra quién originó un mensaje, por ejemplo con firma digital.","en":"A. Non-repudiation Non-repudiation is used to verify the source of data or a message. Digital signatures are commonly used for non-repudiation.","enw":"B. Key escrow Key escrow describes a third-party responsible for holding or managing keys or certificates. Key escrow does not provide verification of a data source. C. Asymmetric encryption Asymmetric encryption describes data encryption using one key and the decryption of this data with a different key. The use of asymmetric encryption by itself does not provide proof of origin. D. Steganography Steganography describes hiding one type of data within another media type. For example, hiding encrypted data within an image is a form of steganography. Steganography does not provide proof of origin."},{"id":"C67","exam":"C","n":67,"type":"mc","dom":5,"obj":"5.6","objtxt":"SY0-701, Objective 5.6 - Security Awareness","qparts":[{"k":"p","v":"A security administrator has created a policy to alert if a user modifies the hosts file on their system. Which of the following behaviors does this policy address?"}],"opts":[{"k":"A","t":"Unexpected"},{"k":"B","t":"Self-assessment"},{"k":"C","t":"Unintentional"},{"k":"D","t":"Risky"}],"ans":["D"],"es":"Modificar el archivo hosts es un comportamiento riesgoso (risky) que puede redirigir tráfico.","en":"D. Risky Making a change to the hosts file can be a security concern, and many systems will prevent this change without elevated permissions. Modifying the hosts file would be categorized as risky behavior.","enw":"A. Unexpected Editing a hosts file is a specific task with an intentional result. The user modification of the hosts file would not generally be considered an unexpected event. B. Self-assessment A self-assessment is often used in internal audits to informally gather information about potential security risks. A self-assessment is not part of a user's intentional file edits. C. Unintentional A user editing a file is an active process and is often associated with performing a specific configuration change or task."},{"id":"C68","exam":"C","n":68,"type":"mc","dom":2,"obj":"2.5","objtxt":"SY0-701, Objective 2.5 - Mitigation Techniques","qparts":[{"k":"p","v":"A company has identified a web server data breach resulting in the theft of financial records from 150 million customers. A security update to the company’s web server software was available for two months prior to the breach. Which of the following would have prevented this breach from occurring?"}],"opts":[{"k":"A","t":"Patch management"},{"k":"B","t":"Full disk encryption"},{"k":"C","t":"Disabling unnecessary services"},{"k":"D","t":"Application allow lists"}],"ans":["A"],"es":"Un parche estaba disponible dos meses antes: un buen proceso de gestión de parches habría evitado la brecha.","en":"A. Patch management This question describes an actual breach which occurred in 2017 to web servers at a large credit bureau. This breach resulted in the release of almost 150 million customer names, Social Security numbers, addresses, and birth dates. A web server vulnerability announced in March of 2017 was left unpatched, and attackers exploited the vulnerability two months later. The attackers were in the credit bureau network for 76 days before they were discovered. A formal patch management process would have clearly identified this vulnerability and would have given the credit bureau the opportunity to mitigate or patch the vulnerability well before it would have been exploited.","enw":"B. Full disk encryption Full disk encryption (FDE) would prevent unauthenticated access to the data, but the web server would be an authorized user and would have normal access to the areas of the operating system necessary for normal operation. Enabling FDE would not provide any additional security against a data breach. C. Disable unnecessary services It’s always a good best practice to disable unnecessary services, but this breach attacked a very necessary web service. D. Application allow lists Application allow lists would prevent unauthorized applications from running, but it would not prevent an attack to the web service application."},{"id":"C69","exam":"C","n":69,"type":"mc","dom":5,"obj":"5.1","objtxt":"SY0-701, Objective 5.1 - Security Standards","qparts":[{"k":"p","v":"During the onboarding process, the IT department requires a list of software applications associated with the new employee's job functions. Which of the following would describe the use of this information?"}],"opts":[{"k":"A","t":"Access control configuration"},{"k":"B","t":"Encryption settings"},{"k":"C","t":"Physical security requirements"},{"k":"D","t":"Change management"}],"ans":["A"],"es":"La lista de aplicaciones necesarias sirve para configurar los controles de acceso del nuevo empleado.","en":"A. Access control configuration The onboarding team needs to assign the proper access controls to new employees, and the list of applications provides additional details regarding application and data access.","enw":"B. Encryption settings A list of applications required by a new employee does not generally have any impact on the encryption settings used by these applications. C. Physical security requirements Physical security requirements would not generally be based on the list of required applications for a new employee. Most physical security requirements are determined by the organization's IT security team. D. Change management Adding rights and permissions for a new user would be a normal procedure and would not require a formal change management process."},{"id":"C70","exam":"C","n":70,"type":"mc","dom":4,"obj":"4.8","objtxt":"SY0-701, Objective 4.8 - Incident Response","qparts":[{"k":"p","v":"A system administrator has identified an unexpected username on a database server, and the user has been transferring database files to an external server over the company’s Internet connection. The administrator then performed these tasks: • Physically disconnected the Ethernet cable on the database server • Disabled the unknown account • Configured a firewall rule to prevent file transfers from the server Which of the following would BEST describe this part of the incident response process?"}],"opts":[{"k":"A","t":"Eradication"},{"k":"B","t":"Containment"},{"k":"C","t":"Lessons learned"},{"k":"D","t":"Preparation"}],"ans":["B"],"es":"Desconectar el cable, deshabilitar la cuenta y bloquear las transferencias es contención (containment).","en":"B. Containment The containment phase isolates events which can quickly spread and get out of hand. A file transfer from a database server can quickly be contained by disabling any ability to continue the file transfer.","enw":"A. Eradication Eradication focuses on removing the cause of the event and restoring the systems back to their non-compromised state. C. Lessons learned After the event is over, the lessons learned phase helps everyone learn and improve the process for the next event. D. Preparation Before an event occurs, it’s important to have the contact numbers, tools, and processes ready to go."},{"id":"C71","exam":"C","n":71,"type":"mc","dom":1,"obj":"1.4","objtxt":"SY0-701, Objective 1.4 - Key Exchange","qparts":[{"k":"p","v":"Which of the following would be the MOST effective use of asymmetric encryption?"}],"opts":[{"k":"A","t":"Real-time video encryption"},{"k":"B","t":"Securely store passwords"},{"k":"C","t":"Protect data on mobile devices"},{"k":"D","t":"Create a shared session key"}],"ans":["D"],"es":"Cifrado asimétrico se usa para intercambiar una clave de sesión compartida (Diffie-Hellman), no para cifrar grandes volúmenes.","en":"D. Create a shared session key The Diffie-Hellman algorithm can combine public and private keys to derive the same session key. This allows two devices to create and use this shared session key without sending the key across the network.","enw":"A. Real-time video encryption The high speeds required for real-time video encryption and decryption would not be an efficient use case for asymmetric encryption. High-speed or large-scale encryption commonly uses a faster method of encryption and decryption. B. Securely store passwords The best practice for password storage is to use hashes instead of encryption. Hashes ensure a stored password can't be reverse engineered to produce the original password. C. Protect data on mobile devices The limited CPU and power available on a mobile device requires a more efficient form of confidentiality than asymmetric encryption. For example, it's common for mobile devices to use elliptic curve cryptography (ECC)."},{"id":"C72","exam":"C","n":72,"type":"mc","dom":1,"obj":"1.4","objtxt":"SY0-701, Objective 1.4 - Encrypting Data","qparts":[{"k":"p","v":"Each salesperson in a company receives a laptop with applications and data to support their sales efforts. The IT manager would like to prevent third-parties from gaining access to this information if the laptop is stolen. Which of the following would be the BEST way to protect this data?"}],"opts":[{"k":"A","t":"Remote wipe"},{"k":"B","t":"Full disk encryption"},{"k":"C","t":"Biometrics"},{"k":"D","t":"VPN"}],"ans":["B"],"es":"El cifrado de disco completo (FDE) protege los datos si roban la laptop. Borrado remoto es reactivo.","en":"B. Full disk encryption With full disk encryption, everything written to the laptop’s local drive is stored as encrypted data. If the laptop was stolen, the thief would not have the credentials to decrypt the drive data.","enw":"A. Remote wipe Although a remote wipe function is useful, it’s a reactive response and does not provide any data protection prior to erasing the data. C. Biometrics Biometric authentication can limit access to the operating system, but the laptop’s storage drive can still be removed and accessed from another computer. D. VPN A VPN (Virtual Private Network) would encrypt all data transferred over the network, but it would not protect any stored data if the laptop was stolen."},{"id":"C73","exam":"C","n":73,"type":"mc","dom":5,"obj":"5.4","objtxt":"SY0-701, Objective 5.4 - Privacy","qparts":[{"k":"p","v":"A security administrator has compiled a list of all information stored and managed by an organization. Which of the following would best describe this list?"}],"opts":[{"k":"A","t":"Sanitization"},{"k":"B","t":"Metadata"},{"k":"C","t":"Known environment"},{"k":"D","t":"Data inventory"}],"ans":["D"],"es":"Data inventory: lista de toda la información administrada, con dueño, frecuencia de actualización y formato.","en":"D. Data inventory A data inventory describes a list of all data managed by an organization. This inventory includes the owner, update frequency, and format of the data.","enw":"A. Sanitization Data sanitization involves the complete removal of data without any method of recovery. Data sanitization is often used when clearing storage media for reuse or disposal. B. Metadata Metadata is data which describes other data sources. Email header information, network headers, and file characteristics are common examples of metadata. C. Known environment A known environment commonly describes the information provided to a penetration tester. A known environment provides a complete overview of the in-scope devices associated with a penetration test."},{"id":"C74","exam":"C","n":74,"type":"mc","dom":3,"obj":"3.2","objtxt":"SY0-701, Objective 3.2 - Network Appliances","qparts":[{"k":"p","v":"A security administrator would like to monitor all outbound Internet connections for malicious software. Which of the following would provide this functionality?"}],"opts":[{"k":"A","t":"Jump server"},{"k":"B","t":"IPsec tunnel"},{"k":"C","t":"Forward proxy"},{"k":"D","t":"Load balancer"}],"ans":["C"],"es":"Un forward proxy monitorea y filtra las conexiones salientes a Internet, incluyendo software malicioso.","en":"C. Forward proxy A proxy server can be used to monitor incoming and outgoing network communication. Proxy servers can be used to identify malicious software, filter content, or increase performance through file caching.","enw":"A. Jump server A jump server is commonly used to provide administrative access to a secure network connection. Jump servers are not used to monitor or filter Internet connections. B. IPsec tunnel An IPsec tunnel is associated with an encrypted connection between devices or sites. An IPsec tunnel would not be used to monitor or manage network content or Internet connections. D. Load balancer Load balancers are used to increase capacity by separating the processing load between multiple servers. Load balancers are not used for network monitoring or security filtering."},{"id":"C75","exam":"C","n":75,"type":"mc","dom":1,"obj":"1.1","objtxt":"SY0-701, Objective 1.1 - Security Controls","qparts":[{"k":"p","v":"What type of security control would be associated with corporate security policies?"}],"opts":[{"k":"A","t":"Technical"},{"k":"B","t":"Operational"},{"k":"C","t":"Managerial"},{"k":"D","t":"Physical"}],"ans":["C"],"es":"Las políticas de seguridad son un control gerencial (managerial).","en":"C. Managerial A managerial control type is associated with security design and implementation. Security policies and standard operating procedures are common examples of a managerial control type.","enw":"A. Technical Technical security controls are implemented using systems, such as operating system controls, firewalls, or anti-virus software. B. Operational Operational controls are implemented by people instead of systems. An example of an operational security control type would be security guards or awareness programs. D. Physical A physical control type would limit physical access. For example, a door lock or badge reader would be a physical control."},{"id":"C76","exam":"C","n":76,"type":"mc","dom":2,"obj":"2.1","objtxt":"SY0-701, Objective 2.1 - Threat Actors","qparts":[{"k":"p","v":"Which of the following would be the MOST significant security concern when protecting against organized crime?"}],"opts":[{"k":"A","t":"Prevent users from posting passwords near their workstations"},{"k":"B","t":"Require identification cards for all employees and guests"},{"k":"C","t":"Maintain reliable backup data"},{"k":"D","t":"Use access control vestibules at all data center locations"}],"ans":["C"],"es":"El crimen organizado busca datos y puede cifrarlos o borrarlos; tener respaldos confiables es la mejor protección.","en":"C. Maintain reliable backup data A common objective for organized crime is an organization's data, and attacks from organized crime can sometimes encrypt or delete data. A good set of backups can often resolve these issues quickly and without any ransomware payments to an organized crime syndicate.","enw":"A. Prevent users from posting passwords near their workstations Organized crime members usually access systems remotely. Although it’s important for users to protect their passwords, the organized crime members aren’t generally in a position to view information on a person's desk. B. Require identification cards for all employees and guests Since the criminal syndicate members rarely visit a site, having identification for employees and visitors isn’t the most significant concern associated with this threat actor. D. Use access control vestibules at all data center locations Access control vestibules control the flow of people through an area. Organized crime members aren’t usually visiting a company's data center."},{"id":"C77","exam":"C","n":77,"type":"mc","dom":2,"obj":"2.5","objtxt":"SY0-701, Objective 2.5 - Hardening Techniques","qparts":[{"k":"p","v":"An application team has been provided with a hardened version of Linux to use with a new application installation, and this includes installing a web service and the application code on the server. Which of the following would BEST protect the application from attacks?"}],"opts":[{"k":"A","t":"Build a backup server for the application"},{"k":"B","t":"Run the application in a cloud-based environment"},{"k":"C","t":"Implement a secure configuration of the web service"},{"k":"D","t":"Send application logs to the SIEM via syslog"}],"ans":["C"],"es":"Una configuración segura del servicio web protege la aplicación. Respaldos, nube o logs no la protegen de ataques.","en":"C. Implement a secure configuration of the web service The tech support resources for many services will include a list of hardening recommendations. This hardening may include account restrictions, file permission settings, internal service configuration options, and other settings to ensure that the service is as secure as possible.","enw":"A. Build a backup server for the application Of course, you should always have a backup. Although the backup may help recover quickly from an attack, the backup itself won’t protect the application from attacks. B. Run the application in a cloud-based environment The location of the application service won’t provide any significant protection against attacks. Given the options available, running the application in the cloud would not be the best option available. D. Send application logs to the SIEM via syslog It’s always useful to have a consolidated set of logs, but the logs on the SIEM (Security Information and Event Management) server won’t protect the application from attacks."},{"id":"C78","exam":"C","n":78,"type":"mc","dom":4,"obj":"4.1","objtxt":"SY0-701, Objective 4.1 - Wireless Security Settings","qparts":[{"k":"p","v":"A system administrator has configured MAC filtering on their corporate access point, but access logs show unauthorized users accessing the network. Which of the following should the administrator configure to prevent future unauthorized use?"}],"opts":[{"k":"A","t":"Enable WPA3 encryption"},{"k":"B","t":"Remove unauthorized MAC addresses from the filter"},{"k":"C","t":"Modify the SSID name"},{"k":"D","t":"Modify the channel frequencies"}],"ans":["A"],"es":"El filtrado MAC se puede suplantar. Habilitar WPA3 (o 802.1X) autentica de verdad a los usuarios.","en":"A. Enable WPA3 encryption A MAC (Media Access Control) address can be spoofed on a remote device, which means anyone within the vicinity of the access point can view and use legitimate MAC addresses. To ensure proper authentication, the system administrator can enable WPA3 (Wi-Fi Protected Access version 3) with a pre-shared key or 802.1X can be used to integrate with an existing authentication database.","enw":"B. Remove unauthorized MAC addresses from the filter Since MAC addresses are visible when capturing packets, any unauthorized users affected by th
