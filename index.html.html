ata center access with only one authentication factor"},{"k":"B","t":"Spoofing of internal IP addresses when accessing an intranet server"},{"k":"C","t":"Employee VPN access uses a weak encryption cipher"},{"k":"D","t":"Lack of patch updates on an Internet-facing database server"}],"ans":["D"],"es":"Un hacktivista atacaría desde Internet; un servidor de base de datos expuesto y sin parches es la mayor preocupación.","en":"D. Lack of patch updates on an Internet-facing database server One of the easiest ways for a third-party to obtain information is through an existing Internet connection. A hacktivist could potentially exploit an unpatched server to obtain unauthorized access to the operating system and data.","enw":"A. Data center access with only one authentication factor Most hacktivists don’t have access to walk around inside of your building, and they certainly wouldn’t have access to secure areas. A single authentication method would commonly prevent unauthorized access to a data center for both employees and non-employees, although more authentication factors would provide additional security. B. Spoofing of internal IP addresses when accessing an intranet server Intranet servers are not accessible from the outside. This makes them an unlikely target for hacktivists and other non-employees. C. Employee VPN access uses a weak encryption cipher A weak encryption cipher can be a security issue, but a potential exploitation would require the network traffic to begin any decryption attempts. Although this scenario would technically be possible if someone was to catch an employee on a public wireless network, it’s not the most significant security issue in the available list."},{"id":"B63","exam":"B","n":63,"type":"mc","dom":3,"obj":"3.2","objtxt":"SY0-701, Objective 3.2 - Firewall Types","qparts":[{"k":"p","v":"A company is installing a security appliance to protect the organization's web-based applications from attacks such as SQL injections and unexpected input. Which of the following would BEST describe this appliance?"}],"opts":[{"k":"A","t":"WAF"},{"k":"B","t":"VPN concentrator"},{"k":"C","t":"UTM"},{"k":"D","t":"SASE"}],"ans":["A"],"es":"WAF (Web Application Firewall) protege aplicaciones web contra inyección SQL, XSS y entradas inválidas.","en":"A. WAF A WAF (Web Application Firewall) is designed as a firewall for web-based applications. WAFs are commonly used to protect against application attacks such as injections, cross-site scripting, and invalid input types.","enw":"B. VPN concentrator A VPN (Virtual Private Network) concentrator is the central connectivity point for all remote VPN users. A VPN concentrator would not be used as protection against application attacks. C. UTM A UTM (Unified Threat Management) appliance acts as a traditional firewall, and many UTMs may also include additional features such as intrusion prevention and content filtering. However, UTMs are not commonly used for protection of web-based applications. D. SASE SASE (Secure Access Service Edge) is a cloud-aware version of a VPN client, and it is commonly deployed as a client on the user device. A SASE solution would not commonly be used to protect a web-based application."},{"id":"B64","exam":"B","n":64,"type":"mc","dom":4,"obj":"4.8","objtxt":"SY0-701, Objective 4.8 - Digital Forensics","qparts":[{"k":"p","v":"Which of the following would be the BEST way to determine if files have been modified after the forensics data acquisition process has occurred?"}],"opts":[{"k":"A","t":"Use a tamper seal on all storage devices"},{"k":"B","t":"Create a hash of the data"},{"k":"C","t":"Image each storage device for future comparison"},{"k":"D","t":"Take screenshots of file directories with file sizes"}],"ans":["B"],"es":"Un hash permite verificar rápidamente si los datos cambiaron después de la adquisición forense.","en":"B. Create a hash of the data A hash creates a unique value and can be quickly validated at any time in the future. If the hash value changes, then the data must have also changed.","enw":"A. Use a tamper seal on all storage devices A physical tamper seal will identify if a device has been opened or physically modified, but it cannot identify any changes to the data on the storage device. C. Image each storage device for future comparison A copy of the data would allow for comparisons later, but the process of comparing the data would take much more time than simply validating a hash value. It’s also possible that someone could tamper with both the original data and the copy of the data. D. Take screenshots of file directories with file sizes It’s very easy to change the contents of a file without changing the size of the file. Storing the file sizes would not provide any data integrity checks."},{"id":"B65","exam":"B","n":65,"type":"mc","dom":4,"obj":"4.6","objtxt":"SY0-701, Objective 4.6 - Password Security","qparts":[{"k":"p","v":"A system administrator is implementing a password policy that would require letters, numbers, and special characters to be included in every password. Which of the following controls MUST be in place to enforce this password policy?"}],"opts":[{"k":"A","t":"Length"},{"k":"B","t":"Expiration"},{"k":"C","t":"Reuse"},{"k":"D","t":"Complexity"}],"ans":["D"],"es":"Complejidad: obliga a mezclar letras, números y caracteres especiales. La longitud es otro control.","en":"D. Complexity Adding different types of characters to a password requires technical controls that increase password complexity.","enw":"A. Length Adding all of these character types to a password do not necessarily change the length of the password. B. Expiration A common password security policy is an expiration date. This password expiration requires the user to periodically change their password. C. Reuse The controls that prohibit the reuse of passwords do not control the characters used in the password."},{"id":"B66","exam":"B","n":66,"type":"mc","dom":1,"obj":"1.3","objtxt":"SY0-701, Objective 1.3 - Change Management Process","qparts":[{"k":"p","v":"Which of the following would a company follow to deploy a weekly operating system patch?"}],"opts":[{"k":"A","t":"Tabletop exercise"},{"k":"B","t":"Penetration testing"},{"k":"C","t":"Change management"},{"k":"D","t":"Internal audit"}],"ans":["C"],"es":"Un parche semanal del SO se despliega siguiendo el proceso de change management.","en":"C. Change management Change management is a formal process used to control and manage any changes to hardware, software, or any other part of the IT infrastructure.","enw":"A. Tabletop exercise A tabletop exercise is associated with disaster recovery planning. Instead of performing a full-scale disaster recovery test, the organization's key decision makers sit at a table and describe the steps they would follow if a disaster was to occur. B. Penetration testing Penetration testing is used to find vulnerabilities and other security issues. Although a penetration test might discover an unpatched system, the process of deploying the patch would be managed by the change control process. D. Internal audit Internal audits are important security validations, but an audit would not be used to deploy patches to company devices."},{"id":"B67","exam":"B","n":67,"type":"mc","dom":2,"obj":"2.4","objtxt":"SY0-701, Objective 2.4 - Replay Attacks","qparts":[{"k":"p","v":"Which of the following would be the MOST likely result of plaintext application communication?"}],"opts":[{"k":"A","t":"Buffer overflow"},{"k":"B","t":"Replay attack"},{"k":"C","t":"Resource consumption"},{"k":"D","t":"Directory traversal"}],"ans":["B"],"es":"Replay attack: si la comunicación va en texto plano, el atacante la captura y la reenvía fácilmente.","en":"B. Replay attack To perform a replay attack, the attacker needs to capture the original non-encrypted content. If an application is not using encrypted communication, the data capture process is a relatively simple process for the attacker.","enw":"A. Buffer overflow A buffer overflow takes advantage of an application vulnerability and can perform this overflow over both an encrypted or non-encrypted channel. C. Resource consumption Resource consumption describes the use of network bandwidth or storage space, but those resource issues don't necessarily require the network communication to be sent in the clear. D. Directory traversal Directory traversal is commonly associated with unexpected access to the file system of a server. Non-encrypted communication is not a prerequisite in a directory traversal attack."},{"id":"B68","exam":"B","n":68,"type":"mc","dom":4,"obj":"4.5","objtxt":"SY0-701, Objective 4.5 - Monitoring Data","qparts":[{"k":"p","v":"A system administrator believes that certain configuration files on a Linux server have been modified from their original state. The administrator has reverted the configurations to their original state, but he would like to be notified if they are changed again. Which of the following would be the BEST way to provide this functionality?"}],"opts":[{"k":"A","t":"HIPS"},{"k":"B","t":"File integrity monitoring"},{"k":"C","t":"Application allow list"},{"k":"D","t":"WAF"}],"ans":["B"],"es":"File integrity monitoring (FIM): avisa si el contenido de archivos como configuraciones cambia.","en":"B. File integrity monitoring File integrity monitoring software (i.e., Tripwire, System File Checker, etc.) can be used to alert if the contents of a file are modified.","enw":"A. HIPS The use of HIPS (Host-based Intrusion Prevention System) would help identify any security vulnerabilities, but there’s nothing relating to this issue that would indicate it was caused by an operating system or application vulnerability. A HIPS would not commonly alert on the modification of a specific file. C. Application allow list In this example, we’re not sure how the file was changed or if a separate application or editor was used. If the change was made with a valid application, an allow list would not provide any feedback or alerts. D. WAF A WAF (Web Application Firewall) is used to protect web-based applications from malicious attack. The example in this question was not related to a web-based application."},{"id":"B69","exam":"B","n":69,"type":"mc","dom":4,"obj":"4.6","objtxt":"SY0-701, Objective 4.6 - Identity and Access Management","qparts":[{"k":"p","v":"A security administrator is updating the network infrastructure to support 802.1X. Which of the following would be the BEST choice for this configuration?"}],"opts":[{"k":"A","t":"LDAP"},{"k":"B","t":"SIEM"},{"k":"C","t":"SNMP traps"},{"k":"D","t":"SPF"}],"ans":["A"],"es":"LDAP es un protocolo de autenticación centralizada que sirve para 802.1X. RADIUS, TACACS+ o Kerberos también podrían usarse.","en":"A. LDAP 802.1X is a standard for authentication, and LDAP (Lightweight Directory Access Protocol) is a common protocol used for centralized authentication. Other protocols such as RADIUS, TACACS+, or Kerberos would also be options for 802.1X authentication.","enw":"B. SIEM A SIEM (Security Information and Event Management) system is designed to consolidate log files from multiple devices, quickly search through data, and create long-term reports. A SIEM does not provide any additional functionality for the authentication process. C. SNMP traps SNMP (Simple Network Management Protocol) traps are used to provide alerts and alarms from servers and infrastructure devices. SNMP is not an authentication protocol. D. SPF SPF (Sender Policy Framework) is an email security standard used to validate authorized mail senders. The SPF information is added to a DNS (Domain Name System) server and accessed by email recipients."},{"id":"B70","exam":"B","n":70,"type":"mc","dom":3,"obj":"3.1","objtxt":"SY0-701, Objective 3.1 - Other Infrastructure Concepts","qparts":[{"k":"p","v":"A company owns a time clock appliance, but the time clock doesn’t provide any access to the operating system and it doesn't provide a method to upgrade the firmware. Which of the following describes this appliance?"}],"opts":[{"k":"A","t":"End-of-life"},{"k":"B","t":"ICS"},{"k":"C","t":"SDN"},{"k":"D","t":"Embedded system"}],"ans":["D"],"es":"Un sistema embebido (embedded) suele no dar acceso al SO ni permitir actualizar el firmware.","en":"D. Embedded system An embedded system often does not provide access to the OS and may not provide a method of upgrading the system firmware.","enw":"A. End-of-life A device at its end-of-life is no longer supported by the vendor. In this example, the vendor support status isn’t mentioned. B. ICS ICS (Industrial Control Systems) devices are large industrial systems and usually involve manufacturing equipment or power generation equipment. A time clock would not be categorized as an ICS. C. SDN An SDN (Software Defined Network) is commonly used as a method of deploying network components by separating a device into a data plane, control plane, and management plane. A time clock appliance would not be categorized as an SDN."},{"id":"B71","exam":"B","n":71,"type":"mc","dom":4,"obj":"4.2","objtxt":"SY0-701, Objective 4.2 - Asset Management","qparts":[{"k":"p","v":"A company has deployed laptops to all employees, and each laptop is enumerated during each login. Which of the following is supported with this configuration?"}],"opts":[{"k":"A","t":"If the laptop hardware is modified, the security team is alerted"},{"k":"B","t":"Any malware identified on the system is automatically deleted"},{"k":"C","t":"Users are required to use at least two factors of authentication"},{"k":"D","t":"The laptop is added to a private VLAN after the login process"}],"ans":["A"],"es":"Al enumerar el hardware y software en cada inicio de sesión, un cambio de hardware genera una alerta al equipo de seguridad.","en":"A. If the laptop hardware is modified, the security team is alerted The enumeration process identifies and reports on the hardware and software installed on the laptop. If this configuration is changed, an alert can be generated.","enw":"B. Any malware identified on the system is automatically deleted Although it's very likely the laptop is running some type of anti-malware software, this question was regarding the enumeration process. C. Users are required to use at least two factors of authentication It's always a good idea to support multifactor authentication, but the enumeration process does not support any additional authentication factors. D. The laptop is added to a private VLAN after the login process Many organizations can identify the login and automatically move that device to the correct VLANs. The enumeration mentioned does not provide this functionality."},{"id":"B72","exam":"B","n":72,"type":"mc","dom":2,"obj":"2.5","objtxt":"SY0-701, Objective 2.5 - Hardening Techniques","qparts":[{"k":"p","v":"A security manager believes that an employee is using their laptop to circumvent the corporate Internet security controls through the use of a cellular hotspot. Which of the following could be used to validate this belief? (Select TWO)"}],"opts":[{"k":"A","t":"HIPS"},{"k":"B","t":"UTM logs"},{"k":"C","t":"Web application firewall events"},{"k":"D","t":"Host-based firewall logs"},{"k":"E","t":"Next-generation firewall logs"}],"ans":["A","D"],"es":"Si usa un hotspot celular, el tráfico evade la red corporativa; solo quedan evidencias en la propia laptop: HIPS y logs del firewall de host.","en":"A. HIPS and D. Host-based firewall logs If the laptop is not communicating across the corporate network, then the only evidence of the traffic would be contained on the laptop itself. A HIPS (Host-based Intrusion Prevention System) logs and host-based firewall logs may contain information about recent traffic flows to systems outside of the corporate network.","enw":"B. UTM logs A unified threat management appliance is commonly located in the core of the network. The use of a cellular hotspot would circumvent the UTM and this traffic would not be logged. C. Web application firewall events Web application firewalls are commonly used to protect internal web servers. Outbound Internet communication would not be logged, and anyone circumventing the existing security controls would also not be logged. E. Next-generation firewall logs Although a next-generation firewall keeps detailed logs, any systems communicating outside of the normal corporate Internet connection would not appear in those logs."},{"id":"B73","exam":"B","n":73,"type":"mc","dom":1,"obj":"1.4","objtxt":"SY0-701, Objective 1.4 - Encryption Technologies","qparts":[{"k":"p","v":"An application developer is creating a mobile device app that will require a true random number generator real-time memory encryption. Which of the following technologies would be the BEST choice for this app?"}],"opts":[{"k":"A","t":"HSM"},{"k":"B","t":"Secure enclave"},{"k":"C","t":"NGFW"},{"k":"D","t":"Self-signed certificates"}],"ans":["B"],"es":"Secure enclave: procesador de seguridad que genera números aleatorios verdaderos y cifra la memoria en tiempo real.","en":"B. Secure enclave A secure enclave describes a hardware processor designed for security. The secure enclave monitors the boot process, create true random numbers, store root cryptography keys, and much more.","enw":"A. HSM An HSM (Hardware Security Module) is often implemented as a high\u0002end cryptographic hardware appliance. HSMs are often used as secure storage for cryptographic keys. C. NGFW An NGFW (Next Generation Firewall) is an application aware firewall and is commonly used to manage traffic flows. An NGFW would not be able to provide true random numbers or real-time memory encryption on a device. D. Self-signed certificates A self-signed certificate is a digital certificate created on a private Certificate Authority and digitally signed by the private CA. A certificate does not provide randomization functions or memory encryption capabilities."},{"id":"B74","exam":"B","n":74,"type":"mc","dom":4,"obj":"4.3","objtxt":"SY0-701, Objective 4.3 - Vulnerability Scanning","qparts":[{"k":"p","v":"Which of the following would be a common result of a successful vulnerability scan?"}],"opts":[{"k":"A","t":"Usernames and password hashes from a server"},{"k":"B","t":"A list of missing software patches"},{"k":"C","t":"A copy of image files from a private file share"},{"k":"D","t":"The BIOS configuration of a server"}],"ans":["B"],"es":"Un escaneo de vulnerabilidades suele entregar una lista de parches faltantes, no credenciales ni archivos.","en":"B. A list of missing software patches A vulnerability scan can identify vulnerabilities and list the patches associated with those vulnerabilities.","enw":"A. Usernames and password hashes from a server This type of secure information cannot be obtained through a vulnerability scan. C. A copy of image files from a private file share A private file share would prevent any access by unauthorized users, and a vulnerability scan would not have access to private data. D. The BIOS configuration of a server Private information, such as a device’s BIOS configuration, is not available from a vulnerability scan."},{"id":"B75","exam":"B","n":75,"type":"mc","dom":2,"obj":"2.2","objtxt":"SY0-701, Objective 2.2 - Common Threat Vectors","qparts":[{"k":"p","v":"When connected to the wireless network, users at a remote site receive an IP address which is not part of the corporate address scheme. Communication over this network is also slower than the wireless connections elsewhere in the building. Which of the following would be the MOST likely reason for these issues?"}],"opts":[{"k":"A","t":"Rogue access point"},{"k":"B","t":"Domain hijack"},{"k":"C","t":"DDoS"},{"k":"D","t":"Encryption is enabled"}],"ans":["A"],"es":"Rogue access point: un AP no autorizado entrega IPs fuera del esquema corporativo y es más lento.","en":"A. Rogue access point A rogue access point is an unauthorized access point added by a user or attacker. This access point may not necessarily be malicious, but it does create significant security concerns and unauthorized access to the corporate network.","enw":"B. Domain hijack A domain hijacking would be associated with unauthorized access to a domain name. In this example, the wireless IP addressing and performance issues do not appear to be related to a domain hijack. C. DDoS A DDOS (Distributed Denial of Service) would cause outages or slow performance to a service. A DDoS would not commonly modify or update any local IP addresses. D. Encryption is enabled Wireless encryption protocols are relatively efficient and do not contribute to a significant delay of network traffic. An encrypted wireless network would also not assign IP addresses outside of the expected range."},{"id":"B76","exam":"B","n":76,"type":"mc","dom":4,"obj":"4.4","objtxt":"SY0-701, Objective 4.4 - Security Tools","qparts":[{"k":"p","v":"A company has identified a compromised server, and the security team would like to know if an attacker has used this device to move between systems. Which of the following would be the BEST way to provide this information?"}],"opts":[{"k":"A","t":"DNS server logs"},{"k":"B","t":"Penetration test"},{"k":"C","t":"NetFlow logs"},{"k":"D","t":"Email metadata"}],"ans":["C"],"es":"Los logs NetFlow muestran las conversaciones de red del equipo comprometido hacia otros sistemas (movimiento lateral).","en":"C. NetFlow logs NetFlow information can provide a summary of network traffic, application usage, and details of network conversations. The NetFlow logs will show all conversations from this device to any others in the network.","enw":"A. DNS server logs DNS server logs will document all name resolutions, but an attacker may not be using a DNS server and may prefer accessing devices by IP address. B. Penetration test A penetration test may identify any vulnerabilities that exist on the server, but it won't provide any information about traffic flows or connections initiated by an attacker. D. Email metadata An email header contains the IP addresses of email servers used to transfer the message, and security signatures to verify the sender. The metadata in an email header would not contain information on traffic flows associated with this attacker."},{"id":"B77","exam":"B","n":77,"type":"mc","dom":1,"obj":"1.4","objtxt":"SY0-701, Objective 1.4 - Public Key Infrastructure","qparts":[{"k":"p","v":"A system administrator has protected a set of system backups with an encryption key. The system administrator used the same key when restoring files from this backup. Which of the following would BEST describe this encryption type?"}],"opts":[{"k":"A","t":"Asymmetric"},{"k":"B","t":"Key escrow"},{"k":"C","t":"Symmetric"},{"k":"D","t":"Out-of-band key exchange"}],"ans":["C"],"es":"Cifrado simétrico: la misma clave cifra y descifra los respaldos.","en":"C. Symmetric Symmetric encryption uses the same key for both encryption and decryption.","enw":"A. Asymmetric Asymmetric encryption uses different keys for encryption and decryption. B. Key escrow Key escrow describes a third-party which holds the decryption keys for your data. D. Out-of-band key exchange Keys can be transferred between people or systems over the network (in\u0002band) or outside the normal network communication (out-of-band). In this example, the key wasn’t exchanged between people or systems, since the system administrator is the same person who encrypted and decrypted."},{"id":"B78","exam":"B","n":78,"type":"mc","dom":4,"obj":"4.5","objtxt":"SY0-701, Objective 4.5 - Monitoring Data","qparts":[{"k":"p","v":"A new malware variant takes advantage of a vulnerability in a popular email client. Once installed, the malware forwards all email attachments with credit card information to an external email address. Which of the following would limit the scope of this attack?"}],"opts":[{"k":"A","t":"Enable MFA on the email client"},{"k":"B","t":"Scan outgoing traffic with DLP"},{"k":"C","t":"Require users to enable the VPN when using email"},{"k":"D","t":"Update the list of malicious URLs in the firewall"}],"ans":["B"],"es":"DLP revisa el tráfico saliente y bloquea la salida de datos de tarjetas, limitando el alcance del malware.","en":"B. Scan outgoing traffic with DLP DLP (Data Loss Prevention) systems are designed to identify sensitive data transfers. If the DLP finds a data transfer with financial details, personal information, or other private information, the DLP can block the data transfer.","enw":"A. Enable MFA on the email client MFA (Multi-Factor Authentication) can provide more security during the authentication process, but the description of the malware did not associate the exploit with the login process. The malware will most likely wait for the user to login before transferring the data. C. Require users to enable the VPN when using email A VPN (Virtual Private Network) can protect data between systems, but it won't prevent malware from sending data once it connects to the email system. D. Update the list of malicious URLs in the firewall Blocking known URLs (Uniform Resource Locators) in a firewall is a useful way to prevent access to known malicious sites, but it won't prevent malware from sending email messages."},{"id":"B79","exam":"B","n":79,"type":"mc","dom":4,"obj":"4.8","objtxt":"SY0-701, Objective 4.8 - Incident Response","qparts":[{"k":"p","v":"An organization has identified a security breach and has removed the affected servers from the network. Which of the following is the NEXT step in the incident response process?"}],"opts":[{"k":"A","t":"Eradication"},{"k":"B","t":"Preparation"},{"k":"C","t":"Recovery"},{"k":"D","t":"Detection"},{"k":"E","t":"Containment"}],"ans":["A"],"es":"Tras contener el incidente (servidores fuera de la red), sigue la erradicación.","en":"A. Eradication The incident response process is preparation, detection, analysis, containment, eradication, recovery, and lessons learned. Once a system has been contained, any malware or breached user accounts should be removed from the system.","enw":"B. Preparation Before an incident occurs, you should compile contact information, incident handling hardware and software, analysis resources, and other important tools and policies. C. Recovery The focus of the recovery process is to get all of the systems back to normal. This phase removes malware, deletes breached user accounts, and fixes any vulnerabilities. D. Detection Detection of an event can be challenging, but it usually consists of IPS reports, anti-virus alerts, configuration change notifications, and other indicators. E. Containment In this example, the containment and isolation occurred when the affected servers were removed from the network."},{"id":"B80","exam":"B","n":80,"type":"mc","dom":5,"obj":"5.4","objtxt":"SY0-701, Objective 5.4 - Privacy","qparts":[{"k":"p","v":"A security administrator has been tasked with storing and protecting customer payment and shipping information for a three-year period. Which of the following would describe the source of this data?"}],"opts":[{"k":"A","t":"Controller"},{"k":"B","t":"Owner"},{"k":"C","t":"Data subject"},{"k":"D","t":"Processor"}],"ans":["C"],"es":"Data subject: la persona a quien pertenece la información personal (pago y dirección de envío).","en":"C. Data subject In data privacy, the data subject describes an individual with personal data. Payment details and shipping addresses describe personal information from a data subject.","enw":"A. Controller A data controller manages the processing of the data. A payroll department would be an example of a data controller. B. Owner The data owner is commonly accountable for all of the data, and the owner often manages the people and systems associated with processing and securing the data. D. Processor A data processor manages the data on behalf of the data controller. If the data controller is the payroll department, a third-party payroll company would be the data processor."},{"id":"B81","exam":"B","n":81,"type":"mc","dom":3,"obj":"3.2","objtxt":"SY0-701, Objective 3.2 - Encryption Technologies","qparts":[{"k":"p","v":"Which of the following would be the main reasons why a system administrator would use a TPM when configuring full disk encryption? (Select TWO)"}],"opts":[{"k":"A","t":"Allows the encryption of multiple volumes"},{"k":"B","t":"Uses burned-in cryptographic keys"},{"k":"C","t":"Stores certificates in a hardware security module"},{"k":"D","t":"Maintains a copy of the CRL"},{"k":"E","t":"Includes built-in protections against brute-force attacks"}],"ans":["B","E"],"es":"El TPM usa claves grabadas en hardware y tiene protecciones contra fuerza bruta y diccionario al proteger el cifrado de disco.","en":"B. Uses burned-in cryptographic keys and E. Includes built-in protections against brute-force attacks A TPM (Trusted Platform Module) is part of a computer’s motherboard, and it’s specifically designed to assist and protect with cryptographic functions. Full disk encryption (FDE) can use the burned-in TPM keys to verify the local device hasn’t changed, and there are security features in the TPM to prevent brute-force or dictionary attacks against the full disk encryption login credentials.","enw":"A. Allows the encryption of multiple volumes The use of a TPM is not associated with the number of volumes encrypted with FDE. C. Stores certificates in a hardware security module A hardware security module (HSM) is high-end cryptographic hardware specifically designed for large-scale secured storage on the network. An HSM server is a separate device and is not associated with an individual device’s TPM. D. Maintains a copy of the CRL A CRL (Certificate Revocation List) is maintained by the Certificate Authority and is not part of the TPM."},{"id":"B82","exam":"B","n":82,"type":"mc","dom":4,"obj":"4.6","objtxt":"SY0-701, Objective 4.6 - Access Controls","qparts":[{"k":"p","v":"A security administrator is using an access control where each file or folder is assigned a security clearance level, such as “confidential” or “secret.” The security administrator then assigns a maximum security level to each user. What type of access control is used in this network?"}],"opts":[{"k":"A","t":"Mandatory"},{"k":"B","t":"Rule-based"},{"k":"C","t":"Discretionary"},{"k":"D","t":"Role-based"}],"ans":["A"],"es":"Control de acceso obligatorio (MAC): niveles como confidential o secret en objetos y niveles máximos por usuario.","en":"A. Mandatory Mandatory access control uses a series of security levels (i.e., public, private, secret) and assigns those levels to each object in the operating system. Users are assigned a security level, and they would only have access to objects that meet or are below that assigned security level.","enw":"B. Rule-based Rule-based access control determines access based on a series of system\u0002enforced rules. An access rule might require a particular browser be used to complete a web page form, or access to a file or system is only allowed during certain times of the day. C. Discretionary Discretionary access control allows the owner of an object to assign access. If a user creates a spreadsheet, the user can then assign users and groups to have a particular level of access to that spreadsheet. D. Role-based Role-based access control assigns a user’s permissions based on their role in the organization. For example, a manager would have a different set of rights and permissions than a team lead."},{"id":"B83","exam":"B","n":83,"type":"mc","dom":2,"obj":"2.5","objtxt":"SY0-701, Objective 2.5 - Segmentation and Access Control","qparts":[{"k":"p","v":"A security administrator is reviewing a report showing a number of devices on internal networks are connecting with servers in the data center network. Which of the following security systems should be added to prevent internal systems from accessing data center devices?"}],"opts":[{"k":"A","t":"VPN"},{"k":"B","t":"IPS"},{"k":"C","t":"SIEM"},{"k":"D","t":"ACL"}],"ans":["D"],"es":"Una ACL en routers o firewalls permite o bloquea los flujos entre redes internas y el data center.","en":"D. ACL An ACL (Access Control List) is a security control commonly implemented on routers to allow or restrict traffic flows through the network.","enw":"A. VPN A VPN (Virtual Private Network) can be used to secure data traversing the network, but it’s not commonly used to control traffic flows on an internal network. B. IPS An IPS (Intrusion Prevention System) is designed to identify and block known vulnerabilities traversing the network. An IPS is not used to control other traffic flows. C. SIEM A SIEM (Security Information and Event Management) server is commonly used to consolidate and report on log files. A SIEM would not be able to control or limit network communication."},{"id":"B84","exam":"B","n":84,"type":"mc","dom":4,"obj":"4.2","objtxt":"SY0-701, Objective 4.2 - Incident Response Planning","qparts":[{"k":"p","v":"A financial services company is headquartered in an area with a high occurrence of tropical storms and hurricanes. Which of the following would be MOST important when restoring services disabled by a storm?"}],"opts":[{"k":"A","t":"Disaster recovery plan"},{"k":"B","t":"Stakeholder management"},{"k":"C","t":"Change management"},{"k":"D","t":"Retention policies"}],"ans":["A"],"es":"Para restaurar servicios tras una tormenta lo más importante es el plan de recuperación ante desastres (DRP).","en":"A. Disaster recovery plan A disaster recovery plan is a comprehensive set of processes for large-scale outages that affect the organization. Natural disasters, technology failures, and human-created disasters would be reasons to implement a disaster recovery plan.","enw":"B. Stakeholder management Stakeholder management describes the relationship IT has with the their customers. Although stakeholder management is common for the change control process, the priority after a major event is to start the disaster recovery process. C. Change management Change management is an important process when making any type of planned and expected change to the infrastructure. When a tropical storm affects uptime and availability, the disaster recovery plan would be the better choice. D. Retention policies Retention policies specify the type and amount of data that must be backed up and stored. These policies are often self-imposed or part of a larger set of rules and regulations."},{"id":"B85","exam":"B","n":85,"type":"mc","dom":2,"obj":"2.4","objtxt":"SY0-701, Objective 2.4 - Other Malware Types","qparts":[{"k":"p","v":"A user in the mail room has reported an overall slowdown of his shipping management software. An anti-virus scan did not identify any issues, but a more thorough malware scan identified a kernel driver which is not part of the original operating system installation. Which of the following malware was installed on this system?"}],"opts":[{"k":"A","t":"Rootkit"},{"k":"B","t":"Logic bomb"},{"k":"C","t":"Bloatware"},{"k":"D","t":"Ransomware"},{"k":"E","t":"Keylogger"}],"ans":["A"],"es":"Rootkit: un driver de kernel que no es parte del SO y se oculta explica la lentitud y que el antivirus no lo vea.","en":"A. Rootkit A rootkit often modifies core system files and becomes effectively invisible to the rest of the operating system. The modification of system files and specialized kernel-level drivers are common rootkit techniques.","enw":"B. Logic bomb A logic bomb waits for a predefined event, and then executes at that event time. This event may be a time of day, a user event, or any other identifiable event. C. Bloatware Bloatware consists of apps which have been preinstalled onto new phones, tablets, or computers. Some of these apps can create resource contention for CPU time, memory capacity, or free storage space. D. Ransomware Ransomware makes itself quite visible on your system, and it usually presents warning messages and information on how to remove the ransomware from the system. E. Keylogger A keylogger captures keyboard and mouse input and sends that information to another device. This usually means the keylogger has a visible component in the list of processes, and the keylogger traffic can often be seen on the network."},{"id":"B86","exam":"B","n":86,"type":"mc","dom":4,"obj":"4.9","objtxt":"SY0-701, Objective 4.9 - Log Data","qparts":[{"k":"p","v":"A virus scanner has identified a macro virus in a word processing file attached to an email. Which of the following information could be obtained from the metadata of this file?"}],"opts":[{"k":"A","t":"IPS signature name and number"},{"k":"B","t":"Operating system version"},{"k":"C","t":"Date and time when the file was created"},{"k":"D","t":"Alert disposition"}],"ans":["C"],"es":"Los metadatos de un archivo suelen incluir fecha y hora de creación. La información del IPS o de la alerta no se guarda en el archivo.","en":"C. Date and time when the file was created The data and time the file was created is commonly found in the metadata of the document.","enw":"A. IPS signature name and number The metadata is stored in the word processing file, and the IPS will not change the information stored in the file or appear anywhere in the document itself. B. Operating system version Word processing files are not specific to an operating system, so it would not be common to find OS information stored in the metadata of a word processing file. D. Alert disposition The alert information created when the macro virus was discovered would not be included as part of the word processing file metadata."},{"id":"B87","exam":"B","n":87,"type":"mc","dom":1,"obj":"1.2","objtxt":"SY0-701, Objective 1.2 - Physical Security","qparts":[{"k":"p","v":"When a person enters a data center facility, they must check-in before they are allowed to move further into the building. People who are leaving must be formally checked-out before they are able to exit the building. Which of the following would BEST facilitate this process?"}],"opts":[{"k":"A","t":"Access control vestibule"},{"k":"B","t":"Air gap"},{"k":"C","t":"Pressure sensors"},{"k":"D","t":"Bollards"}],"ans":["A"],"es":"Un vestíbulo de control de acceso ayuda a controlar el registro de entrada y salida de personas.","en":"A. Access control vestibule An access control vestibule is commonly used to control the flow of people through a particular area. Unlocking the one door of the vestibule commonly restricts the other door from opening, thereby preventing someone from walking through without stopping. It’s common in large data centers to have a single room as the access control vestibule where users are checked in and out of the facility.","enw":"B. Air gap An air gap is a security control that creates a physical separation between devices or networks. An air gap is not used to manage the flow of people. C. Pressure sensors A pressure sensor detects a change in force, and they are commonly used for floor and window sensors. Pressure sensors are not used for the check\u0002in process at a data center. D. Bollards Bollards are often used to channel people through a specific access point and prevent vehicles from entering the area. Bollards may help to protect the outside of a data center building, but bollards are not used as access control devices for data centers or other secure facilities."},{"id":"B88","exam":"B","n":88,"type":"mc","dom":1,"obj":"1.4","objtxt":"SY0-701, Objective 1.4 - Obfuscation","qparts":[{"k":"p","v":"A security administrator has discovered an employee exfiltrating confidential company information by embedding data within image files and emailing the images to a third-party. Which of the following would best describe this activity?"}],"opts":[{"k":"A","t":"Digital signatures"},{"k":"B","t":"Steganography"},{"k":"C","t":"Salting"},{"k":"D","t":"Data masking"}],"ans":["B"],"es":"Esteganografía: ocultar datos dentro de imágenes para sacarlos de la empresa.","en":"B. Steganography Steganography is the process of hiding information within another document. For example, one common method of steganography embeds data or documents within image files.","enw":"A. Digital signatures A digital signature is a cryptographic method used to check the integrity, authentication, and non-repudiation of a message. Digital signatures are not used to hide information within image files. C. Salting Salting adds information the hashing process to ensure a unique hash value. The salting process does not involve embedding or hiding data within other types of media. D. Data masking Data masking replaces the display of sensitive information with another value. Replacing a credit card number on a receipt with a series of asterisks would be an example of data masking."},{"id":"B89","exam":"B","n":89,"type":"mc","dom":5,"obj":"5.5","objtxt":"SY0-701, Objective 5.5 - Penetration Tests","qparts":[{"k":"p","v":"A third-party has been contracted to perform a penetration test on a company's public web servers. The testing company has been provided with the external IP addresses of the servers. Which of the following would describe this scenario?"}],"opts":[{"k":"A","t":"Defensive"},{"k":"B","t":"Active reconnaissance"},{"k":"C","t":"Partially known environment"},{"k":"D","t":"Regulatory"}],"ans":["C"],"es":"Partially known environment: el probador recibió solo las IP externas de los servidores.","en":"C. Partially known environment A partially known environment provides limited information about the testing systems and networks during a penetration test.","enw":"A. Defensive A defensive approach to penetration tests usually involves the blue team identifying incoming attacks in real-time. B. Active reconnaissance Active reconnaissance gathers information which could be visible on network traffic logs and packet captures. The IP addresses of the servers were provided by the client and are not part of a reconnaissance process. D. Regulatory Some organizations may be required by regulation to perform ongoing vulnerability scans and security tasks. There's no mention in this question regarding any legal or regulatory requirements."},{"id":"B90","exam":"B","n":90,"type":"mc","dom":5,"obj":"5.2","objtxt":"SY0-701, Objective 5.2 - Risk Analysis","qparts":[{"k":"p","v":"Which of the following would be the best way to describe the estimated number of laptops that might be stolen in a fiscal year?"}],"opts":[{"k":"A","t":"ALE"},{"k":"B","t":"SLE"},{"k":"C","t":"ARO"},{"k":"D","t":"MTTR"}],"ans":["C"],"es":"ARO (Annualized Rate of Occurrence): cuántos eventos se esperan por año, como laptops robadas.","en":"C. ARO The ARO (Annualized Rate of Occurrence) describes the number of instances estimated to occur in a year. For example, if the organization expect to lose seven laptops to theft in a year, the ARO for laptop theft is seven.","enw":"A. ALE The ALE (Annual Loss Expectancy) is the expected cost for all events in a single year. If it costs $1,000 to replace a single laptop (the SLE) and you expect to lose seven laptops in a year (the ARO), the ALE for laptop theft is $7,000. B. SLE SLE (Single Loss Expectancy) is the monetary loss if a single event occurs. If one laptop is stolen, the cost to replace that single laptop is the SLE, or $1,000. D. MTTR MTTR (Mean Time to Repair) is the time required to repair a product or system after a failure."},{"id":"C1","exam":"C","n":1,"type":"pbq","mode":"match","dom":4,"obj":"SY0-701, Objetivo 4.5 - Firewalls","prompt":"Refer to the firewall rules below. Categorize the traffic flows as ALLOWED or BLOCKED through the firewall.","choices":["ALLOWED","BLOCKED"],"items":[{"t":"Use a secure terminal to connect to 10.1.10.88","a":"ALLOWED","w":"SSH = TCP/22. La regla 1 lo permite."},{"t":"Share the desktop on server 10.1.10.120","a":"BLOCKED","w":"RDP usa TCP/3389 y solo se permite hacia 10.1.10.61; hacia .120 solo se permiten TCP/80 y 443."},{"t":"Perform a DNS query from 10.1.10.88 to 9.9.9.9","a":"ALLOWED","w":"DNS = UDP/53, regla 5."},{"t":"View web pages on 10.1.10.120","a":"ALLOWED","w":"HTTP/HTTPS (TCP/80 y 443) permitidos por las reglas 2 y 3."},{"t":"Authenticate to an LDAP server at 10.1.10.61","a":"BLOCKED","w":"LDAP usa TCP/389 y ninguna regla lo permite: deny implícito."},{"t":"Synchronize the clock on a server at 10.1.10.17","a":"ALLOWED","w":"NTP = UDP/123, regla 6."}],"es":"Reglas: 1 Any>10.1.10.88 TCP/22 Allow; 2 Any>10.1.10.120 TCP/80 Allow; 3 Any>10.1.10.120 TCP/443 Allow; 4 Any>10.1.10.61 TCP/3389 Allow; 5 Any>Any UDP/53 Allow; 6 Any>Any UDP/123 Allow; 7 Any>Any ICMP Block. Todo lo demás se bloquea (deny implícito).","extra":{"head":["Rule #","Source IP","Destination IP","Protocol","Port #","Allow/Block"],"rows":[["1","Any","10.1.10.88","TCP","22","Allow"],["2","Any","10.1.10.120","TCP","80","Allow"],["3","Any","10.1.10.120","TCP","443","Allow"],["4","Any","10.1.10.61","TCP","3389","Allow"],["5","Any","Any","UDP","53","Allow"],["6","Any","Any","UDP","123","Allow"],["7","Any","Any","ICMP","","Block"]]}},{"id":"C2","exam":"C","n":2,"type":"pbq","mode":"match","dom":3,"obj":"SY0-701, Objetivo 3.2 - Appliances de red","prompt":"Match the device to the description. Some device types will not be used.","choices":["WAF","Proxy server","Load balancer","Sensor","MDM","Router","Jump server","IPS"],"items":[{"t":"Block SQL injection over an Internet connection","a":"IPS","w":"El IPS detecta exploits en el tráfico y lo bloquea."},{"t":"Intercept all browser requests and cache the results","a":"Proxy server","w":"El proxy hace las solicitudes por el usuario, filtra y guarda en caché."},{"t":"Forward packets between separate VLANs","a":"Router","w":"El router reenvía tráfico entre subredes o VLAN."},{"t":"Configure a group of redundant web servers","a":"Load balancer","w":"Reparte la carga y da tolerancia a fallas."},{"t":"Evaluate the input to a browser-based application","a":"WAF","w":"El WAF examina la entrada de aplicaciones web."}],"es":"No se usan Sensor, MDM ni Jump server.","extra":null},{"id":"C3","exam":"C","n":3,"type":"pbq","mode":"match","dom":2,"obj":"SY0-701, Objetivo 2.4 - Ataques a aplicaciones","prompt":"Match the attack type to the characteristic.","choices":["DDoS","Replay","Rootkit","Phishing","Brute force","Injection"],"items":[{"t":"A website stops responding to normal requests","a":"DDoS","w":"Muchos atacantes saturan la capacidad del servicio."},{"t":"Data is captured and retransmitted to a server","a":"Replay","w":"Se captura y se reenvía el tráfico como si fuera el usuario original."},{"t":"The malware is designed to remain hidden on a computer system","a":"Rootkit","w":"Modifica archivos del sistema para permanecer invisible."},{"t":"A list of passwords are attempted with a known username","a":"Brute force","w":"Se prueban muchas contraseñas contra un usuario conocido."},{"t":"An email link redirects a user to a site that requests login credentials","a":"Phishing","w":"Sitio copia y un poco de ingeniería social."},{"t":"Permissions are circumvented by adding additional code as application input","a":"Injection","w":"Se agrega código a la entrada para evadir la seguridad de la aplicación."}],"es":"Cada ataque tiene una característica única.","extra":null},{"id":"C4","exam":"C","n":4,"type":"pbq","mode":"match","dom":1,"obj":"SY0-701, Objetivo 1.4 - Criptografía","prompt":"Match the cryptography technology to the description.","choices":["Salting","Steganography","Masking","Asymmetric","Collision","Key stretching"],"items":[{"t":"Create a stronger key using multiple processes","a":"Key stretching","w":"Se extiende la clave con procesos adicionales o múltiples hashes."},{"t":"Data is hidden within another media type","a":"Steganography","w":"Ocultar datos dentro de otro medio, como una imagen."},{"t":"Different inputs create the same hash","a":"Collision","w":"Dos entradas distintas con el mismo hash."},{"t":"Sensitive data is hidden from view","a":"Masking","w":"Se ocultan datos sensibles, por ejemplo con asteriscos."},{"t":"A different key is used for decryption than encryption","a":"Asymmetric","w":"Una clave cifra y otra distinta descifra."},{"t":"Information is added to make a unique hash","a":"Salting","w":"Se añade información aleatoria antes del hash."}],"es":"Cada término se usa una vez.","extra":null},{"id":"C5","exam":"C","n":5,"type":"pbq","mode":"match","dom":3,"obj":"SY0-701, Objetivo 3.2 - Comunicación segura","prompt":"Add the most applicable security technologies to the following scenarios.","choices":["NGFW","VPN","Sandboxing","SD-WAN","802.1X"],"items":[{"t":"A field service engineer uses their corporate laptop at coffee shops and hotels","a":"VPN","w":"Cifra todo el tráfico en redes públicas."},{"t":"Software developers run a series of tests before deploying an application","a":"Sandboxing","w":"Entorno aislado de pruebas."},{"t":"An administrator prevents employees from visiting known-malicious web sites","a":"NGFW","w":"Firewall con conciencia de aplicación y filtrado de contenido."},{"t":"Directly access cloud-based services from all corporate locations","a":"SD-WAN","w":"Extiende la WAN para acceder directamente a la nube."},{"t":"Users connecting to the network should use their corporate authentication credentials","a":"802.1X","w":"Control de acceso a red con servidor de autenticación central."}],"es":"Cada tecnología se usa una vez.","extra":null},{"id":"C6","exam":"C","n":6,"type":"mc","dom":4,"obj":"4.2","objtxt":"SY0-701, Objective 4.2 - Asset Management","qparts":[{"k":"p","v":"A finance company is legally required to maintain seven years of tax records for all of their customers. Which of the following would be the BEST way to implement this requirement?"}],"opts":[{"k":"A","t":"Automate a script to remove all tax information more than seven years old"},{"k":"B","t":"Print and store all tax records in a seven-year cycle"},{"k":"C","t":"Allow users to download tax records from their account login"},{"k":"D","t":"Create a separate daily backup archive for all applicable tax records"}],"ans":["D"],"es":"Retención de datos: un archivo de respaldo diario garantiza tener siempre la información durante los siete años, aunque se borre del almacenamiento principal. No hay que eliminarla ni imprimirla.","en":"D. Create a separate daily backup archive for all applicable tax records An important consideration for a data retention mandate is to always have access to the information over the proposed time frame. In this example, a daily backup would ensure tax information is constantly archived over a seven year period and could always be retrieved if needed. If data was inadvertently deleted from the primary storage, the backup would still maintain a copy.","enw":"A. Automate a script to remove all tax information more than seven years old The requirement is to maintain data for at least seven years, but there’s no requirement to remove that data after that time frame. For example, some financial information may need to be retained well beyond the seven year mandate. B. Print and store all tax records in a seven-year cycle Paper has its place, but creating physical output of tax records and storing them for seven years would include a significant cost in time, materials, and inventory space. The requirement to store data for seven years doesn’t require the information to be stored in a physical form. C. Allow users to download tax records from their account login Including a feature to allow access to their records is useful for the user community, but it doesn’t provide any data protection for the seven year retention period."},{"id":"C7","exam":"C","n":7,"type":"mc","dom":1,"obj":"1.4","objtxt":"SY0-701, Objective 1.4 - Encryption Technologies","qparts":[{"k":"p","v":"A system administrator is designing a data center for an insurance company’s new public cloud and would like to automatically rotate encryption keys on a regular basis. Which of the following would provide this functionality?"}],"opts":[{"k":"A","t":"TPM"},{"k":"B","t":"Key management system"},{"k":"C","t":"Secure enclave"},{"k":"D","t":"XDR"}],"ans":["B"],"es":"Un sistema de gestión de claves (key management system) crea, asocia, rota y registra el uso de claves desde una consola central. TPM y secure enclave son hardware por dispositivo.","en":"B. Key management system A key management system is used to manage large security key implementations from a central console. This includes creating keys, associating keys with individuals, rotating keys on regular intervals, and logging all key use.","enw":"A. TPM A TPM (Trusted Platform Module) provides cryptographic features on a hardware device. TPMs are often integrated onto the motherboard or system board of an individual device or component. C. Secure enclave A secure enclave is usually implemented as a cryptographic hardware processor and provides extensive security features for a device. D. XDR XDR (Extended Detection and Response) clients are often installed onto user devices to correlate endpoint, network, and cloud data to identify malicious software and attacks."},{"id":"C8","exam":"C","n":8,"type":"mc","dom":4,"obj":"4.4","objtxt":"SY0-701, Objective 4.4 - Security Monitoring","qparts":[{"k":"p","v":"A newly installed IPS is flagging a legitimate corporate application as malicious network traffic. Which of the following would be the BEST way to resolve this issue?"}],"opts":[{"k":"A","t":"Disable the IPS signature"},{"k":"B","t":"Block the application"},{"k":"C","t":"Log all IPS events"},{"k":"D","t":"Tune the IPS alerts"}],"ans":["D"],"es":"Se ajusta (tune) la firma del IPS para que reconozca la aplicación legítima. Desactivar la firma o bloquear la app dejaría sin protección o sin servicio.","en":"D. Tune the IPS alerts Each signature of an IPS can commonly be tuned to properly alert on a legitimate issue. Tuning the IPS can properly identify and block attacks and allow all legitimate traffic.","enw":"A. Disable the IPS signature Disabling the IPS signature would certainly remove the alerts, but it also would prevent the IPS from blocking an actual attack. B. Block the application Blocking the corporate application would be an unusual response, especially when the application is legitimate and does not pose a security concern. C. Log all IPS events It's useful to log all security events, but simply logging the events doesn't correct the false positive report."},{"id":"C9","exam":"C","n":9,"type":"mc","dom":4,"obj":"4.1","objtxt":"SY0-701, Objective 4.1 - Application Security","qparts":[{"k":"p","v":"A security administrator has identified an internally developed application which allows modification of SQL queries through the web-based front\u0002end. Which of the following changes would resolve this vulnerability?"}],"opts":[{"k":"A","t":"Store all credentials as salted hashes"},{"k":"B","t":"Verify the application's digital signature"},{"k":"C","t":"Validate all application input"},{"k":"D","t":"Obfuscate the application's source code"}],"ans":["C"],"es":"Validar toda la entrada de la aplicación evita que se modifiquen consultas SQL (inyección SQL). Hashes con salt, firmas o ofuscar el código no lo evitan.","en":"C. Validate all application input Input validation would examine the input from the client and make sure that the input is expected and not malicious. In this example, validating the input would prevent any SQL (Structured Query Language) injection through the web front-end.","enw":"A. Store all credentials as salted hashes Although credential storage should commonly be salted and hashed, changing the process for storing passwords would not resolve any issues related to application input. B. Verify the application's digital signature Code that has been digitally signed by the application developer can be evaluated to ensure that nothing has changed with the application code since it was published, but it would not prevent any type of code injection. D. Obfuscate the application's source code Obfuscation makes something normally understandable very difficult to understand. Obfuscating the source code of the application would make it much more difficult to read, but it wouldn't prevent a SQL injection."},{"id":"C10","exam":"C","n":10,"type":"mc","dom":4,"obj":"4.6","objtxt":"SY0-701, Objective 4.6 - Multi-factor Authentication","qparts":[{"k":"p","v":"A system administrator is implementing a fingerprint scanner to provide access to the data center. Which of the following authentication technologies would be associated with this access?"}],"opts":[{"k":"A","t":"Digital signature"},{"k":"B","t":"Hard authentication token"},{"k":"C","t":"Security key"},{"k":"D","t":"Something you are"}],"ans":["D"],"es":"Un lector de huellas es algo que eres (factor biométrico).","en":"D. Something you are An authentication factor of \"something you are\" often refers to a physical characteristic. This factor commonly uses fingerprints, facial recognition, or some other biometric characteristic to match a user to an authentication attempt.","enw":"A. Digital signature A digital signature is a cryptographic method used to verify the source and contents of data. Adding a fingerprint scanner would not provide a digital signature. B. Hard authentication token Many software-based authentication tokens are available for our mobile phones and tablets, but there are also stand-alone hard authentication tokens that are often attached to a keyring or lanyard. C. Security key A USB (Universal Serial Bus) security key commonly stores a digital signature for authentication or user verification. A USB key is not commonly part of a fingerprint scanner."},{"id":"C11","exam":"C","n":11,"type":"mc","dom":5,"obj":"5.2","objtxt":"SY0-701, Objective 5.2 - Business Impact Analysis","qparts":[{"k":"p","v":"The IT department of a transportation company maintains an on-site inventory of chassis-based network switch interface cards. If a failure occurs, the on-site technician can replace the interface card and have the system running again in sixty minutes. Which of the following BEST describes this recovery metric?"}],"opts":[{"k":"A","t":"MTBF"},{"k":"B","t":"MTTR"},{"k":"C","t":"RPO"},{"k":"D","t":"RTO"}],"ans":["B"],"es":"MTTR (Mean Time to Repair/Restore): tiempo promedio para reparar y volver a operar, aquí sesenta minutos.","en":"B. MTTR MTTR (Mean Time To Restore) is the amount of time required to get back up and running. This is sometimes called Mean Time To Repair.","enw":"A. MTBF MTBF (Mean Time Between Failures) is a prediction of how long the system will be operational before a failure occurs. C. RPO An RPO (Recovery Point Objective) is a qualifier that determines when the system is recovered. A recovered system may not be completely repaired, but it will be running well enough to maintain a certain level of operation. D. RTO An RTO (Recovery Time Objective) is the service level goal to work towards when recovering a system and getting back up and running."},{"id":"C12","exam":"C","n":12,"type":"mc","dom":2,"obj":"2.1","objtxt":"SY0-701, Objective 2.1 - Threat Actors","qparts":[{"k":"p","v":"A company maintains a server farm in a large data center. These servers are used internally and are not accessible from outside of the data center. The security team has discovered a group of servers was breached before the latest security patches were applied. Breach attempts were not logged on any other servers. Which of these threat actors would be MOST likely involved in this breach?"}],"opts":[{"k":"A","t":"Organized crime"},{"k":"B","t":"Insider"},{"k":"C","t":"Nation state"},{"k":"D","t":"Unskilled attacker"}],"ans":["B"],"es":"Los servidores son internos y solo los vulnerables fueron atacados: lo más probable es un insider, que conoce el estado de parches y tiene acceso.","en":"B. Insider None of these servers are accessible from the outside, and the only servers with any logged connections were also susceptible to the latest vulnerabilities. To complete this attack, there would need a very specific knowledge of the vulnerable systems and a way to communicate with those servers.","enw":"A. Organized crime Organized crime can be very effective at hacking systems and companies, but they can only affect systems where they have access. Internal servers would not be accessible to anyone on the outside of the organization. C. Nation state A nation state would have the resources needed to attack a network, gain access to the internal systems, and then somehow monitor the update processes for each server. However, the scope and breadth of such an attack would be complex, and this would make the nation state a very speculative option and not the most likely choice from the available list. D. Unskilled attacker Unskilled attackers don’t usually have access to an internal network, and they generally aren’t knowledgeable enough to track the status of which systems may have been recently updated."},{"id":"C13","exam":"C","n":13,"type":"mc","dom":4,"obj":"4.3","objtxt":"SY0-701, Objective 4.3 - Analyzing Vulnerabilities","qparts":[{"k":"p","v":"An organization has received a vulnerability scan report of their Internet\u0002facing web servers. The report shows the servers have multiple Sun Java Runtime Environment ( JRE) vulnerabilities, but the server administrator has verified that JRE is not installed. Which of the following would be the BEST way to handle this report?"}],"opts":[{"k":"A","t":"Install the latest version of JRE on the server"},{"k":"B","t":"Quarantine the server and scan for malware"},{"k":"C","t":"Harden the operating system of the web server"},{"k":"D","t":"Ignore the JRE vulnerability alert"}],"ans":["D"],"es":"Es un falso positivo: si JRE no está instalado, la vulnerabilidad no puede existir. Se investiga y se descarta la alerta.","en":"D. Ignore the JRE vulnerability alert It’s relatively common for vulnerability scans to show vulnerabilities that don’t actually exist, especially if the scans are not credentialed. An issue that is identified but does not actually exist is a false positive, and it can be dismissed once the alert has been properly researched.","enw":"A. Install the latest version of JRE on the server The system administrator verified that JRE was not currently installed on the server, so it would not be possible for that vulnerability to actually exist. Installing an unneeded version of JRE on the server could potentially open the server to actual vulnerabilities. B. Quarantine the server and scan for malware The JRE false positive isn’t an indication of malware, and there's no mention of any additional vulnerabilities or reports of malware. C. Harden the operating system of the web server Although it’s always a good best practice to harden the operating system of an externally-facing server, this vulnerability scan report doesn’t indicate any particular vulnerability with the operating system itself. If the scan identified specific OS vulnerabilities, then additional hardening may be required."},{"id":"C14","exam":"C","n":14,"type":"mc","dom":2,"obj":"2.4","objtxt":"SY0-701, Objective 2.4 - An Overview of Malware","qparts":[{"k":"p","v":"A user downloaded and installed a utility for compressing and decompressing files. Immediately after installing the utility, the user’s overall workstation performance degraded and it now takes twice as much time to perform any tasks on the computer. Which of the following is the BEST description of this malware infection?"}],"opts":[{"k":"A","t":"Ransomware"},{"k":"B","t":"Bloatware"},{"k":"C","t":"Logic bomb"},{"k":"D","t":"Trojan"}],"ans":["D"],"es":"Un troyano se disfraza de software útil (utilidad de compresión) e instala malware, degradando el rendimiento.","en":"D. Trojan A Trojan horse is malicious software that pretends to be something benign. The user will install the software with the expectation that it will perform a particular function, but in reality it is installing malware on the computer.","enw":"A. Ransomware Ransomware will lock a system and present a message to the user with instructions on how to unlock the system. This usually involves sending the attacker money in exchange for the unlock key. B. Bloatware Bloatware is delivered as numerous and often unnecessary applications which have been pre-installed to a system. C. Logic bomb A logic bomb will execute when a certain event occurs, such as a specific date and time."},{"id":"C15","exam":"C","n":15,"type":"mc","dom":3,"obj":"3.3","objtxt":"SY0-701, Objective 3.3 - Protecting Data","qparts":[{"k":"p","v":"Which of the following is the process for replacing sensitive data with a non-sensitive and functional placeholder?"}],"opts":[{"k":"A","t":"Steganography"},{"k":"B","t":"Tokenization"},{"k":"C","t":"Retention"},{"k":"D","t":"Masking"}],"ans":["B"],"es":"Tokenización: reemplaza el dato sensible por un marcador funcional (token). El enmascaramiento oculta pero el dato no sirve funcionalmente.","en":"B. Tokenization Tokenization replaces sensitive data with a token, and this token can be used as a functional placeholder for the original data. Tokenization is commonly used with credit card processing and mobile devices.","enw":"A. Steganography Steganography is a method of hiding data within another media type. For example, one common type of steganography is hiding information within a digital image. C. Retention Data retention specifies the amount of time that data should be stored or saved. Retention policies do not commonly replace sensitive data. D. Masking Data masking hides some of the original data to protect it from view. While hidden, this data cannot be used for any functional purpose."},{"id":"C16","exam":"C","n":16,"type":"mc","dom":4,"obj":"4.5","objtxt":"SY0-701, Objective 4.5 - Firewalls","qparts":[{"k":"p","v":"A security administrator has installed a new firewall to protect a web server VLAN. The application owner requires all web server sessions communicate over an encrypted channel. Which rule should the security administrator add to the firewall rulebase?"}],"opts":[{"k":"A","t":"Source: ANY, Destination: ANY, Protocol: TCP, Port: 23, Deny"},{"k":"B","t":"Source: ANY, Destination: ANY, Protocol: TCP, Port: 22, Allow"},{"k":"C","t":"Source: ANY, Destination: ANY, Protocol: TCP, Port: 80, Allow"},{"k":"D","t":"Source: ANY, Destination: ANY, Protocol: TCP, Port: 443, Allow"}],"ans":["D"],"es":"HTTPS usa TCP/443 (cifrado). El puerto 80 es HTTP sin cifrar, 22 es SSH y 23 es Telnet.","en":"D. Source: ANY, Destination: ANY, Protocol: TCP, Port: 443, Allow Most web servers use tcp/443 for HTTPS (Hypertext Transfer Protocol Secure) for encrypted web server communication This rule allows HTTPS encrypted traffic to be forwarded to the web server over tcp/443.","enw":"A. Source: ANY, Destination: ANY, Protocol: TCP, Port: 23, Deny The insecure Telnet protocol commonly uses tcp/23, but most web servers would not be listening on tcp/23. An explicit tcp/23 deny rule would not provide any additional web server security. B. Source: ANY, Destination: ANY, Protocol: TCP, Port: 22, Allow The SSH (Secure Shell) protocol uses tcp/22 to provide encrypted terminal communication, but the web server does not use SSH when communicating with client web browsers. E. Source: ANY, Destination: ANY, Protocol: TCP, Port: 80, Allow Unencrypted web communication commonly uses tcp/80. Since the application owner requires encrypted communication, allowing HTTP over tcp/80 should not be allowed through the firewall."},{"id":"C17","exam":"C","n":17,"type":"mc","dom":4,"obj":"4.6","objtxt":"SY0-701, Objective 4.6 - Multi-Factor Authentication","qparts":[{"k":"p","v":"Which of these would be used to provide multi-factor authentication?"}],"opts":[{"k":"A","t":"USB-connected storage drive with FDE"},{"k":"B","t":"Employee policy manual"},{"k":"C","t":"Just-in-time permissions"},{"k":"D","t":"Smart card with picture ID"}],"ans":["D"],"es":"Una smart card con foto suele requerir PIN: algo que tienes más algo que sabes (MFA). Las otras opciones no son un factor de autenticación.","en":"D. Smart card with picture ID A smart card commonly includes a certificate that can be used as a multifactor authentication of something you have. These smart cards are commonly combined with an employee identification card, and often require a separate PIN (Personal Identification Number) as an additional authentication factor.","enw":"A. USB-connected storage drive with FDE FDE (Full Disk Encryption) will protect the data on a drive, but it doesn’t provide a factor of authentication. B. Employee policy manual Employee policy manuals aren’t commonly associated with a specific individual, so they are not a good factor of authentication. C. Just-in-time permissions Just-in-time permissions provide a method of distributing login credentials on a temporary or as-needed basis. Just-in-time permissions may or may not include any type of multi-factor authentication."},{"id":"C18","exam":"C","n":18,"type":"mc","dom":2,"obj":"2.2","objtxt":"SY0-701, Objective 2.2 - Common Threat Vectors","qparts":[{"k":"p","v":"A company's network team has been asked to build an IPsec tunnel to a new business partner. Which of the following security risks would be the MOST important to consider?"}],"opts":[{"k":"A","t":"Supply chain attack"},{"k":"B","t":"Unsupported systems"},{"k":"C","t":"Business email compromise"},{"k":"D","t":"Typosquatting"}],"ans":["A"],"es":"Una conexión directa IPsec a un socio abre la puerta a un ataque a la cadena de suministro (supply chain), por eso es el riesgo principal.","en":"A. Supply chain attack A direct connection to a third-party creates potential access for an attacker. Most organizations will include a firewall to help monitor and protect against any supply chain attacks.","enw":"B. Unsupported systems Although unsupported systems can be a significant security concern, this question did not document any issues with outdated or legacy devices. C. Business email compromise Business email compromise uses an organization's existing email addresses as an attack destination. A business email compromise does not require an IPsec tunnel to a partner location. D. Typosquatting Typosquatting uses misspelled domain names in an effort to mislead a victim. This often takes the form of phishing emails or unauthorized website links. There are no domain name spelling issues associated with this new IPsec connection."},{"id":"C19","exam":"C","n":19,"type":"mc","dom":5,"obj":"5.1","objtxt":"SY0-701, Objective 5.1 - Data Roles and Responsibilities","qparts":[{"k":"p","v":"A company's human resources team maintains a list of all employees participating in the corporate savings plan. A third-party financial company uses this information to manage stock investments for the employees. Which of the following would describe this financial company?"}],"opts":[{"k":"A","t":"Processor"},{"k":"B","t":"Owner"},{"k":"C","t":"Controller"},{"k":"D","t":"Custodian"}],"ans":["A"],"es":"La empresa financiera de terceros procesa los datos: data processor. El controller es quien decide y gestiona (RR. HH.).","en":"A. Processor A data processor performs some type of action to the data, and this is often a different group within the organization or a third-party company. In this example, the third-party financial organization is the data processor of the employee's financial data.","enw":"B. Owner The data owner is often an executive of the company and is ultimately responsible for the use and security of this data. C. Controller A data controller manages the data. In this example, the human resources team would control the access and use of the employee data. D. Custodian A data custodian is responsible for the accuracy, privacy, and security of the data. Many organizations will hire data custodians to ensure all data is properly protected and maintained."},{"id":"C20","exam":"C","n":20,"type":"mc","dom":3,"obj":"3.1","objtxt":"SY0-701, Objective 3.1 - Other Infrastructure Concepts","qparts":[{"k":"p","v":"A technology company is manufacturing a military-grade radar tracking system designed to identify any nearby unmanned aerial vehicles (UAVs). The UAV detector must be able to instantly identify and react to a vehicle without delay. Which of the following would BEST describe this tracking system?"}],"opts":[{"k":"A","t":"RTOS"},{"k":"B","t":"IoT"},{"k":"C","t":"ICS"},{"k":"D","t":"SDN"}],"ans":["A"],"es":"Un sistema de radar que debe reaccionar al instante requiere un RTOS (Real-Time Operating System).","en":"A. RTOS This tracking system requires an RTOS (Real-Time Operating System) to instantly react to input without any significant delays or queuing in the operating system. Operating systems used by the military, automobile manufacturers, and industrial equipment companies often use RTOS to process certain transactions without any significant delays.","enw":"B. IoT IoT (Internet of Things) devices are generally associated with home automation and do not have a requirement for real-time operation. C. ICS An ICS (Industrial Control System) is often a dedicated network used exclusively to manage and control manufacturing equipment, power generation equipment, water management systems, and other industrial machines. Although some industrial control systems may use an RTOS, using a real-time operating system is not a requirement of an ICS. D. SDN An SDN (Software Defined Network) splits the functions of a network device into separate planes of operation. These logical units extend the functionality and management of a single device and provide a method of easily deploying devices in the cloud."},{"id":"C21","exam":"C","n":21,"type":"mc","dom":4,"obj":"4.7","objtxt":"SY0-701, Objective 4.7 - Scripting and Automation","qparts":[{"k":"p","v":"An administrator is writing a script to convert an email message to a help desk ticket and assign the ticket to the correct department. Which of the following should be administrator use to complete this script?"}],"opts":[{"k":"A","t":"Role-based access controls"},{"k":"B","t":"Federation"},{"k":"C","t":"Due diligence"},{"k":"D","t":"Orchestration"}],"ans":["D"],"es":"Orchestration: automatización entre sistemas, como convertir un correo en ticket y asignarlo al departamento correcto.","en":"D. Orchestration Orchestration describes the process of automation, and is commonly associated with large scale automation or automating processes between different systems.","enw":"A. Role-based access controls Role-based access control is used to associate a job function with a set of rights and permissions. The scripting described in this question does not specifically require any role-based access controls. B. Federation Federation commonly describes the process of authenticating to one system using the credentials associated with another system. The scripting process in this question would not require federation. C. Due diligence Due diligence usually involves the investigation performed on a third party prior to doing business. An internal help desk script would not require any due diligence."},{"id":"C22","exam":"C","n":22,"type":"mc","dom":4,"obj":"4.9","objtxt":"SY0-701, Objective 4.9 - Log Data","qparts":[{"k":"p","v":"A security administrator would like a report showing how many attackers are attempting to use a known vulnerability to gain access to a corporate web server. Which of the following should be used to gather this information?"}],"opts":[{"k":"A","t":"Application log"},{"k":"B","t":"Metadata"},{"k":"C","t":"IPS log"},{"k":"D","t":"Windows log"}],"ans":["C"],"es":"El log del IPS registra los intentos de explotar vulnerabilidades conocidas contra el servidor web.","en":"C. IPS log An IPS (Intrusion Prevention System) commonly uses a database of known vulnerabilities to identify and block malicious network traffic. This log of attempted exploits would provide the required report information.","enw":"A. Application log An application log provides a summary of internal application functions and procedures. An application log would not commonly identify and log security events. B. Metadata Metadata is a summary of information attached to a file or document. Metadata does not commonly store security events and would not be a valid source for this reporting data. D. Windows log The Windows Event Viewer shows the logs for the applications, security, and other aspects of the Windows operating system. An operating system log would not commonly gather information on network-based attacks."},{"id":"C23","exam":"C","n":23,"type":"mc","dom":4,"obj":"4.8","objtxt":"SY0-701, Objective 4.8 - Incident Response","qparts":[{"k":"p","v":"During a ransomware outbreak, an organization was forced to rebuild database servers from known good backup systems. In which of the following incident response phases were these database servers brought back online?"}],"opts":[{"k":"A","t":"Recovery"},{"k":"B","t":"Lessons learned"},{"k":"C","t":"Containment"},{"k":"D","t":"Detection"}],"ans":["A"],"es":"Reconstruir servidores desde respaldos limpios y ponerlos en línea es la fase de recuperación (recovery).","en":"A. Recovery The recovery phase focuses on getting things back to normal after an attack. This is the phase that removes malware, fixes vulnerabilities, and recovers the damaged systems.","enw":"B. Lessons learned Once an event is over, it’s useful to have a post-incident meeting to discuss the things that worked and things that didn’t. C. Containment When an event occurs, it’s important to minimize the impact. Isolation and containment can help to limit the spread and effect of an event. D. Detection Detecting and identifying the event is an important step that initiates the rest of the incident response processes."},{"id":"C24","exam":"C","n":24,"type":"mc","dom":2,"obj":"2.5","objtxt":"SY0-701, Objective 2.5 - Hardening Techniques","qparts":[{"k":"p","v":"A security administrator is installing a web server with a newly built operating system. Which of the following would be the best way to harden this OS?"}],"opts":[{"k":"A","t":"Create a backup schedule"},{"k":"B","t":"Install a device certificate"},{"k":"C","t":"Remove unnecessary software"},{"k":"D","t":"Disable power management features"}],"ans":["C"],"es":"Quitar software innecesario reduce la superficie de ataque del sistema operativo (hardening).","en":"C. Remove unnecessary software The process of hardening an operating system makes it more difficult to attack. In this example, the only step that would limit the attack surface is to remove any unnecessary or unused software.","enw":"A. Create a backup schedule Although a backup schedule is an important security task, the process of performing backups doesn't make the system any more resistant to a potential attack. B. Install a device certificate A device certificate can be used to verify the ownership of a remote system. However, installing a device certificate does not make the remote system more resistant to an attack. D. Disable power management features Disabling the power management features of an operating system does not generally have any impact on the overall security of the system."},{"id":"C25","exam":"C","n":25,"type":"mc","dom":2,"obj":"2.3","objtxt":"SY0-701, Objective 2.3 - SQL Injection","qparts":[{"k":"p","v":"A network IPS has created this log entry:"},{"k":"code","v":"Frame 4: 937 bytes on wire (7496 bits), 937 bytes captured\nEthernet II, Src: HewlettP_82:d8:31, Dst: Cisco_a1:b0:d1\nInternet Protocol Version 4, Src: 172.16.22.7, Dst: 10.8.122.244\nTransmission Control Protocol, Src Port: 3863, Dst Port: 1433\nApplication Data: SELECT * FROM users WHERE username='x'\nor 'x'='x' AND password='x' or 'x'='x'"},{"k":"p","v":"Which of the following would describe this log entry?"}],"opts":[{"k":"A","t":"Phishing"},{"k":"B","t":"Brute force"},{"k":"C","t":"SQL injection"},{"k":"D","t":"Cross-site scripting"}],"ans":["C"],"es":"La sentencia SELECT con 'x'='x' es una inyección SQL para evadir la autenti
