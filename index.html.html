e removal of a MAC address would simply view the remaining MAC addresses in use and spoof those addresses to gain access. C. Modify the SSID name The SSID (Service Set Identifier) is the name associated with the wireless network. The name of the access point is not a security feature, so changing the name would not provide any additional access control. D. Modify the channel frequencies The frequencies used by the access point are chosen to minimize interference with other nearby wireless devices. These wireless channels are not security features and changing the frequency would not limit unauthorized access."},{"id":"C79","exam":"C","n":79,"type":"mc","dom":1,"obj":"1.3","objtxt":"SY0-701, Objective 1.3 - Technical Change Management","qparts":[{"k":"p","v":"A system administrator has been tasked with performing an application upgrade, but the upgrade has been delayed due to a different scheduled installation of an outdated device driver. Which of the following issues would best describe this change management delay?"}],"opts":[{"k":"A","t":"Deny list"},{"k":"B","t":"Legacy application"},{"k":"C","t":"Dependency"},{"k":"D","t":"Restricted activity"}],"ans":["C"],"es":"Dependencia: la actualización de la aplicación depende de otro cambio previo, el driver.","en":"C. Dependency Modifying one part of a system may first require changes to other components. In this example, the application upgrade is dependent on an updated version of a device driver.","enw":"A. Deny list A deny list would prevent an application from executing. In this question, an older version of the application is currently working, and there's no mention of preventing a newer version of the application from also working properly. B. Legacy application A legacy application is usually not supported by the developer, and it would be unusual for a legacy application to release an updated version of software. D. Restricted activity Most change control processes have a limited scope, and a technician would be restricted from making changes outside of that scope. In this example, the device driver and the application are both part of the change control process, but one of the changes must occur before the other change can be made."},{"id":"C80","exam":"C","n":80,"type":"mc","dom":3,"obj":"3.2","objtxt":"SY0-701, Objective 3.2 - Port Security","qparts":[{"k":"p","v":"During an initial network connection, a supplicant communicates to an authenticator, which then sends an authentication request to an Active Directory database. Which of the following would BEST describe this authentication technology?"}],"opts":[{"k":"A","t":"Federation"},{"k":"B","t":"UTM"},{"k":"C","t":"802.1X"},{"k":"D","t":"PKI"}],"ans":["C"],"es":"802.1X: suplicante, autenticador y servidor de autenticación (como Active Directory).","en":"C. 802.1X IEEE 802.1X is a standard for port-based network access control (NAC). When 802.1X is enabled, devices connecting to the network do not gain access until they provide the correct authentication credentials. This 802.1X standard refers to the client as the supplicant, the switch is commonly configured as the authenticator, and the back-end authentication server is often a centralized user database.","enw":"A. Federation Federation would allow members of one organization to authenticate to the network of another organization using their normal credentials. B. UTM A UTM (Unified Threat Management) system is a legacy all-in-one security device which combines a firewall, anti-virus, content filtering, and other security features into a single system. D. PKI PKI (Public Key Infrastructure) is a method of describing the public-key encryption technologies and its supporting policies and procedures. PKI does not require the use of supplicants, authenticators, or authentication servers."},{"id":"C81","exam":"C","n":81,"type":"mc","dom":2,"obj":"2.3","objtxt":"SY0-701, Objective 2.3 - Hardware Vulnerabilities","qparts":[{"k":"p","v":"A security researcher has been notified of a potential hardware vulnerability. Which of the following should the researcher evaluate as a potential security issue?"}],"opts":[{"k":"A","t":"Firmware versions"},{"k":"B","t":"Firewall configuration"},{"k":"C","t":"SQL requests"},{"k":"D","t":"XSS attachments"}],"ans":["A"],"es":"Las vulnerabilidades de hardware se resuelven con firmware. Las otras opciones son de software.","en":"A. Firmware versions Firmware describes the software inside of a hardware device and is often used as the operating system of the hardware. Issues with hardware vulnerabilities are usually resolved by updating firmware in the vulnerable system.","enw":"B. Firewall configuration Misconfigured firewall software could certainly be a security issue, but the problem reported in this question is specific to a hardware vulnerability. C. SQL requests A SQL (Structured Query Language) request is commonly associated with a database-related process. SQL requests are software-related and are not related to a hardware vulnerability. D. XSS attachments XSS (Cross-site Scripting) is an exploit which uses the trust in a browser to gain access to a web site. An XSS attachment describes a malicious script included in an email or similar delivery mechanism. Cross-site scripting is a software exploit and is not associated with a hardware vulnerability."},{"id":"C82","exam":"C","n":82,"type":"mc","dom":1,"obj":"1.2","objtxt":"SY0-701, Objective 1.2 - Physical Security","qparts":[{"k":"p","v":"Visitors to a corporate data center must enter through the main doors of the building. Which of the following security controls would be the BEST choice to successfully guide people to the front door? (Select TWO)"}],"opts":[{"k":"A","t":"Infrared sensors"},{"k":"B","t":"Bollards"},{"k":"C","t":"Biometrics"},{"k":"D","t":"Fencing"},{"k":"E","t":"Access badges"},{"k":"F","t":"Video surveillance"}],"ans":["B","D"],"es":"Bolardos y cercas canalizan físicamente a las personas hacia la entrada principal.","en":"B. Bollards and D. Fencing Both bollards and fencing provide physical security controls to direct people to an area by limiting their access to other areas.","enw":"A. Infrared sensors Infrared sensors are able to detect infrared radiation in both dark and light environments. Infrared sensors are often included with surveillance video systems, but they wouldn't be used to direct individuals to the main doors of a building. C. Biometrics Biometrics provide a unique authentication factor, but they aren't commonly used to direct people to a particular building entrance. E. Access Badges Access badges are often used as both identification and access cards to secure areas of a facility. An access badge would not direct individuals to the main doors of a building. F. Video surveillance Video surveillance would make it easy to monitor and view visitors approaching the building, but it would not provide any directions to the front doors."},{"id":"C83","exam":"C","n":83,"type":"mc","dom":4,"obj":"4.6","objtxt":"SY0-701, Objective 4.6 - Identity and Access Management","qparts":[{"k":"p","v":"A company's employees are required to authenticate each time a file share, printer, or SAN imaging system is accessed. Which of the following should be used to minimize the number of employee authentication requests?"}],"opts":[{"k":"A","t":"SSO"},{"k":"B","t":"OSINT"},{"k":"C","t":"MFA"},{"k":"D","t":"SCAP"}],"ans":["A"],"es":"SSO (Single Sign-On): una sola autenticación para acceder a varios recursos.","en":"A. SSO SSO (Single Sign-On) accepts valid authentication requests and allows users to access multiple resources without requiring additional user authentications.","enw":"B. OSINT OSINT (Open Source Intelligence) is information gathered from publicly available sources such as social media sites, online forums, and other data sources. OSINT is not associated with user authentication. C. MFA MFA (Multi-factor authentication) is used to provide additional proof of a user's identity during the authentication process. MFA is not used to minimize the number of authentication requests required by a system. D. SCAP SCAP (Security Content Automation Protocol) is a standard method used by security tools to identify and act on the same criteria. SCAP is not used to minimize the number of required authentications."},{"id":"C84","exam":"C","n":84,"type":"mc","dom":5,"obj":"5.5","objtxt":"SY0-701, Objective 5.5 - Audits and Assessments","qparts":[{"k":"p","v":"A company has recently moved from one accounting system to another, and the new system includes integration with many other divisions of the organization. Which of the following would ensure that the correct access has been provided to the proper employees in each division?"}],"opts":[{"k":"A","t":"Geolocation"},{"k":"B","t":"Onboarding process"},{"k":"C","t":"Account de-provisioning"},{"k":"D","t":"Internal self-assessment"}],"ans":["D"],"es":"Una autoevaluación interna con auditoría verifica que cada empleado tenga los permisos correctos.","en":"D. Internal self-assessment An internal self-assessment with audit can verify users have the correct permissions and all users meet the practice of least privilege.","enw":"A. Geolocation Geolocation would allow the system to assign rights and permissions based on physical location. In this question, there's no documentation on where users are located and how those locations could be used for access control. B. Onboarding process The onboarding process is used when a new person is hired or transferred into the organization. In this example, none of the users were identified as new employees. C. Account de-provisioning Account de-provisioning is the disabling of an account and archiving of user information. This process usually occurs when an employee has left the organization."},{"id":"C85","exam":"C","n":85,"type":"mc","dom":2,"obj":"2.3","objtxt":"SY0-701, Objective 2.3 - SQL Injection","qparts":[{"k":"p","v":"An attacker has circumvented a web-based application to send commands directly to a database. Which of the following would describe this attack type?"}],"opts":[{"k":"A","t":"Downgrade"},{"k":"B","t":"SQL injection"},{"k":"C","t":"Cross-site scripting"},{"k":"D","t":"On-path"}],"ans":["B"],"es":"Enviar comandos directamente a la base de datos desde una aplicación web es SQL injection.","en":"B. SQL injection A SQL (Structured Query Language) injection takes advantage of poorly written web applications. These web applications do not properly restrict the user input, and the resulting attack bypasses the application and “injects” SQL commands directly into the database itself.","enw":"A. Downgrade A downgrade attack commonly takes advantage of a poorly implemented cryptographic functions to force an application to use sub-optimal or non\u0002existent security features. C. Cross-site scripting A cross-site scripting attack commonly uses scripts to execute commands on a third-party website. These types of attacks take advantage of the trust of a local browser, but they don’t commonly have direct access to a database. D. On-path An on-path attack is often used to capture, monitor, or inject information into an existing data flow. An on-path attack is not commonly used for SQL injection attacks."},{"id":"C86","exam":"C","n":86,"type":"mc","dom":1,"obj":"1.4","objtxt":"SY0-601, Objective 1.4 - Blockchain Technology","qparts":[{"k":"p","v":"A group of business partners is using blockchain technology to monitor and track raw materials and parts as they are transferred between companies. Where would a partner find these tracking details?"}],"opts":[{"k":"A","t":"Ledger"},{"k":"B","t":"HSM"},{"k":"C","t":"SIEM"},{"k":"D","t":"HIPS"}],"ans":["A"],"es":"El ledger (libro mayor) de la blockchain contiene todas las transacciones compartidas.","en":"A. Ledger The ledger is a shared document with a list of all blockchain transactions. The ledger is shared among everyone in the blockchain, and all transactions are available to view on this central ledger.","enw":"B. HSM An HSM (Hardware Security Module) provides secure key storage and cryptographic functions for servers and applications. An HSM does not provide tracking services. C. SIEM A SIEM (Security Information and Event Manager) is commonly used to consolidate log files and create reports. A SIEM is not used to monitor blockchain transactions. D. HIPS A HIPS (Host-based Intrusion Prevention System) is used to identify exploit attempts on a device. A host-based IPS is not used to monitor data in a blockchain."},{"id":"C87","exam":"C","n":87,"type":"mc","dom":2,"obj":"2.4","objtxt":"SY0-701, Objective 2.4 - DNS Attacks","qparts":[{"k":"p","v":"A network technician at a bank has noticed a significant decrease in traffic to the bank's public website. After additional investigation, the technician finds that users are being directed to a web site which looks similar to the bank's site but is not under the bank's control. Flushing the local DNS cache and changing the DNS entry does not have any effect. Which of the following has most likely occurred?"}],"opts":[{"k":"A","t":"DDoS"},{"k":"B","t":"Disassociation attack"},{"k":"C","t":"Buffer overflow"},{"k":"D","t":"Domain hijacking"}],"ans":["D"],"es":"Domain hijacking: se cambió el DNS del dominio y limpiar la caché local no sirve.","en":"D. Domain hijacking Domain hijacking will modify the primary DNS (Domain Name System) settings for a domain and allow an attacker to direct users to an IP address controlled by the attacker.","enw":"A. DDoS A DDoS (Distributed Denial of Service) would prevent users from accessing a service. In this example, users were accessing an unauthorized service. B. Disassociation attack A disassociation attack is a wireless vulnerability which can remove devices from a wireless network. C. Buffer overflow A buffer overflow is an application attack where an input of data can overwrite a buffer of memory space. A buffer overflow would not be used to redirect users to a different web page."},{"id":"C88","exam":"C","n":88,"type":"mc","dom":3,"obj":"3.1","objtxt":"SY0-701, Objective 3.1 - Network Infrastructure Concepts","qparts":[{"k":"p","v":"A company runs two separate applications in their data center. The security administrator has been tasked with preventing all communication between these applications. Which of the following would be the BEST way to implement this security requirement?"}],"opts":[{"k":"A","t":"Firewall"},{"k":"B","t":"SDN"},{"k":"C","t":"Air gap"},{"k":"D","t":"VLANs"}],"ans":["C"],"es":"Air gap: separación física para aplicaciones que nunca deben comunicarse, más seguro que VLAN o firewall.","en":"C. Air gap An air gap is a physical separation between networks. Air gapped networks are commonly used to separate networks that must never communicate to each other.","enw":"A. Firewall A firewall would provide a method of filtering traffic between networks, but firewalls can often be misconfigured and inadvertently allow some traffic to pass. Although this is one option, it’s not the best option given the option of an air gap. B. SDN SDN (Software Defined Networking) splits the functions of a networking device into separate logical units. SDN does not describe a security filter or firewall between applications in a data center. D. VLANs A VLAN (Virtual Local Area Network) is a logical method of segmenting traffic within network switches. Although this segmentation is effective, it’s not as secure as an air gap."},{"id":"C89","exam":"C","n":89,"type":"mc","dom":5,"obj":"5.6","objtxt":"SY0-701, Objective 5.6 - User Training","qparts":[{"k":"p","v":"A receptionist at a manufacturing company recently received an email from the CEO asking for a copy of the internal corporate employee directory. It was later determined that the email address was not sent from the CEO and the domain associated with the email address was not a corporate domain name. What type of training could help identify this type of attack in the future?"}],"opts":[{"k":"A","t":"Recognizing social engineering"},{"k":"B","t":"Proper password management"},{"k":"C","t":"Securing remote work environments"},{"k":"D","t":"Understanding insider threats"}],"ans":["A"],"es":"Suplantar al CEO es ingeniería social; la capacitación para reconocerla ayuda a detectarlo.","en":"A. Recognizing social engineering Impersonating the CEO is a common social engineering technique. There are many ways to recognize a social engineering attack, and it’s important to train everyone to spot these situations when they are occurring.","enw":"B. Proper password management Proper password management focuses on protecting passwords through the use of standard policies. These policies focus on topics such as password length, complexity, or password reuse. C. Securing remote work environments A remote work environment is very different to secure than a traditional work environment, but those concerns would not help to identify this type of social engineering attack. D. Understanding insider threats Although the attacker wasn’t identified, we could assume that an employee would already have access to the internal corporate employee directory."},{"id":"C90","exam":"C","n":90,"type":"mc","dom":4,"obj":"4.1","objtxt":"SY0-701, Objective 4.1 - Securing Wireless and Mobile","qparts":[{"k":"p","v":"Which of the following deployment models would a company follow if they require individuals to use their personal phones for work purposes?"}],"opts":[{"k":"A","t":"CYOD"},{"k":"B","t":"MDM"},{"k":"C","t":"BYOD"},{"k":"D","t":"COPE"}],"ans":["C"],"es":"BYOD (Bring Your Own Device): el empleado usa su propio teléfono para trabajar.","en":"C. BYOD BYOD (Bring Your Own Device) is a model where the employee owns the mobile device but can also use the same device for work.","enw":"A. CYOD The CYOD (Choose Your Own Device) model requires the corporation to purchase and own the device, but the user can select the device they would prefer to use. B. MDM An MDM (Mobile Device Manager) is used to manage company-owned and user-owned mobile devices. D. COPE COPE (Corporately Owned, Personally Enabled) devices are purchased by the company and deployed to the users. The organization keeps full control of the device and may allow the recipient to use the device for both business and personal use."}];
</script>
<script>
(function(){
'use strict';
var DOMS={1:['Conceptos generales','12%'],2:['Amenazas y mitigaciones','22%'],3:['Arquitectura','18%'],4:['Operaciones','28%'],5:['Gestión y supervisión','20%']};
var EXAMS={A:'Examen A',B:'Examen B',C:'Examen C'};
var LS={get:function(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
var prog=LS.get('s701.prog',{});
var S={exam:'ALL',dom:0,st:'all',type:'all',q:'',shuffle:false,cur:LS.get('s701.cur',null),revealed:false,sel:[],pbq:{},checked:false,confirmReset:false};
var rank={};
function doShuffle(){var a=DATA.map(function(x){return x.id});for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}rank={};a.forEach(function(id,i){rank[id]=i})}
doShuffle();
var byId={};DATA.forEach(function(x){byId[x.id]=x});

function $(s,r){return (r||document).querySelector(s)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function flat(x){
  if(x.type==='pbq') return x.prompt+' '+x.items.map(function(i){return i.t}).join(' ');
  return x.qparts.map(function(p){return typeof p.v==='string'?p.v:p.v.join(' ')}).join(' ')+' '+x.opts.map(function(o){return o.t}).join(' ');
}
function list(){
  var q=S.q.trim().toLowerCase();
  var out=DATA.filter(function(x){
    if(S.exam!=='ALL'&&x.exam!==S.exam) return false;
    if(S.dom&&x.dom!==S.dom) return false;
    if(S.type==='mc'&&x.type!=='mc') return false;
    if(S.type==='pbq'&&x.type!=='pbq') return false;
    var st=prog[x.id]||'';
    if(S.st==='none'&&st) return false;
    if(S.st==='r'&&st!=='r') return false;
    if(S.st==='k'&&st!=='k') return false;
    if(q){ if(x.id.toLowerCase()===q) return true; if((flat(x)+' '+x.es).toLowerCase().indexOf(q)<0) return false; }
    return true;
  });
  if(S.shuffle) out.sort(function(a,b){return rank[a.id]-rank[b.id]});
  return out;
}
function curIndex(L){
  if(!L.length) return -1;
  var i=L.findIndex(function(x){return x.id===S.cur});
  if(i<0){i=0;S.cur=L[0].id;resetCard()}
  return i;
}
function resetCard(){S.revealed=false;S.sel=[];S.checked=false}
function go(id){S.cur=id;LS.set('s701.cur',id);resetCard();renderAll('#revealBtn')}

/* ---------- static filter markup ---------- */
function segBtns(el,items,key){
  el.innerHTML=items.map(function(it){return '<button class="chip" data-k="'+key+'" data-v="'+it[0]+'" aria-pressed="false">'+esc(it[1])+'</button>'}).join('');
}
segBtns($('#fExam'),[['ALL','Todos'],['A','A'],['B','B'],['C','C']],'exam');
segBtns($('#fStatus'),[['all','Todas'],['none','Sin marcar'],['r','Por repasar'],['k','Dominadas']],'st');
segBtns($('#fType'),[['all','Todas'],['mc','Opción múltiple'],['pbq','PBQ']],'type');
(function(){var h='<button class="chip" data-k="dom" data-v="0" aria-pressed="false">Todos los dominios</button>';
  for(var d=1;d<=5;d++) h+='<button class="chip" data-k="dom" data-v="'+d+'" aria-pressed="false"><span>'+d+'. '+esc(DOMS[d][0])+'</span><small>'+DOMS[d][1]+'</small></button>';
  $('#fDom').innerHTML=h})();

function syncFilters(){
  document.querySelectorAll('.chip[data-k]').forEach(function(b){
    var k=b.getAttribute('data-k'),v=b.getAttribute('data-v');
    var on=(k==='dom')?String(S.dom)===v:String(S[k])===v;
    b.setAttribute('aria-pressed',on?'true':'false');
  });
  $('#search').value=S.q;$('#shuffle').checked=S.shuffle;$('#reshuffle').hidden=!S.shuffle;
}

/* ---------- summary & nav ---------- */
function renderSum(){
  var k=0,r=0;DATA.forEach(function(x){var s=prog[x.id];if(s==='k')k++;else if(s==='r')r++});
  var n=DATA.length;
  $('#sum').innerHTML='<div class="sum-row"><span><b>'+k+'</b> dominadas de '+n+'</span><span><b>'+r+'</b> por repasar</span><span><b>'+(n-k-r)+'</b> sin marcar</span></div>'+
   '<div class="bar" role="img" aria-label="'+k+' dominadas, '+r+' por repasar, '+(n-k-r)+' sin marcar"><i class="k" style="width:'+(k/n*100)+'%"></i><i class="r" style="width:'+(r/n*100)+'%"></i></div>';
}
function renderNav(L){
  $('#navcount').textContent=L.length+' preguntas';
  $('#nav').innerHTML=L.map(function(x){
    var s=prog[x.id]||'';
    return '<button class="cell '+s+'" data-go="'+x.id+'"'+(x.id===S.cur?' aria-current="true"':'')+' title="'+x.id+(s==='k'?' · dominada':s==='r'?' · por repasar':'')+'">'+x.id+'</button>';
  }).join('');
  var c=$('#nav [aria-current="true"]');
  if(c&&c.scrollIntoView){var g=$('#nav');var t=c.offsetTop-g.offsetTop-g.clientHeight/2;g.scrollTop=Math.max(0,t)}
}
function renderReset(){
  $('#resetBox').innerHTML=S.confirmReset
   ?'<span style="font-size:13px">¿Borrar todas tus marcas?</span> <button class="linkbtn" id="resetYes">Sí, borrar</button> · <button class="linkbtn" id="resetNo">Cancelar</button>'
   :'<button class="linkbtn" id="resetAsk">Reiniciar mi progreso</button>';
}

/* ---------- card ---------- */
function qHtml(parts){
  return '<div class="qtext">'+parts.map(function(p){
    if(p.k==='p') return '<p>'+esc(p.v)+'</p>';
    if(p.k==='ul') return '<ul>'+p.v.map(function(i){return '<li>'+esc(i)+'</li>'}).join('')+'</ul>';
    return '<pre class="code">'+esc(p.v)+'</pre>';
  }).join('')+'</div>';
}
function metaHtml(x){
  var d=x.dom;
  return '<div class="meta"><span class="idchip">'+x.id+'</span><span>'+EXAMS[x.exam]+' · pregunta '+x.n+'</span>'+
   (x.type==='pbq'?'<span class="tag pbq">PBQ</span>':'')+
   '<span class="tag">Dominio '+d+' · '+esc(DOMS[d][0])+'</span>'+
   (x.type==='mc'?'<span class="tag">Obj. '+x.obj+'</span>':'')+'</div>';
}
function markHtml(x){
  var s=prog[x.id]||'';
  return '<div class="marks"><span class="lbl">Tras ver la respuesta:</span>'+
   '<button class="btn mark k" data-mark="k" aria-pressed="'+(s==='k')+'">Ya la domino</button>'+
   '<button class="btn mark r" data-mark="r" aria-pressed="'+(s==='r')+'">Repasar después</button></div>';
}
function pagerHtml(L,i){
  return '<div class="pager"><button class="btn" data-nav="-1"'+(i<=0?' disabled':'')+'>← Anterior</button>'+
   '<span class="pos">'+(i+1)+' de '+L.length+'</span>'+
   '<button class="btn" data-nav="1"'+(i>=L.length-1?' disabled':'')+'>Siguiente →</button></div>'+
   '<p class="keys">Atajos: <kbd>←</kbd> <kbd>→</kbd> moverse · <kbd>Espacio</kbd> revelar · <kbd>K</kbd> dominada · <kbd>R</kbd> repasar</p>';
}
function mcHtml(x,L,i){
  var multi=x.ans.length>1;
  var h='<article class="card">'+metaHtml(x)+qHtml(x.qparts);
  if(multi) h+='<p class="hint">Elige '+x.ans.length+' respuestas.</p>';
  h+='<div class="opts" role="group" aria-label="Opciones">';
  x.opts.forEach(function(o){
    var sel=S.sel.indexOf(o.k)>=0, isA=x.ans.indexOf(o.k)>=0, cls='opt', lab='';
    if(S.revealed){
      if(isA&&sel){cls+=' ok';lab='✓ Correcta'}
      else if(isA){cls+=' miss';lab='Era correcta'}
      else if(sel){cls+=' bad';lab='✗ Tu elección'}
    }
    h+='<button class="'+cls+'" data-opt="'+o.k+'" aria-pressed="'+sel+'"'+(S.revealed?' disabled':'')+'><span class="key">'+o.k+'</span><span class="tx">'+esc(o.t)+'</span><span class="lab">'+lab+'</span></button>';
  });
  h+='</div><div class="actions"><button class="btn primary" id="revealBtn" aria-expanded="'+S.revealed+'">'+(S.revealed?'Ocultar respuesta':'Revelar respuesta')+'</button></div>';
  if(S.revealed){
    var got=S.sel.length&&S.sel.slice().sort().join()===x.ans.slice().sort().join();
    if(S.sel.length) h+='<div class="result '+(got?'good':'nope')+'" role="status">'+(got?'Acertaste.':'No coincide con tu elección.')+' Respuesta correcta: '+x.ans.join(', ')+'</div>';
    else h+='<div class="result good" role="status">Respuesta correcta: '+x.ans.join(', ')+'</div>';
    h+='<div class="expl"><h3>Por qué</h3><p>'+esc(x.es)+'</p>'+
      '<details class="en"><summary>Ver la explicación original en inglés</summary><div><h4>Respuesta correcta</h4><p>'+esc(x.en)+'</p><h4>Respuestas incorrectas</h4><p>'+esc(x.enw)+'</p><h4>Referencia</h4><p>'+esc(x.objtxt)+'</p></div></details></div>'+markHtml(x);
  }
  return h+pagerHtml(L,i)+'</article>';
}
function pbqSel(x){return S.pbq[x.id]||(S.pbq[x.id]={})}
function tableHtml(x,masked){
  var e=x.extra;
  var h='<div class="tablewrap"><table><thead><tr>'+e.head.map(function(c){return '<th>'+esc(c)+'</th>'}).join('')+'</tr></thead><tbody>';
  e.rows.forEach(function(r){
    h+='<tr>'+r.map(function(c,ci){return (masked&&ci>0)?'<td class="mask">?</td>':'<td>'+esc(c)+'</td>'}).join('')+'</tr>';
  });
  return h+'</tbody></table></div>';
}
function pbqHtml(x,L,i){
  var h='<article class="card">'+metaHtml(x)+'<div class="qtext"><p>'+esc(x.prompt)+'</p></div>';
  if(x.mode==='table'){
    h+=tableHtml(x,!S.revealed);
    h+='<div class="actions"><button class="btn primary" id="revealBtn" aria-expanded="'+S.revealed+'">'+(S.revealed?'Ocultar respuesta':'Revelar respuesta')+'</button></div>';
    if(S.revealed) h+='<div class="expl"><h3>Por qué</h3><ul class="notes">'+x.extra.notes.map(function(n){return '<li>'+esc(n)+'</li>'}).join('')+'</ul><p>'+esc(x.es)+'</p></div>'+markHtml(x);
    return h+pagerHtml(L,i)+'</article>';
  }
  if(x.extra){ h+='<p class="hint">Reglas del firewall:</p>'+tableHtml(x,false); }
  var sel=pbqSel(x);
  h+='<p class="hint">Elige una opción para cada elemento y pulsa Comprobar, o revela todo directamente.</p><div class="rows">';
  x.items.forEach(function(it,ix){
    var v=sel[ix]||'',cls='row',ok=(v===it.a);
    if(S.revealed){cls+=' ok'}
    else if(S.checked&&v){cls+=ok?' ok':' bad'}
    h+='<div class="'+cls+'"><div class="rt">'+esc(it.t)+'</div>';
    if(S.revealed) h+='<div class="ans">→ '+esc(it.a)+'</div><div class="why">'+esc(it.w)+'</div>';
    else{
      h+='<select data-sel="'+ix+'" aria-label="Elección para: '+esc(it.t)+'"><option value="">Elegir…</option>'+
        x.choices.map(function(c){return '<option value="'+esc(c)+'"'+(v===c?' selected':'')+'>'+esc(c)+'</option>'}).join('')+'</select>';
      if(S.checked&&v) h+='<div class="why">'+(ok?'✓ Correcto. '+esc(it.w):'✗ No coincide. Prueba otra opción.')+'</div>';
    }
    h+='</div>';
  });
  h+='</div><div class="actions">';
  if(!S.revealed) h+='<button class="btn" id="checkBtn">Comprobar</button>';
  h+='<button class="btn primary" id="revealBtn" aria-expanded="'+S.revealed+'">'+(S.revealed?'Ocultar respuestas':'Revelar respuestas')+'</button></div>';
  if(S.revealed) h+='<div class="expl"><h3>Resumen</h3><p>'+esc(x.es)+'</p></div>'+markHtml(x);
  return h+pagerHtml(L,i)+'</article>';
}
function renderCard(focusSel){
  var L=list(),i=curIndex(L),m=$('#main');
  if(i<0){ m.innerHTML='<div class="empty"><p>Ninguna pregunta coincide con estos filtros.</p><button class="btn" id="clearF">Quitar filtros</button></div>'; return; }
  var x=L[i];
  m.innerHTML=(x.type==='pbq')?pbqHtml(x,L,i):mcHtml(x,L,i);
  if(focusSel){var f=$(focusSel);if(f&&f.focus)f.focus({preventScroll:true})}
}
function renderAll(focusSel){
  var L=list();curIndex(L);
  syncFilters();renderSum();renderNav(L);renderReset();renderCard(focusSel);
}

/* ---------- events ---------- */
function step(d){var L=list(),i=curIndex(L);if(i<0)return;var n=i+d;if(n<0||n>=L.length)return;go(L[n].id)}
function toggleReveal(){S.revealed=!S.revealed;renderCard('#revealBtn')}
function mark(v){
  var L=list(),i=curIndex(L);if(i<0)return;var id=L[i].id;
  if(prog[id]===v) delete prog[id]; else prog[id]=v;
  LS.set('s701.prog',prog);
  renderSum();renderNav(L);
  document.querySelectorAll('.btn.mark').forEach(function(b){b.setAttribute('aria-pressed',String(prog[id]===b.getAttribute('data-mark')))});
}
document.addEventListener('click',function(e){
  var t=e.target.closest('button');if(!t)return;
  if(t.id==='railToggle'){var r=$('#rail');var o=r.classList.toggle('open');t.setAttribute('aria-expanded',String(o));return}
  if(t.hasAttribute('data-k')){
    var k=t.getAttribute('data-k'),v=t.getAttribute('data-v');
    S[k]=(k==='dom')?Number(v):v;
    renderAll();return;
  }
  if(t.hasAttribute('data-go')){go(t.getAttribute('data-go'));var mm=$('#main');if(window.innerWidth<=900&&mm&&mm.scrollIntoView)mm.scrollIntoView({block:'start'});return}
  if(t.hasAttribute('data-nav')){step(Number(t.getAttribute('data-nav')));return}
  if(t.id==='revealBtn'){toggleReveal();return}
  if(t.hasAttribute('data-mark')){mark(t.getAttribute('data-mark'));return}
  if(t.hasAttribute('data-opt')){
    var L=list(),x=L[curIndex(L)],key=t.getAttribute('data-opt');
    if(x.ans.length===1) S.sel=[key];
    else{var p=S.sel.indexOf(key);if(p>=0)S.sel.splice(p,1);else{S.sel.push(key);if(S.sel.length>x.ans.length)S.sel.shift()}}
    renderCard('[data-opt="'+key+'"]');return;
  }
  if(t.id==='checkBtn'){S.checked=true;renderCard('#checkBtn');return}
  if(t.id==='clearF'){S.exam='ALL';S.dom=0;S.st='all';S.type='all';S.q='';renderAll();return}
  if(t.id==='resetAsk'){S.confirmReset=true;renderReset();return}
  if(t.id==='resetNo'){S.confirmReset=false;renderReset();return}
  if(t.id==='resetYes'){prog={};LS.set('s701.prog',prog);S.confirmReset=false;renderAll();return}
  if(t.id==='reshuffle'){doShuffle();renderAll();return}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='shuffle'){S.shuffle=t.checked;renderAll();return}
  if(t.hasAttribute&&t.hasAttribute('data-sel')){
    var L=list(),x=L[curIndex(L)];pbqSel(x)[t.getAttribute('data-sel')]=t.value;S.checked=false;
    var row=t.closest('.row');if(row){row.classList.remove('ok','bad');var w=$('.why',row);if(w)w.remove()}
  }
});
$('#search').addEventListener('input',function(e){S.q=e.target.value;var L=list();if(L.length&&!L.some(function(x){return x.id===S.cur})){S.cur=L[0].id;resetCard()}
  syncFilters();renderNav(L);renderCard();});
document.addEventListener('keydown',function(e){
  var tg=e.target,tag=tg&&tg.tagName;
  if(tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA') return;
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  if(e.key==='ArrowRight'){step(1)}
  else if(e.key==='ArrowLeft'){step(-1)}
  else if((e.key===' '||e.key==='Enter')&&tag!=='BUTTON'&&tag!=='SUMMARY'&&tag!=='A'){e.preventDefault();toggleReveal()}
  else if(e.key==='k'||e.key==='K'){if(S.revealed)mark('k')}
  else if(e.key==='r'||e.key==='R'){if(S.revealed)mark('r')}
});
/* rail open on desktop */
var mq=window.matchMedia('(min-width:901px)');
function railSync(){ $('#railToggle').setAttribute('aria-expanded',String($('#rail').classList.contains('open'))) }
railSync();
if(!DATA.some(function(x){return x.id===S.cur})) S.cur=null;
renderAll();
})();
</script>

</body></html>
