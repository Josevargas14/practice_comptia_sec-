<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Estudio Security+ SY0-701</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a rail with filters and a question map on the left, one study card on the right.
   Palette: cool paper grey biased toward petrol teal, deep ink, one teal accent; green / amber / red only for state. */
:root{
  --bg:#ECF1F3;
  --surface:#FFFFFF;
  --surface-2:#F4F7F8;
  --ink:#13232B;
  --muted:#586B75;
  --line:#D2DBE0;
  --accent:#0A6576;
  --accent-ink:#FFFFFF;
  --accent-soft:#DCEEF2;
  --ok:#1B6F45;
  --ok-bg:#E2F3E9;
  --bad:#AE3229;
  --bad-bg:#FBE8E5;
  --warn:#8A5A00;
  --warn-bg:#FBF0D6;
  --code-bg:#E4EBEE;
  --focus:#0A6576;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D171C;--surface:#15232B;--surface-2:#1B2C35;--ink:#E5EEF1;--muted:#94A8B2;--line:#2A3C46;
    --accent:#52C3D6;--accent-ink:#06222A;--accent-soft:#17353E;
    --ok:#6FD19A;--ok-bg:#15352A;--bad:#F08A80;--bad-bg:#3B1F1D;--warn:#E8B75A;--warn-bg:#382C12;
    --code-bg:#0A1317;--focus:#52C3D6;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D171C;--surface:#15232B;--surface-2:#1B2C35;--ink:#E5EEF1;--muted:#94A8B2;--line:#2A3C46;
  --accent:#52C3D6;--accent-ink:#06222A;--accent-soft:#17353E;
  --ok:#6FD19A;--ok-bg:#15352A;--bad:#F08A80;--bad-bg:#3B1F1D;--warn:#E8B75A;--warn-bg:#382C12;
  --code-bg:#0A1317;--focus:#52C3D6;color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.app{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:22px 56px}

/* header */
.top{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(28px,5vw,40px);line-height:1.05;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);margin:6px 0 0;max-width:52ch}
.sum{min-width:min(100%,300px);flex:1 1 300px;max-width:420px}
.sum-row{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted);margin-bottom:6px;flex-wrap:wrap}
.sum-row b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.bar{display:flex;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%}
.bar .k{background:var(--ok)}
.bar .r{background:var(--warn)}

/* layout */
.layout{display:grid;grid-template-columns:320px minmax(0,1fr);gap:24px;align-items:start}
.rail{position:sticky;top:16px;display:flex;flex-direction:column;gap:18px;max-height:calc(100vh - 32px);overflow:auto;padding-right:4px;min-width:0}
.rail-toggle{display:none}
.fgroup{display:flex;flex-direction:column;gap:8px;min-width:0}
.flabel{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:5px 10px;font-size:13px;line-height:1.3;text-align:left}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip small{font-family:var(--f-mono);font-size:11px;opacity:.75;margin-left:4px}
.doms{display:flex;flex-direction:column;gap:6px}
.doms .chip{display:flex;justify-content:space-between;gap:8px;width:100%}
input[type=search]{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 10px}
.check{display:flex;gap:8px;align-items:center;font-size:13px}
.linkbtn{background:none;border:none;color:var(--accent);padding:0;text-decoration:underline;text-underline-offset:3px;font-size:13px}
.navhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:4px;max-height:280px;overflow:auto;padding:2px}
.cell{font-family:var(--f-mono);font-size:11px;padding:6px 0;border:1px solid var(--line);background:var(--surface);border-radius:4px;text-align:center;font-variant-numeric:tabular-nums}
.cell.k{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.cell.r{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.cell[aria-current="true"]{outline:2px solid var(--accent);outline-offset:1px;font-weight:600}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;border:1px solid var(--line);background:var(--surface)}
.legend .lk::before{background:var(--ok-bg);border-color:var(--ok)}
.legend .lr::before{background:var(--warn-bg);border-color:var(--warn)}

/* card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:22px;min-width:0}
.meta{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:16px;font-size:13px;color:var(--muted)}
.idchip{font-family:var(--f-display);font-weight:700;font-size:22px;color:var(--ink);letter-spacing:-.01em;margin-right:4px}
.tag{font-family:var(--f-mono);font-size:11px;letter-spacing:.04em;border:1px solid var(--line);border-radius:4px;padding:2px 7px;background:var(--surface-2);color:var(--muted)}
.tag.pbq{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.qtext{font-size:17px;line-height:1.55;max-width:70ch}
.qtext p{margin:0 0 12px}
.qtext ul{margin:0 0 12px;padding-left:20px}
.qtext li{margin-bottom:4px}
pre.code{font-family:var(--f-mono);font-size:13px;line-height:1.5;background:var(--code-bg);border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin:0 0 14px;overflow-x:auto;white-space:pre;max-width:100%}
.hint{font-size:13px;color:var(--muted);margin:0 0 10px}
.opts{display:flex;flex-direction:column;gap:8px;margin:14px 0 18px}
.opt{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:start;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.opt .key{font-family:var(--f-mono);font-weight:500;font-size:13px;width:26px;height:26px;display:grid;place-items:center;border:1px solid var(--line);border-radius:4px;background:var(--surface-2)}
.opt .tx{overflow-wrap:anywhere}
.opt .lab{font-family:var(--f-mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;padding-top:4px}
.opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.opt[aria-pressed="true"] .key{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ink)}
.opt.ok .key{background:var(--ok);color:var(--bg);border-color:var(--ok)}
.opt.ok .lab{color:var(--ok)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad)}
.opt.bad .key{background:var(--bad);color:var(--bg);border-color:var(--bad)}
.opt.bad .lab{color:var(--bad)}
.opt.miss{border-style:dashed;border-color:var(--ok)}
.opt.miss .lab{color:var(--ok)}
.opt:disabled{cursor:default;opacity:1}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:9px 16px;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary[aria-expanded="true"]{background:var(--surface);color:var(--accent)}
.btn[disabled]{opacity:.45;cursor:default}
.btn.mark[aria-pressed="true"].k{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.btn.mark[aria-pressed="true"].r{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.result{margin:16px 0 0;padding:10px 14px;border-radius:6px;font-weight:600;font-size:14px}
.result.good{background:var(--ok-bg);color:var(--ok)}
.result.nope{background:var(--bad-bg);color:var(--bad)}
.expl{margin-top:18px;border-top:1px solid var(--line);padding-top:16px}
.expl h3{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;margin:0 0 8px}
.expl p{margin:0 0 12px;max-width:68ch}
details.en{margin-top:10px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2)}
details.en summary{cursor:pointer;padding:9px 12px;font-size:13px;color:var(--muted)}
details.en div{padding:0 14px 12px;font-size:14px;color:var(--ink)}
details.en h4{font-size:12px;font-family:var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:12px 0 4px;font-weight:500}
details.en p{margin:0 0 8px}
.marks{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;align-items:center}
.marks .lbl{font-size:13px;color:var(--muted)}
.pager{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:20px;flex-wrap:wrap}
.pos{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.keys{font-size:12px;color:var(--muted);margin-top:12px}
kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--surface-2)}

/* PBQ */
.rows{display:flex;flex-direction:column;gap:8px;margin:12px 0 16px}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 14px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.row .rt{overflow-wrap:anywhere}
.row select{width:100%;min-width:0;border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:7px 8px}
.row.ok{background:var(--ok-bg);border-color:var(--ok)}
.row.bad{background:var(--bad-bg);border-color:var(--bad)}
.row .why{grid-column:1 / -1;font-size:13px;color:var(--muted)}
.row .ans{font-weight:600;color:var(--ok)}
.tablewrap{overflow-x:auto;margin:12px 0 16px;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{border:1px solid var(--line);padding:7px 10px;text-align:left;white-space:nowrap}
th{background:var(--surface-2);font-family:var(--f-mono);font-size:12px;font-weight:500;color:var(--muted)}
td.mask{color:var(--muted);letter-spacing:.2em}
.notes{margin:0 0 12px;padding-left:20px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:28px;text-align:center;color:var(--muted)}

@media (max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;max-height:none;overflow:visible;padding-right:0}
  .rail-toggle{display:block}
  .rail-body{display:none}
  .rail.open .rail-body{display:flex}
  .rail-body{flex-direction:column;gap:18px}
}
@media (min-width:901px){
  .rail-body{display:flex;flex-direction:column;gap:18px}
}
@media (max-width:560px){
  .card{padding:16px}
  .row{grid-template-columns:minmax(0,1fr)}
  .opt{grid-template-columns:28px minmax(0,1fr)}
  .opt .lab{grid-column:2;padding-top:0}
  .qtext{font-size:16px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

  <div class="layout">

    <main id="main" aria-live="off"></main>
  </div>

<script>
const DATA = [{"id":"A1","exam":"A","n":1,"type":"pbq","mode":"match","dom":2,"obj":"SY0-701, Objetivos 2.2-2.4 - Tipos de ataque","prompt":"Match the description with the most accurate attack type. Not all attack types will be used.","choices":["On-path","RFID cloning","Keylogger","Vishing","Rootkit","DDoS","Injection","Supply chain"],"items":[{"t":"Attacker accesses a database directly from a web browser","a":"Injection","w":"Inyección SQL: comandos enviados a la base de datos mediante una aplicación web vulnerable."},{"t":"Attacker intercepts all communication between a client and a web server","a":"On-path","w":"On-path: el atacante se coloca entre cliente y servidor sin ser visto."},{"t":"Multiple attackers overwhelm a web server","a":"DDoS","w":"DDoS: muchos atacantes saturan el servicio."},{"t":"Attacker obtains a list of all login credentials used over the last 24 hours","a":"Keylogger","w":"Keylogger: captura lo tecleado y lo envía al atacante."},{"t":"Attacker obtains bank account number and birth date by calling the victim","a":"Vishing","w":"Vishing: phishing por voz (llamada telefónica)."}],"es":"Se usan cinco tipos y quedan sin usar RFID cloning, Rootkit y Supply chain.","extra":null},{"id":"A2","exam":"A","n":2,"type":"pbq","mode":"match","dom":1,"obj":"SY0-701, Objetivo 1.2 - Seguridad física","prompt":"The security team at a manufacturing company is creating a set of security standards for employees and visitors. Select the BEST security control for each location. All of the available security controls will be used once.","choices":["Outside Building: parking and visitor drop-off","Reception / Building lobby","Data Center Door (entrance from inside building)","Server Administration (authentication to server console)"],"items":[{"t":"Fencing","a":"Outside Building: parking and visitor drop-off","w":"Una cerca controla el acceso al perímetro y estacionamiento."},{"t":"Lighting","a":"Outside Building: parking and visitor drop-off","w":"La iluminación da seguridad a quien llega o se estaciona."},{"t":"Security guard","a":"Reception / Building lobby","w":"El guardia verifica la autorización de quien entra."},{"t":"Access control vestibule","a":"Reception / Building lobby","w":"El vestíbulo controla el flujo de personas en el punto de entrada."},{"t":"Biometrics","a":"Data Center Door (entrance from inside building)","w":"Verificación biométrica (huella, mano) para entrar al data center."},{"t":"Access badge","a":"Data Center Door (entrance from inside building)","w":"Gafete de acceso más biometría para la puerta del data center."},{"t":"Authentication token","a":"Server Administration (authentication to server console)","w":"Usuario, contraseña y token: MFA para la consola del servidor."}],"es":"Dos controles por cada una de las tres primeras ubicaciones, y el token para la consola del servidor.","extra":null},{"id":"A3","exam":"A","n":3,"type":"pbq","mode":"match","dom":1,"obj":"SY0-701, Objetivo 1.1 - Categorías de control","prompt":"Select the most appropriate security category. Some categories may be used more than once.","choices":["Technical","Managerial","Operational","Physical"],"items":[{"t":"A guard checks the identification of all visitors","a":"Operational","w":"Operacional: lo realizan personas (guardias, capacitación)."},{"t":"All returns must be approved by a Vice President","a":"Managerial","w":"Gerencial: política o procedimiento administrativo."},{"t":"A generator is used during a power outage","a":"Physical","w":"Físico: equipo tangible."},{"t":"Building doors can be unlocked with an access card","a":"Physical","w":"Físico: lectores de gafete y puertas."},{"t":"System logs are transferred automatically to a SIEM","a":"Technical","w":"Técnico: implementado por sistemas automáticos."}],"es":"Técnico = sistemas; Gerencial = políticas; Operacional = personas; Físico = limita el acceso físico.","extra":null},{"id":"A4","exam":"A","n":4,"type":"pbq","mode":"match","dom":4,"obj":"SY0-701, Objetivo 4.6 - Autenticación multifactor","prompt":"Match the appropriate authentication factor to each description. Each authentication factor will be used once.","choices":["Somewhere you are","Something you have","Something you are","Something you know"],"items":[{"t":"During the login process, your phone receives a text message with a one-time passcode","a":"Something you have","w":"Algo que tienes: el teléfono."},{"t":"You enter your PIN to make a deposit into an ATM","a":"Something you know","w":"Algo que sabes: el PIN."},{"t":"You can use your fingerprint to unlock the door to the data center","a":"Something you are","w":"Algo que eres: biometría."},{"t":"Your login will not work unless you are connected to the VPN","a":"Somewhere you are","w":"Algún lugar donde estás: ubicación de red."}],"es":"Cada factor se usa una vez.","extra":null},{"id":"A5","exam":"A","n":5,"type":"pbq","mode":"table","dom":4,"obj":"SY0-701, Objetivo 4.5 - Firewalls","prompt":"Configure the following stateful firewall rules: (1) Block HTTP sessions between the Web Server (10.1.1.2) and the Database Server (10.2.1.20). (2) Allow the Storage Server (10.2.1.33) to transfer files to the Video Server (10.1.1.7) over HTTPS. (3) Allow the Management Server (10.2.1.47) to use a secure terminal on the File Server (10.1.1.3).","choices":[],"items":[],"es":"Por ser stateful, una sola regla cubre el tráfico de ida y de vuelta. HTTP = TCP/80, HTTPS = TCP/443, terminal segura = SSH TCP/22.","extra":{"head":["Rule #","Source IP","Destination IP","Protocol","Port #","Allow/Block"],"rows":[["1","10.1.1.2","10.2.1.20","TCP","80","Block"],["2","10.2.1.33","10.1.1.7","TCP","443","Allow"],["3","10.2.1.47","10.1.1.3","TCP","22","Allow"]],"notes":["Regla 1: origen Web Server, destino Database Server, HTTP (TCP/80), Block.","Regla 2: origen Storage Server, destino Video Server, HTTPS (TCP/443), Allow.","Regla 3: origen Management Server, destino File Server, SSH (TCP/22), Allow."]}},{"id":"A6","exam":"A","n":6,"type":"mc","dom":5,"obj":"5.5","objtxt":"SY0-701, Objective 5.5 - Penetration Tests","qparts":[{"k":"p","v":"A company has hired a third-party to gather information about the company’s servers and data. This third-party will not have direct access to the company's internal network, but they can gather information from any other source. Which of the following would BEST describe this approach?"}],"opts":[{"k":"A","t":"Vulnerability scanning"},{"k":"B","t":"Passive reconnaissance"},{"k":"C","t":"Supply chain analysis"},{"k":"D","t":"Regulatory audit"}],"ans":["B"],"es":"Reconocimiento pasivo: se reúne información de fuentes abiertas (redes sociales, sitios web corporativos) sin tocar la red interna. Un escaneo de vulnerabilidades es activo y una auditoría regulatoria requiere acceso a sistemas internos.","en":"B. Passive reconnaissance Passive reconnaissance focuses on gathering as much information from open sources such as social media, corporate websites, and business organizations.","enw":"A. Vulnerability scanning Some active reconnaissance tests will query systems directly to see if a vulnerability currently exists. C. Supply chain analysis A supply chain analysis will examine the security associated with a supplier, and the analysis will not provide any information regarding a company's own servers and data. D. Regulatory audit A regulatory audit is a detailed security analysis based on existing laws or private guidelines. A regulatory audit commonly requires access to internal systems and data."},{"id":"A7","exam":"A","n":7,"type":"mc","dom":4,"obj":"4.5","objtxt":"SY0-701, Objective 4.5 - Email Security","qparts":[{"k":"p","v":"A company's email server has received an email from a third-party, but the origination server does not match the list of authorized devices. Which of the following would determine the disposition of this message?"}],"opts":[{"k":"A","t":"SPF"},{"k":"B","t":"NAC"},{"k":"C","t":"DMARC"},{"k":"D","t":"DKIM"}],"ans":["C"],"es":"DMARC define qué hacer con un correo que no pasa la validación: aceptarlo, enviarlo a spam o rechazarlo. SPF solo lista los servidores autorizados y DKIM valida firmas digitales; ninguno decide la disposición.","en":"C. DMARC DMARC (Domain-based Message Authentication Reporting and Conformance) specifies the disposition of spam emails. The legitimate owner of the originating email domain can choose to have these messages accepted, sent to a spam folder, or rejected.","enw":"A. SPF SPF (Sender Policy Framework) is a list of all authorized mail servers for a specific domain. All legitimate emails would be sent from one of the servers listed in the SPF configuration. B. NAC NAC (Network Access Control) is a way to limit network access to only authorized users. NAC is not commonly used to manage the transfer of email messages. D. DKIM DKIM (Domain Keys Identified Mail) provides a way to validate all digitally signed messages from a specific email server. DKIM does not determine how the receiving server categorizes these digitally signed messages."},{"id":"A8","exam":"A","n":8,"type":"mc","dom":2,"obj":"2.1","objtxt":"SY0-701, Objective 2.1 - Threat Actors","qparts":[{"k":"p","v":"Which of these threat actors would be MOST likely to attack systems for direct financial gain?"}],"opts":[{"k":"A","t":"Organized crime"},{"k":"B","t":"Hacktivist"},{"k":"C","t":"Nation state"},{"k":"D","t":"Shadow IT"}],"ans":["A"],"es":"El crimen organizado busca dinero. Los hacktivistas tienen una agenda política, los estados-nación ya están financiados y Shadow IT es TI paralela dentro de la empresa, no un atacante.","en":"A. Organized crime An organized crime actor is motivated by money, and their hacking objectives are usually based around objectives that can be easily exchanged for financial capital.","enw":"B. Hacktivist A hacktivist is focused on a political agenda and not commonly on a financial gain. C. Nation state Nation states are already well funded, and their primary objective is not usually based on revenue or income. D. Shadow IT Shadow IT describes part of the organization that works around the existing IT department to build their own applications and infrastructure."},{"id":"A9","exam":"A","n":9,"type":"mc","dom":4,"obj":"4.8","objtxt":"SY0-701, Objective 4.8 - Incident Planning","qparts":[{"k":"p","v":"A security administrator has examined a server recently compromised by an attacker, and has determined the system was exploited due to a known operating system vulnerability. Which of the following would BEST describe this finding?"}],"opts":[{"k":"A","t":"Root cause analysis"},{"k":"B","t":"E-discovery"},{"k":"C","t":"Risk appetite"},{"k":"D","t":"Data subject"}],"ans":["A"],"es":"Root cause analysis (análisis de causa raíz) explica la causa última de un incidente, aquí una vulnerabilidad conocida del sistema operativo, para evitar que se repita.","en":"A. Root cause analysis The goal of a root cause analysis is to explain the ultimate cause of an incident. Once the cause is known, it becomes easier to protect against similar attacks in the future.","enw":"B. E-discovery E-discovery relates to the collection, preparation, review, interpretation, and production of electronic documents. E-discovery itself is not involved with the research and determination of an attack's root cause. C. Risk appetite A risk appetite describes the amount of risk an organization is willing to take before taking any action to reduce that risk. Risk appetite is not part of a root cause analysis. D. Data subject A data subject describes any information relating to an identified or identifiable natural person, especially when describing or managing private information about the subject."},{"id":"A10","exam":"A","n":10,"type":"mc","dom":3,"obj":"3.1","objtxt":"SY0-701, Objective 3.1 - Infrastructure Considerations","qparts":[{"k":"p","v":"A city is building an ambulance service network for emergency medical dispatching. Which of the following should have the highest priority?"}],"opts":[{"k":"A","t":"Integration costs"},{"k":"B","t":"Patch availability"},{"k":"C","t":"System availability"},{"k":"D","t":"Power usage"}],"ans":["C"],"es":"En un despacho de emergencias lo más importante es la disponibilidad del sistema. Costos, parches y consumo de energía pasan a segundo plano cuando hay vidas en juego.","en":"C. System availability Requests to emergency services are often critical in nature, and it's important for a dispatching system to always be available when a call is made.","enw":"A. Integration costs When lives are on the line, the cost is not commonly the most important aspect of a system integration. B. Patch availability Although it's important to always keep systems patched, it's more important that a life saving service be available to those who might need it. D. Power usage Power usage is not usually the most important consideration when building a critical healthcare and emergency service infrastructure."},{"id":"A11","exam":"A","n":11,"type":"mc","dom":5,"obj":"5.4","objtxt":"SY0-701, Objective 5.4 - Compliance","qparts":[{"k":"p","v":"A system administrator receives a text alert when access rights are changed on a database containing private customer information. Which of the following would describe this alert?"}],"opts":[{"k":"A","t":"Maintenance window"},{"k":"B","t":"Attestation and acknowledgment"},{"k":"C","t":"Automation"},{"k":"D","t":"External audit"}],"ans":["C"],"es":"Es automatización: una alerta automática por un cambio de permisos permite verificar el cumplimiento sin intervención humana. Una ventana de mantenimiento o una auditoría externa no generan alertas en tiempo real.","en":"C. Automation Automation ensures that compliance checks can be performed on a regular basis without the need for human intervention. This can be especially useful to provide alerts when a configuration change causes an organization to be out of compliance.","enw":"A. Maintenance window A maintenance window describes the scheduling associated with the change control process. Systems and services generally have limited availability during a maintenance window. B. Attestation and acknowledgment With compliance, the process of attestation and acknowledgment is the final verification of the formal compliance documentation. An alert from an automated process would not qualify as attestation. D. External audit An external audit can be a valuable tool for verifying the compliance process, but an automated alert from a monitoring system would not be part of an external audit."},{"id":"A12","exam":"A","n":12,"type":"mc","dom":2,"obj":"2.2","objtxt":"SY0-701, Objective 2.2 - Common Threat Vectors","qparts":[{"k":"p","v":"A security administrator is concerned about the potential for data exfiltration using external storage drives. Which of the following would be the BEST way to prevent this method of data exfiltration?"}],"opts":[{"k":"A","t":"Create an operating system security policy to block the use of removable media"},{"k":"B","t":"Monitor removable media usage in host-based firewall logs"},{"k":"C","t":"Only allow applications that do not use removable media"},{"k":"D","t":"Define a removable media block rule in the UTM"}],"ans":["A"],"es":"Una política de seguridad en el sistema operativo puede bloquear la escritura en medios removibles (USB). Los logs del firewall de host y el UTM no controlan el hardware de almacenamiento.","en":"A. Create an operating system security policy to prevent the use of removable media Removable media uses hot-pluggable interfaces such as USB to connect storage drives. A security policy in the operating system can prevent any files from being written to a removable drive.","enw":"B. Monitor removable media usage in host-based firewall logs A host-based firewall monitors traffic flows and does not commonly log hardware or USB drive access. C. Only allow applications that do not use removable media File storage access options are not associated with applications, so it’s not possible to allow based on external storage drive usage. D. Define a removable media block rule in the UTM A UTM (Unified Threat Manager) watches traffic flows across the network and does not commonly manage the storage options on individual computers."},{"id":"A13","exam":"A","n":13,"type":"mc","dom":3,"obj":"3.3","objtxt":"SY0-701, Objective 3.3 - Data Types and Classifications","qparts":[{"k":"p","v":"A company creates a standard set of government reports each calendar quarter. Which of the following would describe this type of data?"}],"opts":[{"k":"A","t":"Data in use"},{"k":"B","t":"Obfuscated"},{"k":"C","t":"Trade secrets"},{"k":"D","t":"Regulated"}],"ans":["D"],"es":"Los reportes para el gobierno son datos regulados: están sujetos a leyes sobre qué se puede divulgar. No son datos en uso, ofuscados ni secretos comerciales.","en":"D. Regulated Reports and information created for governmental use are regulated by laws regarding the disclosure of certain types of data.","enw":"A. Data in use Data in use describes information actively processing in the memory of a system, such as system RAM, CPU registers, or CPU cache. Government reports are static documents and are not actively being processed. B. Obfuscated Obfuscation describes the modification of data to make something understandable into something very difficult to understand. Information contained in a government report is relatively easy to understand and would not be considered obfuscated data. C. Trade secrets Trade secrets are the private details a company uses as part of their normal business processes, and these trade secrets are not shared with any other organization or business."},{"id":"A14","exam":"A","n":14,"type":"mc","dom":4,"obj":"4.6","objtxt":"SY0-701, Objective 4.6 - Access Controls","qparts":[{"k":"p","v":"An insurance company has created a set of policies to handle data breaches. The security team has been given this set of requirements based on these policies:"},{"k":"ul","v":["Access records from all devices must be saved and archived","Any data access outside of normal working hours must be immediately reported","Data access must only occur inside of the country","Access logs and audit reports must be created from a single database"]},{"k":"p","v":"Which of the following should be implemented by the security team to meet these requirements? (Select THREE)"}],"opts":[{"k":"A","t":"Restrict login access by IP address and GPS location"},{"k":"B","t":"Require government-issued identification during the onboarding process"},{"k":"C","t":"Add additional password complexity for accounts that access data"},{"k":"D","t":"Conduct monthly permission auditing"},{"k":"E","t":"Consolidate all logs on a SIEM"},{"k":"F","t":"Archive the encryption keys of all disabled accounts"},{"k":"G","t":"Enable time-of-day restrictions on the authentication server"}],"ans":["A","E","G"],"es":"IP/GPS limita el acceso al país, el SIEM centraliza logs y reportes en una sola base de datos, y las restricciones de horario en el servidor de autenticación reportan accesos fuera de horario. Las otras opciones son buenas prácticas, pero no cumplen los requisitos listados.","en":"A. Restrict login access by IP address and GPS location, E. Consolidate all logs on a SIEM, and G. Enable time-of-day restrictions on the authentication server Adding location-based policies will prevent direct data access from outside of the country. Saving log information from all devices and creating audit reports from a single database can be implemented through the use of a SIEM (Security Information and Event Manager). Adding a check for the time-of-day will report any access that occurs during non-working hours.","enw":"B. Require government-issued identification during the onboarding process Requiring proper identification is always a good idea, but it’s not one of the listed requirements. C. Add additional password complexity for accounts that access data Additional password complexity is another good best practice, but it’s not part of the provided requirements. D. Conduct monthly permission auditing No requirements for ongoing auditing were included in the requirements, but ongoing auditing is always an important consideration. F. Archive the encryption keys of all disabled accounts If an account is disabled, there may still be encrypted data that needs to be recovered later. Archiving the encryption keys will allow access to that data after the account is no longer in use."},{"id":"A15","exam":"A","n":15,"type":"mc","dom":4,"obj":"4.9","objtxt":"SY0-701, Objective 4.9 - Log Files","qparts":[{"k":"p","v":"A security engineer is viewing this record from the firewall logs:"},{"k":"code","v":"UTC 04/05/2023 03:09:15809 AV Gateway Alert\n136.127.92.171 80 -> 10.16.10.14 60818\nGateway Anti-Virus Alert:\nXPACK.A_7854 (Trojan) blocked."},{"k":"p","v":"Which of the following can be observed from this log information?"}],"opts":[{"k":"A","t":"The victim's IP address is 136.127.92.171"},{"k":"B","t":"A download was blocked from a web server"},{"k":"C","t":"A botnet DDoS attack was blocked"},{"k":"D","t":"The Trojan was blocked, but the file was not"}],"ans":["B"],"es":"El flujo va del puerto 80 (servidor web) a un puerto alto del cliente: se bloqueó una descarga con un troyano. El atacante es 136.127.92.171 y la víctima 10.16.10.14; troyano y archivo son la misma cosa.","en":"B. A download was blocked from a web server A traffic flow from a web server port number (80) to a device port (60818) indicates that this traffic flow originated on port 80 of the web server. A file download is one of the most common ways to deliver a Trojan, and this log entry shows that the file containing the XPACK.A_7854 Trojan was blocked.","enw":"A. The victim’s IP address is 136.127.92.171 The format for this log entry uses an arrow to differentiate between the attacker and the victim. The attacker IP address is 136.127.92.171, and the victim’s IP address is 10.16.10.14. C. A botnet DDoS attack was blocked A botnet attack would not commonly include a Trojan horse as part of a distributed denial of service (DDoS) attack. D. The Trojan was blocked, but the file was not A Trojan horse attack involves malware that is disguised as legitimate software. The Trojan malware and the file are the same entity, so there isn’t a way to decouple the malware from the file."},{"id":"A16","exam":"A","n":16,"type":"mc","dom":2,"obj":"2.4","objtxt":"SY0-701, Objective 2.4 - On-Path Attacks","qparts":[{"k":"p","v":"A user connects to a third-party website and receives this message:"},{"k":"code","v":"Your connection is not private.\nNET::ERR_CERT_INVALID"},{"k":"p","v":"Which of the following attacks would be the MOST likely reason for this message?"}],"opts":[{"k":"A","t":"Brute force"},{"k":"B","t":"DoS"},{"k":"C","t":"On-path"},{"k":"D","t":"Deauthentication"}],"ans":["C"],"es":"Un error de certificado inválido suele indicar un ataque on-path: el intermediario no puede presentar un certificado válido para el sitio. Fuerza bruta, DoS o deautenticación no producen ese mensaje.","en":"C. On-path An on-path attack is often associated with a third-party who is actively intercepting network traffic. This entity in the middle would not be able to provide a valid SSL certificate for a third-party website, and this error would appear in the browser as a warning.","enw":"A. Brute force A brute force attack is commonly associated with password hacks. Brute force attacks would not cause the certificate on a website to be invalid. B. DoS A DoS (Denial of Service) attack would prevent communication to a server and most likely provide a timeout error. This error is not related to a service availability issue. D. Deauthentication Deauthentication attacks are commonly associated with wireless networks, and they usually cause disconnects and lack of connectivity. The error message in this example does not appear to be associated with a network outage or disconnection."},{"id":"A17","exam":"A","n":17,"type":"mc","dom":4,"obj":"4.6","objtxt":"SY0-701, Objective 4.6 - Identity and Access Management","qparts":[{"k":"p","v":"Which of the following would be the BEST way to provide a website login using existing credentials from a third-party site?"}],"opts":[{"k":"A","t":"Federation"},{"k":"B","t":"802.1X"},{"k":"C","t":"EAP"},{"k":"D","t":"SSO"}],"ans":["A"],"es":"Federación permite autenticarse con credenciales de otra organización. SSO da un solo inicio de sesión dentro de los servicios propios; 802.1X y EAP son para acceso a red.","en":"A. Federation Federation would allow members of one organization to authenticate using the credentials of another organization.","enw":"B. 802.1X 802.1X is a useful authentication protocol, but it needs additional functionality to authenticate across multiple user databases. C. EAP EAP (Extensible Authentication Protocol) is an authentication framework commonly associated with network access control. EAP by itself does not provide the federation needed to authenticate users to a third-party access database. D. SSO SSO (Single Sign-On) describes the process of enabling a single authentication to grant access to many different network services. Obtaining login credentials from a third-party access database does not describe the process used by SSO."},{"id":"A18","exam":"A","n":18,"type":"mc","dom":5,"obj":"5.2","objtxt":"SY0-701, Objective 5.2 - Business Impact Analysis","qparts":[{"k":"p","v":"A system administrator is working on a contract that will specify a minimum required uptime for a set of Internet-facing firewalls. The administrator needs to know how often the firewall hardware is expected to fail between repairs. Which of the following would BEST describe this information?"}],"opts":[{"k":"A","t":"MTBF"},{"k":"B","t":"RTO"},{"k":"C","t":"MTTR"},{"k":"D","t":"RPO"}],"ans":["A"],"es":"MTBF (Mean Time Between Failures) es cada cuánto se espera que falle el hardware entre reparaciones. RTO y RPO son objetivos de recuperación y MTTR es el tiempo de reparación.","en":"A. MTBF The MTBF (Mean Time Between Failures) is a prediction of how often a repairable system will fail.","enw":"B. RTO RTO (Recovery Time Objectives) define a timeframe needed to restore a particular service level. C. MTTR MTTR (Mean Time to Restore) is the amount of time it takes to repair a component. D. RPO RPO (Recovery Point Objective) describes the minimum data or operational state required to categorize a system as recovered."},{"id":"A19","exam":"A","n":19,"type":"mc","dom":2,"obj":"2.2","objtxt":"SY0-701, Objective 2.2 - Impersonation","qparts":[{"k":"p","v":"An attacker calls into a company’s help desk and pretends to be the director of the company’s manufacturing department. The attacker states that they have forgotten their password and they need to have the password reset quickly for an important meeting. What kind of attack would BEST describe this phone call?"}],"opts":[{"k":"A","t":"Social engineering"},{"k":"B","t":"Supply chain"},{"k":"C","t":"Watering hole"},{"k":"D","t":"On-path"}],"ans":["A"],"es":"Es ingeniería social: el atacante suplanta a una autoridad y crea urgencia para que el help desk se salte los controles normales.","en":"A. Social engineering This social engineering attack uses impersonation to take advantage of authority and urgency principles in an effort to convince someone else to circumvent normal security controls.","enw":"B. Supply chain A supply chain attack focuses on the equipment or raw materials used to deliver products or services to an organization or user. A call to the help desk would not be categorized as part of the supply chain. C. Watering hole A watering hole attack uses a third-party site to perform attacks outside of a user's local (and usually more secure) network. D. On-path An on-path attack commonly occurs without any knowledge to the parties involved, and there’s usually no additional notification that an attack is underway. In this question, the attacker contacted the help desk engineer directly."},{"id":"A20","exam":"A","n":20,"type":"mc","dom":5,"obj":"5.3","objtxt":"SY0-701, Objective 5.3 - Agreement Types","qparts":[{"k":"p","v":"Two companies have been working together for a number of months, and they would now like to qualify their partnership with a broad formal agreement between both organizations. Which of the following would describe this agreement?"}],"opts":[{"k":"A","t":"SLA"},{"k":"B","t":"SOW"},{"k":"C","t":"MOA"},{"k":"D","t":"NDA"}],"ans":["C"],"es":"Un MOA (Memorandum of Agreement) es un acuerdo formal y amplio de metas entre organizaciones. SLA fija niveles de servicio, SOW lista tareas y NDA protege confidencialidad.","en":"C. MOA An MOA (Memorandum of Agreement) is a formal document where both sides agree to a broad set of goals and objectives associated with the partnership.","enw":"A. SLA An SLA (Service Level Agreement) is commonly provided as a formal contract between two parties that documents the minimum terms for services provided. The SLA often provides very specific requirements and expectations between both parties. B. SOW An SOW (Statement of Work) is a detailed list of items to be completed as part of overall project deliverables. For example, a list of expected job tasks associated with a firewall installation would be documented in an SOW. D. NDA An NDA (Non-Disclosure Agreement) is a confidentiality agreement between parties. This question did not mention any requirement for privacy or confidentiality."},{"id":"A21","exam":"A","n":21,"type":"mc","dom":1,"obj":"1.2","objtxt":"SY0-701, Objective 1.2 - The CIA Triad","qparts":[{"k":"p","v":"Which of the following would explain why a company would automatically add a digital signature to each outgoing email message?"}],"opts":[{"k":"A","t":"Confidentiality"},{"k":"B","t":"Integrity"},{"k":"C","t":"Authentication"},{"k":"D","t":"Availability"}],"ans":["B"],"es":"La firma digital permite comprobar que el mensaje no cambió desde que se firmó: integridad. También aporta autenticidad y no repudio, pero la respuesta esperada es integridad.","en":"B. Integrity Integrity refers to the trustworthiness of data. A digital signature allows the recipient to confirm that none of the data has been changed since the digital signature was created.","enw":"A. Confidentiality Confidentiality describes the privacy of data. Encrypting traffic sent over a VPN or encrypting files stored on a flash drive would be an example of data confidentiality. C. Authentication Authentication refers to the process of verifying the identity of an individual or system. A username and password is a common method of authentication, but digital signatures are not commonly used as an authentication method. D. Availability Availability describes the ability of an authorized user to access data. A digital signature does not provide any features associated with the availability of the data."},{"id":"A22","exam":"A","n":22,"type":"mc","dom":2,"obj":"2.3","objtxt":"SY0-701, Objective 2.3 - Race Conditions","qparts":[{"k":"p","v":"The embedded OS in a company’s time clock appliance is configured to reset the file system and reboot when a file system error occurs. On one of the time clocks, this file system error occurs during the startup process and causes the system to constantly reboot. Which of the following BEST describes this issue?"}],"opts":[{"k":"A","t":"Memory injection"},{"k":"B","t":"Resource consumption"},{"k":"C","t":"Race condition"},{"k":"D","t":"Malicious update"}],"ans":["C"],"es":"Race condition: el reinicio ocurre antes de que el error del sistema de archivos se pueda corregir, lo que genera un bucle infinito de reinicios.","en":"C. Race condition A race condition occurs when two processes occur at similar times, and usually with unexpected results. The file system problem can often be fixed before a reboot, but the reboot is occurring before the fix can be applied. This has created a race condition that results in constant reboots.","enw":"A. Memory injection A memory injection is commonly used by malicious software to add code to the memory of an existing process. The issue in this question was related to a file system error and was not part of a malicious data injection. B. Resource consumption If the time clock was running out of storage space or memory, it would most likely be unusable. In this example, the issue isn’t based on a lack of resources. D. Malicious update A malicious update occurs when a software patch installs unwanted or unauthorized code. Many attackers will use software patches to install their own malicious code during a software update."},{"id":"A23","exam":"A","n":23,"type":"mc","dom":4,"obj":"4.6","objtxt":"SY0-701, Objective 4.6 - Password Security","qparts":[{"k":"p","v":"A recent audit has found that existing password policies do not include any restrictions on password attempts, and users are not required to periodically change their passwords. Which of the following would correct these policy issues? (Select TWO)"}],"opts":[{"k":"A","t":"Password complexity"},{"k":"B","t":"Password expiration"},{"k":"C","t":"Password reuse"},{"k":"D","t":"Account lockout"},{"k":"E","t":"Password managers"}],"ans":["B","D"],"es":"La expiración de contraseñas obliga a cambiarlas periódicamente y el bloqueo de cuenta limita los intentos fallidos. Complejidad, reutilización y gestores de contraseñas no resuelven esos dos hallazgos.","en":"B. Password expiration and D. Account lockout Password expiration would require a password change after the expiration date. An account lockout would disable an account after a predefined number of unsuccessful login attempts.","enw":"A. Password complexity A complex password would make the password more difficult to brute force, but it would not solve the issues listed in this question. C. Password reuse Maintaining a password history would prevent the reuse of any previous passwords. Restricting password reuse would ensure that a different password is used each time a password change is processed. E. Password managers A password manager would provide a way to securely store and retrieve passwords, but it would not resolve any issues relating to password expirations or account lockouts."},{"id":"A24","exam":"A","n":24,"type":"mc","dom":1,"obj":"1.1","objtxt":"SY0-701, Objective 1.1 - Security Controls","qparts":[{"k":"p","v":"What kind of security control is associated with a login banner?"}],"opts":[{"k":"A","t":"Preventive"},{"k":"B","t":"Deterrent"},{"k":"C","t":"Corrective"},{"k":"D","t":"Detective"},{"k":"E","t":"Compensating"},{"k":"F","t":"Directive"}],"ans":["B"],"es":"Un banner de inicio de sesión es un control disuasivo (deterrent): no bloquea nada, pero desalienta al intruso.","en":"B. Deterrent A deterrent control does not directly stop an attack, but it may discourage an action.","enw":"A. Preventive A preventive control physically limits access to a device or area. C. Corrective A corrective control can actively work to mitigate any damage. D. Detective A detective control may not prevent access, but it can identify and record any intrusion attempts. E. Compensating A compensating security control doesn’t prevent an attack, but it does restore from an attack using other means. F. Directive A directive control is relatively weak control which relies on security compliance from the end users."},{"id":"A25","exam":"A","n":25,"type":"mc","dom":4,"obj":"4.3","objtxt":"SY0-701, Objective 4.3 - Vulnerability Remediation","qparts":[{"k":"p","v":"An internal audit has discovered four servers that have not been updated in over a year, and it will take two weeks to test and deploy the latest patches. Which of the following would be the best way to quickly respond to this situation in the meantime?"}],"opts":[{"k":"A","t":"Purchase cybersecurity insurance"},{"k":"B","t":"Implement an exception for all data center services"},{"k":"C","t":"Move the servers to a protected segment"},{"k":"D","t":"Hire a third-party to perform an extensive audit"}],"ans":["C"],"es":"Mover los servidores a un segmento protegido reduce la exposición mientras se prueban y aplican los parches. Excepciones amplias, seguros o auditorías de terceros no ayudan en esas dos semanas.","en":"C. Move the servers to a protected segment Segmenting the servers to their own protected network would allow for additional security controls while still maintaining the uptime and availability of the systems.","enw":"A. Purchase cybersecurity insurance Cybersecurity insurance can help plan for financial issues during a significant attack, but it wouldn't provide any assistance for mitigating potential vulnerabilities during this two week period. B. Implement an exception for all data center services Security exceptions should be rare, and they should be very specific to a small number of systems. It would be risky to create a broad security exception for systems which are not in-scope for the identified vulnerability. D. Hire a third-party to perform an extensive audit Audits take time, and hiring a third-party to perform an audit takes even longer. By the time a third-party audit was underway, the problematic systems would have already been tested and patched."},{"id":"A26","exam":"A","n":26,"type":"mc","dom":3,"obj":"3.4","objtxt":"SY0-701, Objective 3.4 - Resiliency","qparts":[{"k":"p","v":"A business manager is documenting a set of steps for processing orders if the primary Internet connection fails. Which of these would BEST describe these steps?"}],"opts":[{"k":"A","t":"Platform diversity"},{"k":"B","t":"Continuity of operations"},{"k":"C","t":"Cold site recovery"},{"k":"D","t":"Tabletop exercise"}],"ans":["B"],"es":"Continuidad de operaciones (continuity of operations): pasos alternos para seguir procesando pedidos cuando falla el Internet principal. Un tabletop es solo una práctica discutida.","en":"B. Continuity of operations It's always useful to have an alternative set of processes to handle any type of outage or issue. Continuity of operations planning ensures that the business will continue to operate when these issues occur.","enw":"A. Platform diversity Using different operating systems and platforms can help mitigate issues associated with a single OS, but it wouldn't provide any mitigation if the primary Internet connection was no longer available. C. Cold site recovery A cold site takes time to build, and the time and expense associated with a disaster recovery switchover would be extensive. By the time a cold site was enabled, the primary Internet connection may already be restored and many alternative recovery options could have potentially been deployed. D. Tabletop exercise A tabletop exercise usually consists of a meeting where members of a recovery team or disaster recovery talk through a disaster scenario."},{"id":"A27","exam":"A","n":27,"type":"mc","dom":1,"obj":"1.2","objtxt":"SY0-701, Objective 1.2 - Physical Security","qparts":[{"k":"p","v":"A company would like to examine the credentials of each individual entering the data center building. Which of the following would BEST facilitate this requirement?"}],"opts":[{"k":"A","t":"Access control vestibule"},{"k":"B","t":"Video surveillance"},{"k":"C","t":"Pressure sensors"},{"k":"D","t":"Bollards"}],"ans":["A"],"es":"Un vestíbulo de control de acceso (access control vestibule) obliga a revisar las credenciales de cada persona antes de dejarla pasar. Cámaras, sensores de presión y bolardos no validan credenciales.","en":"A. Access control vestibule An access control vestibule is a room designed to restrict the flow of individuals through an area. These are commonly used in high security areas where each person needs to be evaluated and approved before access can be provided.","enw":"B. Video surveillance Although video surveillance can assist with monitoring access to a building or room, it doesn't provide a way to validate the credentials of each visitor. C. Pressure sensors Pressure sensors are commonly used on doors or windows to detect movement in those devices. However, pressure sensors would not be used to check visitor credentials. D. Bollards Bollards and barricades are often used on the exterior of a facility to prevent access to motorized vehicles and channel people through a specific access location."},{"id":"A28","exam":"A","n":28,"type":"mc","dom":1,"obj":"1.4","objtxt":"SY0-701, Objective 1.4 - Encrypting Data","qparts":[{"k":"p","v":"A company stores some employee information in encrypted form, but other public details are stored as plaintext. Which of the following would BEST describe this encryption strategy?"}],"opts":[{"k":"A","t":"Full-disk"},{"k":"B","t":"Record"},{"k":"C","t":"Asymmetric"},{"k":"D","t":"Key escrow"}],"ans":["B"],"es":"Cifrado a nivel de registro (record-level): se cifran ciertos campos o columnas y otros quedan en texto plano. El cifrado de disco completo protegería todo.","en":"B. Record Record-level encryption is commonly used with databases to encrypt individual columns within the database. This would store some information in the database as plaintext and other information as encrypted data.","enw":"A. Full-disk Full-disk encryption ensures that all data on a storage drive is protected. Full-disk encryption protects all data on the drive, and none of the information would remain as the original plaintext. C. Asymmetric Asymmetric encryption uses a public and private key pair to encrypt data. Asymmetric encryption does not store some information as plaintext and other information as encrypted data. D. Key escrow Key escrow describes the storage and management of decryption keys by a third-party. Key escrow does not determine which data is selected for encryption or the method of encryption."},{"id":"A29","exam":"A","n":29,"type":"mc","dom":3,"obj":"3.4","objtxt":"SY0-701, Objective 3.4 - Backups","qparts":[{"k":"p","v":"A company would like to minimize database corruption if power is lost to a server. Which of the following would be the BEST strategy to follow?"}],"opts":[{"k":"A","t":"Encryption"},{"k":"B","t":"Off-site backups"},{"k":"C","t":"Journaling"},{"k":"D","t":"Replication"}],"ans":["C"],"es":"Journaling: primero se escribe en un diario y luego en la base de datos; si se va la luz, se recupera la última transacción y se evita corrupción. Replicación y respaldos no previenen la corrupción.","en":"C. Journaling Journaling writes data to a temporary journal before writing the information to the database. If power is lost, the system can recover the last transaction from the journal when power is restored.","enw":"A. Encryption Encryption would provide confidentiality of the data, but it would not provide any additional integrity features if power was lost. B. Off-site backups Off-site backups can be used to recover a corrupted database, but this does not minimize or prevent database corruption from occurring. D. Replication Replication is used to create a duplicate copy of data. Although this process does provide a backup, it doesn't add any additional integrity and could still potentially corrupt data if power is lost."},{"id":"A30","exam":"A","n":30,"type":"mc","dom":4,"obj":"4.1","objtxt":"SY0-701, Objective 4.1 - Securing Wireless and Mobile","qparts":[{"k":"p","v":"A company is creating a security policy for corporate mobile devices:"},{"k":"ul","v":["All mobile devices must be automatically locked after a predefined time period.","The location of each device needs to be traceable.","All of the user’s information should be completely separate from company data."]},{"k":"p","v":"Which of the following would be the BEST way to establish these security policy rules?"}],"opts":[{"k":"A","t":"Segmentation"},{"k":"B","t":"Biometrics"},{"k":"C","t":"COPE"},{"k":"D","t":"MDM"}],"ans":["D"],"es":"Un MDM centraliza las políticas de los móviles: bloqueo automático, localización y separación de datos personales y corporativos. COPE es un modelo de propiedad, no una herramienta de políticas.","en":"D. MDM An MDM (Mobile Device Manager) provides a centralized management system for all mobile devices. From this central console, security administrators can set policies for many different types of mobile devices.","enw":"A. Segmentation Segmentation describes the separation of user data from company data, but the implementation all policies is managed by the MDM. B. Biometrics Biometrics can be used as another layer of device security, but you need more than biometrics to implement the required security policies in this question. C. COPE A device that is COPE (Corporately Owned and Personally Enabled) is commonly purchased by the corporation and allows the use of the mobile device for both business and personal use. The use of a COPE device does not provide any policy management of the device."},{"id":"A31","exam":"A","n":31,"type":"mc","dom":4,"obj":"4.3","objtxt":"SY0-701, Objective 4.3 - Analyzing Vulnerabilities","qparts":[{"k":"p","v":"A security engineer runs a monthly vulnerability scan. The scan doesn’t list any vulnerabilities for Windows servers, but a significant vulnerability was announced last week and none of the servers are patched yet. Which of the following best describes this result?"}],"opts":[{"k":"A","t":"Exploit"},{"k":"B","t":"Compensating controls"},{"k":"C","t":"Zero-day attack"},{"k":"D","t":"False negative"}],"ans":["D"],"es":"Falso negativo: el escáner no reportó una vulnerabilidad que sí existe en los servidores.","en":"D. False negative A false negative is a result that fails to detect an issue when one actually exists.","enw":"A. Exploit An exploit is an attack against a vulnerability. Vulnerability scans do not commonly attempt to exploit the vulnerabilities that they identify. B. Compensating controls Compensating controls are used to mitigate a vulnerability when an optimal security response may not be available. For example, if a company can't deploy a patch for a vulnerability, they can revoke or limit application access until a patch is provided. C. Zero-day attack A zero-day attack focuses on previously unknown vulnerabilities. In this example, the vulnerability scan isn’t an attack, and the vulnerabilities are already known and patches are available."},{"id":"A32","exam":"A","n":32,"type":"mc","dom":4,"obj":"4.7","objtxt":"SY0-701, Objective 4.7 - Scripting and Automation","qparts":[{"k":"p","v":"An IT help desk is using automation to improve the response time for security events. Which of the following use cases would apply to this process?"}],"opts":[{"k":"A","t":"Escalation"},{"k":"B","t":"Guard rails"},{"k":"C","t":"Continuous integration"},{"k":"D","t":"Resource provisioning"}],"ans":["A"],"es":"La automatización puede reconocer un evento de seguridad y escalar el ticket al equipo de respuesta sin intervención humana (escalation).","en":"A. Escalation Automation can recognize security events and escalate a security-related ticket to the incident response team without any additional human interaction.","enw":"B. Guard rails Guard rails are used by application developers to provide a set of automated validations to user input and behavior. Guard rails are not used by the help desk team. C. Continuous integration Continuous integration and testing provides an automated method of constantly developing, testing, and deploying code. The continuous integration process is not used by the help desk. D. Resource provisioning Resource provisioning can be automated during the on-boarding and off-boarding process to quickly create or remove rights and permissions. Resource provisioning is not commonly part of the automation associated with security event notification."},{"id":"A33","exam":"A","n":33,"type":"mc","dom":3,"obj":"3.2","objtxt":"SY0-701, Objective 3.2 - Port Security","qparts":[{"k":"p","v":"A network administrator would like each user to authenticate with their corporate username and password when connecting to the company's wireless network. Which of the following should the network administrator configure on the wireless access points?"}],"opts":[{"k":"A","t":"WPA3"},{"k":"B","t":"802.1X"},{"k":"C","t":"PSK"},{"k":"D","t":"MFA"}],"ans":["B"],"es":"802.1X usa un servidor de autenticación central, así que cada usuario entra con sus credenciales corporativas. WPA3 es solo cifrado y PSK es una clave compartida.","en":"B. 802.1X 802.1X uses a centralized authentication server, and this allows all users to use their corporate credentials during the login process.","enw":"A. WPA3 WPA3 (Wi-Fi Protected Access 3) is an encryption protocol for 802.11 wireless networking. The WPA3 encryption itself does not include the centralized authentication process described in this question. C. PSK PSK (Pre-Shared Key) is a wireless configuration option that allows everyone on the network to use the same access key or password when connecting to the wireless network. This question requires each person to use unique authentication credentials. D. MFA MFA (Multifactor Authentication) describes the use of multiple types of authentication checks. A username and password is a single factor (something you know), and the use of MFA does not itself require unique username and password credentials for each user."},{"id":"A34","exam":"A","n":34,"type":"mc","dom":2,"obj":"2.5","objtxt":"SY0-701, Objective 2.5 - Mitigation Techniques","qparts":[{"k":"p","v":"A company's VPN service performs a posture assessment during the login process. Which of the following mitigation techniques would this describe?"}],"opts":[{"k":"A","t":"Encryption"},{"k":"B","t":"Decommissioning"},{"k":"C","t":"Least privilege"},{"k":"D","t":"Configuration enforcement"}],"ans":["D"],"es":"La evaluación de postura (posture assessment) revisa configuración y actualizaciones del equipo antes de dejarlo conectar: configuration enforcement.","en":"D. Configuration enforcement A posture assessment evaluates the configuration of a system to ensure all configurations and applications are up to date and secure as possible. If a configuration does not meet these standards, the user is commonly provided with options for resolving the issue before proceeding.","enw":"A. Encryption Encryption is an important part of a VPN (Virtual Private Network), but the encryption of network data is not related to the posture assessment process. B. Decommissioning It's important to properly manage data during any decommissioning process, but the decommissioning isn't part of the VPN login process. C. Least privilege Least privilege describes the minimum rights and permissions that would allow an individual to perform their job function. Least privilege is not part of a posture assessment."},{"id":"A35","exam":"A","n":35,"type":"mc","dom":4,"obj":"4.6","objtxt":"SY0-701, Objective 4.6 - Access Controls","qparts":[{"k":"p","v":"A user has assigned individual rights and permissions to a file on their network drive. The user adds three additional individuals to have read\u0002only access to the file. Which of the following would describe this access control model?"}],"opts":[{"k":"A","t":"Discretionary"},{"k":"B","t":"Mandatory"},{"k":"C","t":"Attribute-based"},{"k":"D","t":"Role-based"}],"ans":["A"],"es":"Control de acceso discrecional (DAC): el dueño del recurso decide quién tiene acceso y con qué permisos.","en":"A. Discretionary Discretionary access control is used in many operating systems, and this model allows the owner of the resource to control who has access.","enw":"B. Mandatory Mandatory access control allows access based on the security level assigned to an object. Only users with the object’s assigned security level or higher may access the resource. C. Attribute-based Attribute-based access control combines many different parameters to determine if a user has access to a resource. D. Role-based Role-based access control assigns rights and permissions based on the role of a user. These roles are usually assigned by group."},{"id":"A36","exam":"A","n":36,"type":"mc","dom":2,"obj":"2.2","objtxt":"SY0-701, Objective 2.2 - Phishing","qparts":[{"k":"p","v":"A remote user has received a text message with a link to login and confirm their upcoming work schedule. Which of the following would BEST describe this attack?"}],"opts":[{"k":"A","t":"Brute force"},{"k":"B","t":"Watering hole"},{"k":"C","t":"Typosquatting"},{"k":"D","t":"Smishing"}],"ans":["D"],"es":"Smishing es phishing por SMS (mensaje de texto). Watering hole infecta un sitio de terceros y typosquatting usa dominios mal escritos.","en":"D. Smishing Smishing, or SMS (Short Message Service) phishing, is a social engineering attack that asks for sensitive information using SMS or text messages.","enw":"A. Brute force A brute force attack tries multiple password combinations in an effort to identify the correct authentication details. B. Watering hole A watering hole attack will infect a third-party site visited by the victim. Watering hole attacks are not commonly associated with received text messages. C. Typosquatting Typosquatting uses a misspelling of a domain name to convince victims they are visiting a legitimate website. The information provided in this question does not provide any specific domain names or links."},{"id":"A37","exam":"A","n":37,"type":"mc","dom":5,"obj":"5.1","objtxt":"SY0-701, Objective 5.1 - Security Policies","qparts":[{"k":"p","v":"A company is formalizing the design and deployment process used by their application programmers. Which of the following policies would apply?"}],"opts":[{"k":"A","t":"Business continuity"},{"k":"B","t":"Acceptable use policy"},{"k":"C","t":"Incident response"},{"k":"D","t":"Development lifecycle"}],"ans":["D"],"es":"La política de ciclo de vida de desarrollo (SDLC) formaliza el diseño, desarrollo, pruebas y despliegue de aplicaciones.","en":"D. Development lifecycle A formal software development lifecycle defines the specific policies associated with the design, development, testing, deployment, and maintenance of the application development process.","enw":"A. Business continuity Business continuity plans define the procedures used when the primary business systems are unavailable. The business continuity process is not commonly associated with the application development process. B. Acceptable use policy An acceptable use policy formally defines the proper use of company assets and technology devices. C. Incident response Incident response policies define the procedures to follow when a security incident is identified. Incident response is not part of the application development process"},{"id":"A38","exam":"A","n":38,"type":"mc","dom":4,"obj":"4.8","objtxt":"SY0-701, Objective 4.8 - Incident Response","qparts":[{"k":"p","v":"A security administrator has copied a suspected malware executable from a user's computer and is running the program in a sandbox. Which of the following would describe this part of the incident response process?"}],"opts":[{"k":"A","t":"Eradication"},{"k":"B","t":"Preparation"},{"k":"C","t":"Recovery"},{"k":"D","t":"Containment"}],"ans":["D"],"es":"Ejecutar el malware en un sandbox lo aísla y permite analizarlo sin poner en riesgo otros equipos: contención (containment).","en":"D. Containment The isolation and containment process prevents malware from spreading and allows the administrator to analyze the operation of the malware without putting any other devices at risk.","enw":"A. Eradication The eradication phase is associated with completely removing malware from a system. This process usually involves removing all data from a system and installing or re-imaging with a known-good operating system. B. Preparation The preparation process occurs before a security incident is discovered, and it can include the documentation of communication methods, the compiling of mitigation software, or gathering network and application documentation. C. Recovery The recovery phase is associated with the recovery of a system after a security incident. Running malware in a sandbox is not part of the recovery process."},{"id":"A39","exam":"A","n":39,"type":"mc","dom":2,"obj":"2.4","objtxt":"SY0-701, Objective 2.4 - DNS Attacks","qparts":[{"k":"p","v":"A server administrator at a bank has noticed a decrease in the number of visitors to the bank's website. Additional research shows that users are being directed to a different IP address than the bank's web server. Which of the following would MOST likely describe this attack?"}],"opts":[{"k":"A","t":"Deauthentication"},{"k":"B","t":"DDoS"},{"k":"C","t":"Buffer overflow"},{"k":"D","t":"DNS poisoning"}],"ans":["D"],"es":"DNS poisoning: el DNS devuelve una IP distinta a la del banco y dirige a los usuarios a otro sitio. No es una caída del servicio, así que no es DDoS.","en":"D. DNS poisoning A DNS poisoning can modify a DNS server to modify the IP address provided during the name resolution process. If an attacker modifies the DNS information, they can direct client computers to any destination IP address.","enw":"A. Deauthentication Deauthentication attacks are commonly associated with wireless networks. The deauthentication attack is used to remove devices from the wireless network, and it does not commonly redirect clients to a different website. B. DDoS A DDoS (Distributed Denial of Service) is used by attackers to cause services to be unavailable. In this example, the bank's website is operational but clients are not resolving the correct IP address. C. Buffer overflow Buffer overflows are associated with application attacks and can cause applications to crash or act in unexpected ways. A buffer overflow would not commonly redirect clients to a different website IP address."},{"id":"A40","exam":"A","n":40,"type":"mc","dom":3,"obj":"3.1","objtxt":"SY0-701, Objective 3.1 - Cloud Infrastructures","qparts":[{"k":"p","v":"Which of the following considerations are MOST commonly associated with a hybrid cloud model?"}],"opts":[{"k":"A","t":"Microservice outages"},{"k":"B","t":"IoT support"},{"k":"C","t":"Network protection mismatches"},{"k":"D","t":"Containerization backups"}],"ans":["C"],"es":"En una nube híbrida es común que la protección de red y los permisos no coincidan entre proveedores (network protection mismatches).","en":"C. Network protection mismatches A hybrid cloud includes more than one private or public cloud. This adds additional complexity to the overall infrastructure, and it's common to inadvertently apply different authentication options and user permissions across multiple cloud providers.","enw":"A. Microservice outages Microservices are used to create a scalable and resilient application instance. However, the availability of a microservice is not specific to a hybrid cloud model. B. IoT support IoT (Internet of Things) support is available in many cloud infrastructure models, and this would not be specific to a hybrid cloud. D. Containerization backups Containerization provides an efficient method of deploying application instances, but the use and backup of these containers is not specific to a hybrid cloud infrastructure."},{"id":"A41","exam":"A","n":41,"type":"mc","dom":5,"obj":"5.1","objtxt":"SY0-701, Objective 5.1 - Security Procedures","qparts":[{"k":"p","v":"A company hires a large number of seasonal employees, and their system access should normally be disabled when the employee leaves the company. The security administrator would like to verify that their systems cannot be accessed by any of the former employees. Which of the following would be the BEST way to provide this verification?"}],"opts":[{"k":"A","t":"Confirm that no unauthorized accounts have administrator access"},{"k":"B","t":"Validate the account lockout policy"},{"k":"C","t":"Validate the offboarding processes and procedures"},{"k":"D","t":"Create a report that shows all authentications for a 24-hour period"}],"ans":["C"],"es":"La desactivación de cuentas es parte del offboarding. Se valida comparando las cuentas activas con los empleados activos.","en":"C. Validate the offboarding processes and procedures The disabling of an employee account is commonly part of the offboarding process. One way to validate an offboarding policy is to perform an audit of all accounts and compare active accounts with active employees.","enw":"A. Confirm that no unauthorized accounts have administrator access It’s always a good idea to periodically audit administrator accounts, but this audit won’t provide any validation that all former employee accounts have been disabled. B. Validate the account lockout policy Account lockouts occur when a number of invalid authentication attempts have been made to a valid account. Disabled accounts would not be locked out because they are not currently valid accounts. D. Create a report that shows all authentications for a 24-hour period A list of all authentications would be quite large, and it would not be obvious to see which authentications were made with valid accounts and which authentications were made with former employee accounts."},{"id":"A42","exam":"A","n":42,"type":"mc","dom":5,"obj":"5.2","objtxt":"SY0-701, Objective 5.2 - Risk Analysis","qparts":[{"k":"p","v":"Which of the following is used to describe how cautious an organization might be to taking a specific risk?"}],"opts":[{"k":"A","t":"Risk appetite"},{"k":"B","t":"Risk register"},{"k":"C","t":"Risk transfer"},{"k":"D","t":"Risk reporting"}],"ans":["A"],"es":"Risk appetite (apetito de riesgo) describe qué tan cauta o dispuesta a arriesgar es una organización.","en":"A. Risk appetite A risk appetite is a broad description of how much risk-taking is deemed acceptable. An organization's risk appetite posture might be conservative, or they might be more expansionary and willing to take additional risks.","enw":"B. Risk register A risk register identifies and documents the risks associated with each step of a project plan. A risk register is not designed to describe an organization's level of caution associated with each risk. C. Risk transfer Some organizations will transfer their risk to a third-party. For example, many organizations will purchase cybersecurity insurance to minimize the financial impact of a cybersecurity event. D. Risk reporting Risk reporting is the formal process of identifying risk and documenting all details associated with the risk. These reports are commonly designed for the decision making process by the senior management of an organization."},{"id":"A43","exam":"A","n":43,"type":"mc","dom":1,"obj":"1.3","objtxt":"SY0-701, Objective 1.3 - Change Management Process","qparts":[{"k":"p","v":"A technician is applying a series of patches to fifty web servers during a scheduled maintenance window. After patching and rebooting the first server, the web service fails with a critical error. Which of the following should the technician do NEXT?"}],"opts":[{"k":"A","t":"Contact the stakeholders regarding the outage"},{"k":"B","t":"Follow the steps listed in the backout plan"},{"k":"C","t":"Test the upgrade process in the lab"},{"k":"D","t":"Evaluate the impact analysis associated with the change"}],"ans":["B"],"es":"Si el cambio falla, se sigue el backout plan para volver a la configuración anterior. Las pruebas y el análisis de impacto se hicieron antes de la ventana.","en":"B. Follow the steps listed in the backout plan The backout plan associated with the change control process provides information on reverting to the previous configuration if an unrecoverable error is found during the change.","enw":"A. Contact the stakeholders regarding the outage The stakeholders don't commonly require a detailed notification of every step during the maintenance window. The final disposition of the change can be communicated to the stakeholders after the maintenance window has concluded. C. Test the upgrade process in the lab The testing phase of the change control process takes place prior to the maintenance window. Once the maintenance window has started, it's too late to perform any additional tests in the lab. D. Evaluate the impact analysis associated with the change An impact analysis determines the risk for making the proposed change. This analysis is created prior to the change control approval, and it would not be very useful when troubleshooting during the maintenance window."},{"id":"A44","exam":"A","n":44,"type":"mc","dom":2,"obj":"2.4","objtxt":"SY0-701, Objective 2.4 - Denial of Service","qparts":[{"k":"p","v":"An attacker has discovered a way to disable a server by sending specially crafted packets from many remote devices to the operating system. When the packet is received, the system crashes and must be rebooted to restore normal operations. Which of the following would BEST describe this attack?"}],"opts":[{"k":"A","t":"Privilege escalation"},{"k":"B","t":"SQL injection"},{"k":"C","t":"Replay attack"},{"k":"D","t":"DDoS"}],"ans":["D"],"es":"Paquetes maliciosos enviados desde muchos dispositivos que dejan el servidor fuera de servicio: DDoS.","en":"D. DDoS A DDoS (Distributed Denial of Service) is an attack that overwhelms or disables a service to prevent the service from operating normally. Packets from multiple devices that disable a server would be an example of a DDoS attack.","enw":"A. Privilege escalation A privilege escalation attack allows a user to exceed their normal rights and permissions. In this example, user permission escalations were not required to perform this attack. B. SQL injection A SQL (Structured Query Language) injection is used to circumvent an application and communicate directly to the application's database. In this question, there was no mention of application vulnerabilities or specific SQL statements. C. Replay attack A replay attack captures information and then replays that information as the method of attack. In this question, no mention was made of a prior data capture."},{"id":"A45","exam":"A","n":45,"type":"mc","dom":4,"obj":"4.8","objtxt":"SY0-701, Objective 4.8 - Inciden
