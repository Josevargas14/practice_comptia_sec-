t Response","qparts":[{"k":"p","v":"A data breach has occurred in a large insurance company. A security administrator is building new servers and security systems to get all of the financial systems back online. Which part of the incident response process would BEST describe these actions?"}],"opts":[{"k":"A","t":"Lessons learned"},{"k":"B","t":"Containment"},{"k":"C","t":"Recovery"},{"k":"D","t":"Analysis"}],"ans":["C"],"es":"Reconstruir servidores y sistemas para volver a operar es la fase de recuperación (recovery).","en":"C. Recovery The recovery after a breach can be a phased approach that may take months to complete.","enw":"A. Lessons learned Once the event is over, it’s useful to revisit the process to learn and improve for next time. B. Containment During an incident, it’s useful to separate infected systems from the rest of the network. D. Analysis The analysis phase can include the analysis of log files and alerts. These data source can help warn of a potential attack or evidence an attack is underway."},{"id":"A46","exam":"A","n":46,"type":"mc","dom":2,"obj":"2.3","objtxt":"SY0-701, Objective 2.3 - Misconfiguration Vulnerabilities","qparts":[{"k":"p","v":"A network team has installed new access points to support an application launch. In less than 24 hours, the wireless network was attacked and private company information was accessed. Which of the following would be the MOST likely reason for this breach?"}],"opts":[{"k":"A","t":"Race condition"},{"k":"B","t":"Jailbreaking"},{"k":"C","t":"Impersonation"},{"k":"D","t":"Misconfiguration"}],"ans":["D"],"es":"Es casi seguro una mala configuración (misconfiguration): hay muchas opciones al instalar un AP y una pudo abrir la red interna.","en":"D. Misconfiguration There are many different configuration options when installing an access point, and it's likely one of those options allowed an attacker to gain access to the internal network.","enw":"A. Race condition A race condition occurs when two different application processes are executing simultaneously. If the two processes are not aware of each other, the application may have unexpected results. In this example, there's no evidence the access points were experiencing a race condition. B. Jailbreaking Jailbreaking replaces the firmware on a mobile device to gain access to features not normally available in the operating system. Jailbreaking is not commonly associated with wireless access points. C. Impersonation Impersonation is an attacker pretending to be someone or something they are not. In this example, there's no evidence that impersonation was used to breach the wireless network."},{"id":"A47","exam":"A","n":47,"type":"mc","dom":2,"obj":"2.3","objtxt":"SY0-701, Objective 2.3 - Hardware vulnerabilities","qparts":[{"k":"p","v":"An organization has identified a significant vulnerability in an Internet\u0002facing firewall. The firewall company has stated the firewall is no longer available for sale and there are no plans to create a patch for this vulnerability. Which of the following would BEST describe this issue?"}],"opts":[{"k":"A","t":"End-of-life"},{"k":"B","t":"Improper input handling"},{"k":"C","t":"Improper key management"},{"k":"D","t":"Incompatible OS"}],"ans":["A"],"es":"Cuando el fabricante ya no vende ni parcha el producto, está en end-of-life (fin de vida).","en":"A. End-of-life Because the firewall is no longer available for sale, the firewall company has decided to stop supporting and updating the device. A product no longer supported by the manufacturer is consider to be end-of-life.","enw":"B. Improper input handling A best practice for application security is to provide the proper handling of invalid or unnecessary input. A missing patch for the firewall firmware would not be related to input handling. C. Improper key management Cryptographic keys can be used for many security purposes, but managing those keys isn’t part of the patching process from a vendor. D. Incompatible OS The operating system in the firewall would normally be supported by the manufacturer, and the operating systems are not commonly modified on a purpose-built device such as a firewall."},{"id":"A48","exam":"A","n":48,"type":"mc","dom":3,"obj":"3.4","objtxt":"SY0-701, Objective 3.4 - Recovery Testing","qparts":[{"k":"p","v":"A company has decided to perform a disaster recovery exercise during an annual meeting with the IT directors and senior directors. A simulated disaster will be presented, and the participants will discuss the logistics and processes required to resolve the disaster. Which of the following would BEST describe this exercise?"}],"opts":[{"k":"A","t":"Capacity planning"},{"k":"B","t":"Business impact analysis"},{"k":"C","t":"Continuity of operations"},{"k":"D","t":"Tabletop exercise"}],"ans":["D"],"es":"Tabletop exercise: el equipo discute un desastre simulado en una reunión, sin ejecutar acciones reales.","en":"D. Tabletop exercise A tabletop exercise allows a disaster recovery team to evaluate and plan disaster recovery processes without performing a full-scale drill.","enw":"A. Capacity planning Capacity planning is used to determine how many resources would be required for a particular task. A formal tabletop exercise would not commonly include a capacity planning analysis. B. Business impact analysis A business impact analysis is usually created during the disaster recovery planning process. Once the disaster has occurred, it becomes much more difficult to complete an accurate impact analysis. C. Continuity of operations If an outage occurs, it's common to have a backup plan to provide continuity of operations. This plan can be used for any significant outage and is not specific to disaster recovery testing."},{"id":"A49","exam":"A","n":49,"type":"mc","dom":4,"obj":"4.5","objtxt":"SY0-701, Objective 4.5 - Web Filtering","qparts":[{"k":"p","v":"A security administrator needs to block users from visiting websites hosting malicious software. Which of the following would be the BEST way to control this access?"}],"opts":[{"k":"A","t":"Honeynet"},{"k":"B","t":"Data masking"},{"k":"C","t":"DNS filtering"},{"k":"D","t":"Data loss prevention"}],"ans":["C"],"es":"El filtrado DNS (DNS filtering) usa una base de sitios maliciosos y hace fallar la resolución de esos nombres.","en":"C. DNS filtering DNS filtering uses a database of known malicious websites to resolve an incorrect or null IP address. If a user attempts to visit a known malicious site, the DNS resolution will fail and the user will not be able to visit the website.","enw":"A. Honeynet A honeynet is a non-production network created to attract attackers. A honeynet is not used to block traffic to known malicious Internet sites. B. Data masking Data masking provides a way to hide data by substitution, shuffling, encryption, and other methods. Data masking does not provide a method of blocking communication to malicious websites. D. Data loss prevention Data Loss Prevention (DLP) systems can identify and block private information from being transferred between systems. DLP does not provide any direct method of blocking network traffic to known malware repositories."},{"id":"A50","exam":"A","n":50,"type":"mc","dom":4,"obj":"4.8","objtxt":"SY0-701, Objective 4.8 - Incident Response","qparts":[{"k":"p","v":"A system administrator has been called to a system with a malware infection. As part of the incident response process, the administrator has imaged the operating system to a known-good version. Which of these incident response steps is the administrator following?"}],"opts":[{"k":"A","t":"Lessons learned"},{"k":"B","t":"Recovery"},{"k":"C","t":"Detection"},{"k":"D","t":"Containment"}],"ans":["B"],"es":"Reinstalar una imagen conocida y limpia del sistema operativo es recuperación (recovery).","en":"B. Recovery The recovery phase describes the process of returning the system and data to the state prior to the malware infection. With a malware infection, this often requires deleting all data and reinstalling a known-good operating system.","enw":"A. Lessons learned A post-incident meeting can help the incident response participants discuss the phases of the incident that went well and which processes can be improved for future events. C. Detection The detection of the malware is an early phase in the incident response process. If the administrator is imaging a system, the malware was previously detected and any critical documents were already recovered. D. Containment The containment phase isolates the system from any other devices to prevent the spread of any malicious software. The containment phase generally occurs immediately after"},{"id":"A51","exam":"A","n":51,"type":"mc","dom":4,"obj":"4.1","objtxt":"SY0-701, Objective 4.1 - Hardening Targets","qparts":[{"k":"p","v":"A company has placed a SCADA system on a segmented network with limited access from the rest of the corporate network. Which of the following would describe this process?"}],"opts":[{"k":"A","t":"Load balancing"},{"k":"B","t":"Least privilege"},{"k":"C","t":"Data retention"},{"k":"D","t":"Hardening"}],"ans":["D"],"es":"Segmentar la red y limitar el acceso a un SCADA es una técnica de hardening (endurecimiento).","en":"D. Hardening The hardening process for an industrial SCADA (Supervisory Control and Data Acquisition) system might include network segmentation, additional firewall controls, and the implementation of access control lists.","enw":"A. Load balancing A load balancer is used to distribute transactions across multiple systems. A single system was the only device referenced in this question, so a load balancing option would not be available. B. Least privilege Least privilege defines the minimum rights and permissions for completing a specific task. In this example, there was no mention of specific tasks or their necessary permissions. C. Data retention Data retention is important for long-term storage of important information. In this example, the mandated storage of data was not a consideration."},{"id":"A52","exam":"A","n":52,"type":"mc","dom":4,"obj":"4.9","objtxt":"SY0-701, Objective 4.9 - Log data","qparts":[{"k":"p","v":"An administrator is viewing the following security log:"},{"k":"code","v":"Dec 30 08:40:03 web01 Failed password for root\nfrom 10.101.88.230 port 26244 ssh2\nDec 30 08:40:05 web01 Failed password for root\nfrom 10.101.88.230 port 26244 ssh2\nDec 30 08:40:09 web01 445 more authentication\nfailures; rhost=10.101.88.230 user=root"},{"k":"p","v":"Which of the following would describe this attack?"}],"opts":[{"k":"A","t":"Spraying"},{"k":"B","t":"Downgrade"},{"k":"C","t":"Brute force"},{"k":"D","t":"DDoS"}],"ans":["C"],"es":"Fuerza bruta: cientos de intentos fallidos contra root desde una sola IP. El spraying usa pocos intentos por cuenta para evitar bloqueos.","en":"C. Brute force A brute force attack discovers password by attempting a large combination of letters, numbers, and special characters until a match is found. In this example, the notification of over four hundred attempts would qualify as a brute force attack.","enw":"A. Spraying A spraying attack is similar to a brute force attack, but spraying limits the number of attempts to prevent alerts or an account lockout. A spraying attack often uses accounts passwords stolen from other sites or a short list of the most common passwords. B. Downgrade A downgrade attack is often used to force an insecure encryption algorithm or the disabling of encryption entirely. In this example, no evidence of a downgrade attack is contained in the security log. D. DDoS A DDoS (Distributed Denial of Service) would involve many different devices to cause a system outage. In this example, a single IP address was logged and there was no evidence of a service outage."},{"id":"A53","exam":"A","n":53,"type":"mc","dom":2,"obj":"2.5","objtxt":"SY0-701, Objective 2.5 - Mitigation Techniques","qparts":[{"k":"p","v":"During a morning login process, a user's laptop was moved to a private VLAN and a series of updates were automatically installed. Which of the following would describe this process?"}],"opts":[{"k":"A","t":"Account lockout"},{"k":"B","t":"Configuration enforcement"},{"k":"C","t":"Decommissioning"},{"k":"D","t":"Sideloading"}],"ans":["B"],"es":"Mover el equipo a una VLAN privada e instalar actualizaciones tras revisar su postura es configuration enforcement.","en":"B. Configuration enforcement Many organizations will perform a posture assessment during the login process to verify the proper security controls are in place. If the device does not pass the assessment, the system can be quarantined and any missing security updates can then be installed.","enw":"A. Account lockout In this example, there were no errors or notifications regarding the account or authentication status. C. Decommissioning The decommissioning process is often used to permanently remove devices from the network. In this example, the laptop mitigation would allow the device to return to the network once the updates were complete. D. Sideloading Sideloading describes the installation of software on a mobile device through the use of third-party operating systems or websites."},{"id":"A54","exam":"A","n":54,"type":"mc","dom":4,"obj":"4.6","objtxt":"SY0-701, Objective 4.6 - Multi-factor Authentication","qparts":[{"k":"p","v":"Which of the following describes two-factor authentication?"}],"opts":[{"k":"A","t":"A printer uses a password and a PIN"},{"k":"B","t":"The door to a building requires a fingerprint scan"},{"k":"C","t":"An application requires a pseudo-random code"},{"k":"D","t":"A Windows Domain requires a password and smart card"}],"ans":["D"],"es":"Contraseña (algo que sabes) más smart card (algo que tienes) son dos factores. Contraseña y PIN son ambos algo que sabes.","en":"D. A Windows Domain requires a password and smart card The multiple factors of authentication for this Windows Domain are a password (something you know), and a smart card (something you have).","enw":"A. A printer uses a password and a PIN A password and a PIN (Personal Identification Number) are both something you know, so only one authentication factor is used. B. The door to a building requires a fingerprint scan A biometric scan (something you are) is a single factor of authentication. C. An application requires a pseudo-random code Pseudo-random authentication codes are often provided using a hardware dongle or mobile app. This single factor of authentication is something you have."},{"id":"A55","exam":"A","n":55,"type":"mc","dom":4,"obj":"4.1","objtxt":"SY0-701, Objective 4.1 - Securing Wireless and Mobile","qparts":[{"k":"p","v":"A company is deploying a new application to all employees in the field. Some of the problems associated with this roll out include:"},{"k":"ul","v":["The company does not have a way to manage the devices in the field","Team members have many different kinds of mobile devices","The same device needs to be used for both corporate and private use"]},{"k":"p","v":"Which of the following deployment models would address these concerns?"}],"opts":[{"k":"A","t":"CYOD"},{"k":"B","t":"SSO"},{"k":"C","t":"COPE"},{"k":"D","t":"BYOD"}],"ans":["C"],"es":"COPE (Corporate-owned, Personally Enabled): dispositivos estandarizados, administrables y con uso personal permitido.","en":"C. COPE A COPE (Corporate-owned, Personally Enabled) device would solve the issue of device standardization and would allow the device to be used for both corporate access and personal use.","enw":"A. CYOD CYOD (Choose Your Own Device) allows the user to pick the make and model of their device. This would not solve the issue of different kinds of mobile devices used in the field. B. SSO SSO (Single Sign-On) is used to authenticate once when accessing multiple resources. SSO would not resolve any of the listed issues. D. BYOD With BYOD (Bring Your Own Device), the employee uses their personal device at work. This would not address the issue of mobile device management or standardization of mobile devices."},{"id":"A56","exam":"A","n":56,"type":"mc","dom":1,"obj":"1.1","objtxt":"SY0-701, Objective 1.1 - Security Controls","qparts":[{"k":"p","v":"An organization is installing a UPS for their new data center. Which of the following would BEST describe this control type?"}],"opts":[{"k":"A","t":"Compensating"},{"k":"B","t":"Directive"},{"k":"C","t":"Deterrent"},{"k":"D","t":"Detective"}],"ans":["A"],"es":"Un UPS no evita el corte de energía, pero da energía alterna: control compensatorio (compensating).","en":"A. Compensating A compensating security control doesn’t prevent an attack, but it does restore from an attack using other means. In this example, the UPS (Uninterruptible Power Supply) does not stop a power outage, but it does provide alternative power if an outage occurs.","enw":"B. Directive A directive control provides security controls using instructions and guidance. A UPS is not categorized as a directive control. C. Deterrent A deterrent control discourages an intrusion attempt. A UPS is used after power has been lost, so it would not be categorized as a deterrent. D. Detective A detective control may not prevent access, but it can identify and record intrusion attempts."},{"id":"A57","exam":"A","n":57,"type":"mc","dom":1,"obj":"1.4","objtxt":"SY0-701, Objective 1.4 - Blockchain Technology","qparts":[{"k":"p","v":"A manufacturing company would like to track the progress of parts used on an assembly line. Which of the following technologies would be the BEST choice for this task?"}],"opts":[{"k":"A","t":"Secure enclave"},{"k":"B","t":"Blockchain"},{"k":"C","t":"Hashing"},{"k":"D","t":"Asymmetric encryption"}],"ans":["B"],"es":"Blockchain funciona como libro mayor para rastrear componentes o piezas a lo largo de un proceso.","en":"B. Blockchain The ledger functionality of a blockchain can be used to track or verify components, digital media, votes, and other physical or digital objects.","enw":"A. Secure enclave A secure enclave is a protected area for secret information, and the secure enclave is often implemented as a hardware processor in a device. C. Hashing Cryptographic hashes are commonly used to provide integrity verifications, but they don't necessarily include any method of tracking components on an assembly line. D. Asymmetric encryption Asymmetric encryption uses different keys for encryption and decryption. Asymmetric encryption does not provide any method for tracking objects on an assembly line."},{"id":"A58","exam":"A","n":58,"type":"mc","dom":2,"obj":"2.1","objtxt":"SY0-701, Objective 2.1 - Threat Actors","qparts":[{"k":"p","v":"A company's website has been compromised and the website content has been replaced with a political message. Which of the following threat actors would be the MOST likely culprit?"}],"opts":[{"k":"A","t":"Insider"},{"k":"B","t":"Organized crime"},{"k":"C","t":"Shadow IT"},{"k":"D","t":"Hacktivist"}],"ans":["D"],"es":"Cambiar el contenido de un sitio por un mensaje político es típico de un hacktivista.","en":"D. Hacktivist A hacktivist is motivated by a particular philosophy, and their goal is to spread their message by defacing web sites and releasing private documents.","enw":"A. Insider An insider has access to many company services, but the motivations of an insider threat would not commonly result in the posting of political information. B. Organized crime Organized crime actors are motivated by money. It would be unusual for an organized crime hack to include the posting of political messages. C. Shadow IT A shadow IT group is mostly interested in building their own systems and applications, and they would not commonly deface a website in an attempt to spread a specific political message."},{"id":"A59","exam":"A","n":59,"type":"mc","dom":3,"obj":"3.3","objtxt":"SY0-701, Objective 3.3 - Protecting Data","qparts":[{"k":"p","v":"A Linux administrator is downloading an updated version of her Linux distribution. The download site shows a link to the ISO and a SHA256 hash value. Which of these would describe the use of this hash value?"}],"opts":[{"k":"A","t":"Verifies that the file was not corrupted during the file transfer"},{"k":"B","t":"Provides a key for decrypting the ISO after download"},{"k":"C","t":"Authenticates the site as an official ISO distribution site"},{"k":"D","t":"Confirms that the file does not contain any malware"}],"ans":["A"],"es":"El hash SHA256 se compara con el del archivo descargado para verificar que no se corrompió en la transferencia. No cifra ni garantiza ausencia de malware.","en":"A. Verifies that the file was not corrupted during the file transfer Once the file is downloaded, the administrator can calculate the file’s SHA256 hash and confirm that it matches the value on the website.","enw":"B. Provides a key for decrypting the ISO after download ISO files containing public information are usually distributed without any encryption, and a hash value would not commonly be used as a decryption key. C. Authenticates the site as an official ISO distribution site Although it’s important to download files from known good sites, providing a hash value on a site would not provide any information about the site’s authentication. D. Confirms that the file does not contain any malware A hash value doesn’t inherently provide any protection against malware."},{"id":"A60","exam":"A","n":60,"type":"mc","dom":3,"obj":"3.3","objtxt":"SY0-701, Objective 3.3 - Protecting Data","qparts":[{"k":"p","v":"A company's security policy requires that login access should only be available if a person is physically within the same building as the server. Which of the following would be the BEST way to provide this requirement?"}],"opts":[{"k":"A","t":"USB security key"},{"k":"B","t":"Biometric scanner"},{"k":"C","t":"PIN"},{"k":"D","t":"SMS"}],"ans":["B"],"es":"Un lector biométrico exige que la persona esté físicamente presente. PIN, SMS o llave USB no garantizan ubicación.","en":"B. Biometric scanner A biometric scanner would require a person to be physically present to verify the authentication.","enw":"A. USB security key A security key can be used to store a certificate on a USB (Universal Serial Bus) drive. The security key is commonly used as an authentication method for a user or application, and it doesn't provide any information about the location of the security key. C. PIN Although a PIN (Personal Identification Number) can be used as an authentication factor, the use of the PIN does not guarantee that a person is physically present. D. SMS SMS (Short Message Service), or text messages, are commonly used as authentication factors. However, the use of a mobile device to receive the SMS message does not guarantee that the owner of the mobile device is physically present."},{"id":"A61","exam":"A","n":61,"type":"mc","dom":3,"obj":"3.3","objtxt":"SY0-701, Objective 3.3 - Protecting Data","qparts":[{"k":"p","v":"A development team has installed a new application and database to a cloud service. After running a vulnerability scanner on the application instance, a security administrator finds the database is available for anyone to query without providing any authentication. Which of these vulnerabilities is MOST associated with this issue?"}],"opts":[{"k":"A","t":"Legacy software"},{"k":"B","t":"Open permissions"},{"k":"C","t":"Race condition"},{"k":"D","t":"Malicious update"}],"ans":["B"],"es":"Permisos abiertos (open permissions): la base de datos en la nube quedó accesible sin autenticación.","en":"B. Open permissions Just like local systems, proper permissions and security controls are required when applications are installed to a cloud-based system. If permissions are not properly configured, the application data may be accessible by anyone on the Internet.","enw":"A. Legacy software Legacy software often describes an older application with limited support options. The application and database in this example is a new installation and would not normally be categorized as legacy. C. Race condition If two processes occur simultaneously without coordination between the processes, unexpected results could occur. In this example, a single vulnerability scan has identified the issue and other processes do not appear to be involved. D. Malicious update A malicious update involves the installation of unwanted software during a normal update process. In this example, an update was not performed and the resulting public access would not generally be part of a malicious update."},{"id":"A62","exam":"A","n":62,"type":"mc","dom":5,"obj":"5.6","objtxt":"SY0-701, Objective 5.6 - Security Awareness","qparts":[{"k":"p","v":"Employees of an organization have received an email with a link offering a cash bonus for completing an internal training course. Which of the following would BEST describe this email?"}],"opts":[{"k":"A","t":"Watering hole attack"},{"k":"B","t":"Cross-site scripting"},{"k":"C","t":"Zero-day"},{"k":"D","t":"Phishing campaign"}],"ans":["D"],"es":"Un correo interno con un enlace que ofrece un bono es típico de una campaña de phishing simulada de concientización.","en":"D. Phishing campaign A phishing campaign is an internal process used to test the security habits of the user community. An email with a link from a server not under the control of the company could be an email sent by the IT department as part of a phishing campaign.","enw":"A. Watering hole attack A watering hole attack is used as an alternative to attacking a victim's device directly. With a watering hole attack, an attacker will compromise a site used by the victim and will simply wait for the victim to visit. B. Cross-site scripting Cross-site scripting takes advantage of the trust already existing in a web browser. In this example, there's no evidence of a vulnerable web application or a specific browser-based vulnerability. C. Zero-day A zero-day attack describes a vulnerability where a software patch or similar mitigation is not immediately available. A link in an email by itself does not describe a zero-day attack."},{"id":"A63","exam":"A","n":63,"type":"mc","dom":3,"obj":"3.2","objtxt":"SY0-701, Objective 3.2 - Firewall Types","qparts":[{"k":"p","v":"Which of the following risk management strategies would include the purchase and installation of an NGFW?"}],"opts":[{"k":"A","t":"Transfer"},{"k":"B","t":"Mitigate"},{"k":"C","t":"Accept"},{"k":"D","t":"Avoid"}],"ans":["B"],"es":"Comprar e instalar un NGFW reduce el riesgo: estrategia de mitigación (mitigate).","en":"B. Mitigate Mitigation is a strategy that decreases the threat level. This is commonly done through the use of additional security systems and monitoring, such as an NGFW (Next-Generation Firewall).","enw":"A. Transfer Transferring risk would move the risk from one entity to another. Adding an NGFW would not transfer any risk to another party. C. Accept The acceptance of risk is a position where the owner understands the risk and has decided to accept the potential results. D. Avoidance With risk avoidance, the owner of the risk decides to stop participating in a high-risk activity. This effectively avoids the risky activity and prevents any future issues."},{"id":"A64","exam":"A","n":64,"type":"mc","dom":1,"obj":"1.2","objtxt":"SY0-701, Objective 1.2 - Zero Trust","qparts":[{"k":"p","v":"An organization is implementing a security model where all application requests must be validated at a policy enforcement point. Which of the following would BEST describe this model?"}],"opts":[{"k":"A","t":"Public key infrastructure"},{"k":"B","t":"Zero trust"},{"k":"C","t":"Discretionary access control"},{"k":"D","t":"Federation"}],"ans":["B"],"es":"Zero trust: nada es confiable por defecto y cada solicitud se valida en un policy enforcement point.","en":"B. Zero trust Zero trust describes a model where nothing is inherently trusted and everything must be verified to gain access. A central policy enforcement point is commonly used to implement a zero trust architecture.","enw":"A. Public key infrastructure A public key infrastructure (PKI) uses public and private keys to provide confidentiality and integrity. Asymmetric encryption and digital signatures are used as foundational technologies in PKI. C. Discretionary access control. Discretionary access control is an authorization method where the owner of the data determines the scope and type of access. A discretionary access control model does not specifically define how the authorization is implemented. D. Federation Federation provides a way to manage authentication to a third-party database. Federation does not describe the use of a policy enforcement point."},{"id":"A65","exam":"A","n":65,"type":"mc","dom":3,"obj":"3.1","objtxt":"SY0-701, Objective 3.1 - Cloud Infrastructures","qparts":[{"k":"p","v":"A company is installing a new application in a public cloud. Which of the following determines the assignment of data security in this cloud infrastructure?"}],"opts":[{"k":"A","t":"Playbook"},{"k":"B","t":"Audit committee"},{"k":"C","t":"Responsibility matrix"},{"k":"D","t":"Right-to-audit clause"}],"ans":["C"],"es":"La matriz de responsabilidades (responsibility matrix) del proveedor define qué protege el proveedor y qué protege el cliente.","en":"C. Responsibility matrix A cloud responsibility matrix is usually published by the provider to document the responsibilities for all cloud-based services. For example, the customer responsibilities for an IaaS (Infrastructure as a Service) implementation will be different than SaaS (Software as a Service).","enw":"A. Playbook A playbook provides conditional steps to follow when managing an organization's processes and procedures. For example, the process of recovering from a virus infection would be documented in a playbook. B. Audit committee An audit committee oversees the risk management activities for an organization. For example, the committee would be responsible for verifying the security implementation documented in the responsibility matrix. D. Right-to-audit clause A right-to-audit clause is often included in a third-party contract to define the terms and conditions around periodic audits. This is often part of a larger product or services contract."},{"id":"A66","exam":"A","n":66,"type":"mc","dom":4,"obj":"4.2","objtxt":"SY0-701, Objective 4.2 - Asset Management","qparts":[{"k":"p","v":"When decommissioning a device, a company documents the type and size of storage drive, the amount of RAM, and any installed adapter cards. Which of the following describes this process?"}],"opts":[{"k":"A","t":"Destruction"},{"k":"B","t":"Sanitization"},{"k":"C","t":"Certification"},{"k":"D","t":"Enumeration"}],"ans":["D"],"es":"Enumeration es listar en detalle los componentes del equipo (discos, RAM, tarjetas).","en":"D. Enumeration Enumeration describes the detailed listing of all parts in a particular device. For a computer, this could include the CPU type, memory, storage drive details, keyboard model, and more.","enw":"A. Destruction Destruction involves physically damaging a device or component to prevent any future use or data access. Although the company may choose to destroy these computers at a later date, this question does not describe the destruction process. B. Sanitization Sanitization deletes data from storage media and allows the storage device to be used in the future. For example, a sector-by-sector format would sanitize a hard drive and allow the drive to be installed into another computer without the concern of a data breach. C. Certification If a third-party is providing destruction services, they often will certify the work and document which device serial numbers were destroyed as part of their service."},{"id":"A67","exam":"A","n":67,"type":"mc","dom":2,"obj":"2.3","objtxt":"SY0-701, Objective 2.3 - Buffer Overflows","qparts":[{"k":"p","v":"An attacker has sent more information than expected in a single API call, and this has allowed the execution of arbitrary code. Which of the following would BEST describe this attack?"}],"opts":[{"k":"A","t":"Buffer overflow"},{"k":"B","t":"Replay attack"},{"k":"C","t":"Cross-site scripting"},{"k":"D","t":"DDoS"}],"ans":["A"],"es":"Enviar más datos de los esperados para ejecutar código es un buffer overflow.","en":"A. Buffer overflow The results of a buffer overflow can cause random results, but sometimes the actions can be repeatable and controlled. In the best possible case for the hacker, a buffer overflow can be manipulated to execute code on the remote device.","enw":"B. Replay attack A replay attack does not require the sending of more information than expected, and often a replay attack consists of normal traffic and expected application input. C. Cross-site scripting A cross-site scripting attack allows a third party to take advantage of the trust a browser might have with another website. This question involves an API call and does not appear to reference a browser or third-party website. D. DDoS A DDoS (Distributed Denial of Service) renders a service unavailable, and it involves the input of many devices to operate. A DDoS would not require sending more information than expected, and it rarely results in the execution of arbitrary code."},{"id":"A68","exam":"A","n":68,"type":"mc","dom":1,"obj":"1.4","objtxt":"SY0-701, Objective 1.4 - Public Key Infrastructure","qparts":[{"k":"p","v":"A company encourages users to encrypt all of their confidential materials on a central server. The organization would like to enable key escrow as a backup option. Which of these keys should the organization place into escrow?"}],"opts":[{"k":"A","t":"Private"},{"k":"B","t":"CA"},{"k":"C","t":"Session"},{"k":"D","t":"Public"}],"ans":["A"],"es":"Se deposita en escrow la clave privada, porque es la que permite descifrar. La clave pública ya es de conocimiento general.","en":"A. Private With asymmetric encryption, the private key is used to decrypt information that has been encrypted with the public key. To ensure continued access to the encrypted data, the company must have a copy of each private key.","enw":"B. CA A CA (Certificate Authority) key is commonly used to validate the digital signature from a trusted CA. This is not commonly used for user data encryption. C. Session Session keys are commonly used temporarily to provide confidentiality during a single session. Once the session is complete, the keys are discarded. Session keys are not used to provide long-term data encryption. D. Public In asymmetric encryption, a public key is already available to everyone. It would not be necessary to escrow a public key."},{"id":"A69","exam":"A","n":69,"type":"mc","dom":2,"obj":"2.2","objtxt":"SY0-701, Objective 2.2 - Common Threat Vectors","qparts":[{"k":"p","v":"A company is in the process of configuring and enabling host-based firewalls on all user devices. Which of the following threats is the company addressing?"}],"opts":[{"k":"A","t":"Default credentials"},{"k":"B","t":"Vishing"},{"k":"C","t":"Instant messaging"},{"k":"D","t":"On-path"}],"ans":["C"],"es":"Un firewall de host ayuda a protegerse contra vectores como enlaces maliciosos por mensajería instantánea. No detecta vishing ni credenciales por defecto.","en":"C. Instant messaging Instant messaging is commonly used as an attack vector, and one way to help protect against malicious links delivered by instant messaging is a host-based firewall.","enw":"A. Default credentials Users commonly login with unique credentials that are specific to the user. A host-based firewall would not identify the use of a default username and password. B. Vishing Vishing, or voice phishing, occurs over a phone or other voice communication method. A host-based firewall would not be able to protect against a voice-related attack vector. D. On-path A on-path attack describes a third-party in the middle of a communications path. The victims of an on-path attack are usually not aware an attack is taking place, so a host-based firewall would not be able to detect an on-path attack."},{"id":"A70","exam":"A","n":70,"type":"mc","dom":2,"obj":"2.5","objtxt":"SY0-701, Objective 2.5 - Segmentation and Access Control","qparts":[{"k":"p","v":"A manufacturing company would like to use an existing router to separate a corporate network from a manufacturing floor. Both networks use the same physical switch, and the company does not want to install any additional hardware. Which of the following would be the BEST choice for this segmentation?"}],"opts":[{"k":"A","t":"Connect the corporate network and the manufacturing floor with a VPN"},{"k":"B","t":"Build an air gapped manufacturing floor network"},{"k":"C","t":"Use host-based firewalls on each device"},{"k":"D","t":"Create separate VLANs for the corporate network and the manufacturing floor"}],"ans":["D"],"es":"Las VLAN segmentan la red en el mismo switch, usando el router existente y sin hardware adicional.","en":"D. Create separate VLANs for the corporate network and the manufacturing floor Creating VLANs (Virtual Local Area Networks) will segment a network without requiring additional switches.","enw":"A. Connect the corporate network and the manufacturing floor with a VPN A VPN (Virtual Private Network) would encrypt all information between the two networks, but it would not provide any segmentation. This process would also commonly require additional hardware to provide VPN connectivity. B. Build an air gapped manufacturing floor network An air gapped network would require separate physical switches on each side of the gap, and this would require the purchase of an additional switch. C. Use host-based firewalls on each device While personal firewalls provide protection for individual devices, they do not segment networks. It’s also uncommon for personal firewalls to be installed on manufacturing equipment."},{"id":"A71","exam":"A","n":71,"type":"mc","dom":3,"obj":"3.2","objtxt":"SY0-701, Objective 3.2 - Secure Communication","qparts":[{"k":"p","v":"An organization needs to provide a remote access solution for a newly deployed cloud-based application. This application is designed to be used by mobile field service technicians. Which of the following would be the best option for this requirement?"}],"opts":[{"k":"A","t":"RTOS"},{"k":"B","t":"CRL"},{"k":"C","t":"Zero-trust"},{"k":"D","t":"SASE"}],"ans":["D"],"es":"SASE (Secure Access Service Edge) es una VPN de nueva generación optimizada para acceso seguro a aplicaciones en la nube.","en":"D. SASE A SASE (Secure Access Service Edge) solution is a next-generation VPN technology designed to optimize the process of secure communication to cloud services.","enw":"A. RTOS An RTOS (Real-time Operating System) is an OS designed for industrial equipment, automobiles, and other time-sensitive applications. B. CRL A CRL (Certificate Revocation List) is used to determine if a certificate has been administratively revoked. A CRL would not provide any remote access functionality. C. Zero-trust Zero-trust is a security strategy where all devices on the network are verified before connecting to another device. Zero-trust does not provide remote access functions."},{"id":"A72","exam":"A","n":72,"type":"mc","dom":5,"obj":"5.6","objtxt":"SY0-701, Objective 5.6 - Security Awareness","qparts":[{"k":"p","v":"A company is implementing a quarterly security awareness campaign. Which of the following would MOST likely be part of this campaign?"}],"opts":[{"k":"A","t":"Suspicious message reports from users"},{"k":"B","t":"An itemized statement of work"},{"k":"C","t":"An IaC configuration file"},{"k":"D","t":"An acceptable use policy document"}],"ans":["A"],"es":"Una campaña de concientización incluye phishing simulado y un proceso para que los usuarios reporten mensajes sospechosos.","en":"A. Suspicious message reports from users A security awareness campaign often involves automated phishing attempts, and most campaigns will include a process for users to report a suspected phishing attempt to the IT security team.","enw":"B. An itemized statement of work A statement of work (SOW) is commonly used for service engagements. The SOW provides a list of deliverables for the professional services, and this list is often used to determine if the services were completed. C. An IaC configuration file An IaC (Infrastructure as Code) configuration file describes an infrastructure configuration commonly used by cloud-based systems. An IaC configuration file would not be used by a security awareness campaign. D. An acceptable use policy document An acceptable use policy (AUP) is defined by an employer to describe the proper use of technology and systems within an organization. The AUP itself is not part of a security awareness campaign."},{"id":"A73","exam":"A","n":73,"type":"mc","dom":1,"obj":"1.3","objtxt":"SY0-701, Objective 1.3 - Change Management Process","qparts":[{"k":"p","v":"A recent report shows the return of a vulnerability that was previously patched four months ago. After researching this issue, the security team has found a recent patch has reintroduced this vulnerability on the servers. Which of the following should the security administrator implement to prevent this issue from occurring in the future?"}],"opts":[{"k":"A","t":"Containerization"},{"k":"B","t":"Data masking"},{"k":"C","t":"802.1X"},{"k":"D","t":"Change management"}],"ans":["D"],"es":"Change management incluye fase de pruebas que habría detectado que el parche reintroducía la vulnerabilidad.","en":"D. Change management The change management process includes a testing phase that can help identify potential issues relating to an application change or upgrade.","enw":"A. Containerization Containerization is an efficient method of deploying application instances, but it doesn't provide any mitigation for security vulnerabilities. B. Data masking Data masking can be used to limit access to sensitive data, but it does not prevent the implementation of a security vulnerability. C. 802.1X 802.1X is a standard for port-based network access control, and it can help manage the authentication process of network users. 802.1X does not provide any mitigation for security vulnerabilities."},{"id":"A74","exam":"A","n":74,"type":"mc","dom":1,"obj":"1.4","objtxt":"SY0-701, Objective 1.4 - Hashing and Digital Signatures","qparts":[{"k":"p","v":"A security manager would like to ensure that unique hashes are used with an application login process. Which of the following would be the BEST way to add random data when generating a set of stored password hashes?"}],"opts":[{"k":"A","t":"Salting"},{"k":"B","t":"Obfuscation"},{"k":"C","t":"Key stretching"},{"k":"D","t":"Digital signature"}],"ans":["A"],"es":"Salting agrega datos aleatorios antes del hash, de modo que cada hash sea único aunque dos usuarios tengan la misma contraseña.","en":"A. Salting Adding random data, or salt, to a password when performing the hashing process will create a unique hash, even if other users have chosen the same password.","enw":"B. Obfuscation Obfuscation is the process of making something difficult for humans to read or understand. The obfuscation process isn't commonly associated with adding random information to hashes. C. Key stretching Key stretching uses a cryptographic key multiple times for additional protection against brute force attacks. Key stretching by itself does not commonly add random data to the hashing process. D. Digital signature Digital signatures use a hash and asymmetric encryption to provide integrity of data. Digital signatures aren't commonly used for storing passwords."},{"id":"A75","exam":"A","n":75,"type":"mc","dom":1,"obj":"1.4","objtxt":"SY0-701, Objective 1.4 - Hashing and Digital Signatures","qparts":[{"k":"p","v":"Which cryptographic method is used to add trust to a digital certificate?"}],"opts":[{"k":"A","t":"Steganography"},{"k":"B","t":"Hash"},{"k":"C","t":"Symmetric encryption"},{"k":"D","t":"Digital signature"}],"ans":["D"],"es":"La CA firma digitalmente el certificado para darle confianza: si confías en la CA, confías en el certificado.","en":"D. Digital signature A certificate authority will digitally sign a certificate to add trust. If you trust the certificate authority, you can therefore trust the certificate.","enw":"A. Steganography Steganography is a technique for hiding information inside of another media type. Steganography is a method of obfuscating data and does not provide a method of adding trust to a certificate. B. Hash A hash can help verify that the certificate has not been altered, but it does not provide additional third-party trust. C. Symmetric encryption Symmetric encryption provides data confidentiality, but it doesn't add any additional trust to the encryption process."},{"id":"A76","exam":"A","n":76,"type":"mc","dom":4,"obj":"4.4","objtxt":"SY0-701, Objective 4.4 - Security Tools","qparts":[{"k":"p","v":"A company is using SCAP as part of their security monitoring processes. Which of the following would BEST describe this implementation?"}],"opts":[{"k":"A","t":"Train the user community to better identify phishing attempts"},{"k":"B","t":"Present the results of an internal audit to the board"},{"k":"C","t":"Automate the validation and patching of security issues"},{"k":"D","t":"Identify and document authorized data center visitors"}],"ans":["C"],"es":"SCAP estandariza y automatiza la validación y remediación de vulnerabilidades entre distintas herramientas de seguridad.","en":"C. Automate the validation and patching of security issues SCAP (Security Content Automation Protocol) focuses on the standardization of vulnerability management across multiple security tools. This allows different tools to identify and act on the same security criteria.","enw":"A. Train the user community to better identify phishing attempts Security awareness training is an important part of an overall security strategy, but the training process does not generally involve SCAP. B. Present the results of an internal audit to the board A presentation of audit results can provide important feedback, but the presentation itself does not generally use SCAP. D. Identify and document authorized data center visitors The identification and documentation process for visitors is an important security policy, but it does not generally require the use of SCAP."},{"id":"A77","exam":"A","n":77,"type":"mc","dom":5,"obj":"5.1","objtxt":"SY0-701, Objective 5.1 - Data Roles and Responsibilities","qparts":[{"k":"p","v":"An organization maintains a large database of customer information for sales tracking and customer support. Which person in the organization would be responsible for managing the access rights to this data?"}],"opts":[{"k":"A","t":"Data processor"},{"k":"B","t":"Data owner"},{"k":"C","t":"Data subject"},{"k":"D","t":"Data custodian"}],"ans":["D"],"es":"El data custodian administra los derechos de acceso y controles del dato. El data owner toma decisiones de negocio.","en":"D. Data custodian The data custodian manages access rights and sets security controls to the data.","enw":"A. Data processor The data processor manages the operational use of the data, but not the rights and permissions to the information. B. Data owner The data owner is usually a higher-level executive who makes business decisions regarding the data. C. Data subject The data subjects are the individuals who have their personal information contained in this customer information database."},{"id":"A78","exam":"A","n":78,"type":"mc","dom":3,"obj":"3.3","objtxt":"SY0-701, Objective 3.3 - Data Types and Classifications","qparts":[{"k":"p","v":"An organization’s content management system currently labels files and documents as “Public” and “Restricted.” On a recent update, a new classification type of “Private” was added. Which of the following would be the MOST likely reason for this addition?"}],"opts":[{"k":"A","t":"Minimized attack surface"},{"k":"B","t":"Simplified categorization"},{"k":"C","t":"Expanded privacy compliance"},{"k":"D","t":"Decreased search time"}],"ans":["C"],"es":"Agregar la clasificación Private suele responder a requisitos de cumplimiento y confidencialidad de datos personales.","en":"C. Expanded privacy compliance The labeling of data as private is often associated with compliance and confidentiality concerns.","enw":"A. Minimized attack surface The categorization of data has little impact on the size of the potential attack surface associated with a system. B. Simplified categorization Adding additional categories would not commonly be considered a simplification. D. Decreased search time Adding additional classifications would not necessarily provide any decreased search times."},{"id":"A79","exam":"A","n":79,"type":"mc","dom":1,"obj":"1.4","objtxt":"SY0-701, Objective 1.4 - Encryption Technologies","qparts":[{"k":"p","v":"A corporate security team would like to consolidate and protect the private keys across all of their web servers. Which of these would be the BEST way to securely store these keys?"}],"opts":[{"k":"A","t":"Integrate an HSM"},{"k":"B","t":"Implement full disk encryption on the web servers"},{"k":"C","t":"Use a TPM"},{"k":"D","t":"Upgrade the web servers to use a UEFI BIOS"}],"ans":["A"],"es":"Un HSM centraliza y protege claves privadas y certificados. Un TPM es por equipo y el cifrado de disco no consolida nada.","en":"A. Integrate an HSM An HSM (Hardware Security Module) is a high-end cryptographic hardware appliance that can securely store keys and certificates for all devices.","enw":"B. Implement full disk encryption on the web servers Full-disk encryption would only protect the keys if someone does not have the proper credentials, and it won’t help consolidate all of the web server keys to a central point. C. Use a TPM A TPM (Trusted Platform Module) is used on individual devices to provide cryptographic functions and securely store encryption keys. Individual TPMs would not provide any consolidation of web server private keys. D. Upgrade the web servers to use a UEFI BIOS A UEFI (Unified Extensible Firmware Interface) BIOS (Basic Input/ Output System) does not provide any additional security or consolidation features for web server private keys."},{"id":"A80","exam":"A","n":80,"type":"mc","dom":4,"obj":"4.9","objtxt":"SY0-701, Objective 4.9 - Log Data","qparts":[{"k":"p","v":"A security technician is reviewing this security log from an IPS:"},{"k":"code","v":"ALERT 2023-06-01 13:07:29 [163bcf65118-179b547b]\nCross-Site Scripting in JSON Data\n222.43.112.74:3332 -> 64.235.145.35:80\nURL/index.html - Method POST - Query String \"-\"\nUser Agent: curl/7.21.3 (i386-redhat-linux-gnu) libcurl/7.21.3\nNSS/3.13.1.0 zlib/1.2.5 libidn/1.19 libssh2/1.2.7\nDetail: token=\"<script>\" key=\"key7\" value=\"<script>alert(2)<\/script>\""},{"k":"p","v":"Which of the following can be determined from this log information? (Select TWO)"}],"opts":[{"k":"A","t":"The alert was generated from a malformed User Agent header"},{"k":"B","t":"The alert was generated from an embedded script"},{"k":"C","t":"The attacker’s IP address is 222.43.112.74"},{"k":"D","t":"The attacker’s IP address is 64.235.145.35"},{"k":"E","t":"The alert was generated due to an invalid client port number"}],"ans":["B","C"],"es":"Hay un script embebido en datos JSON (XSS). La flecha indica origen -> destino, así que el atacante es 222.43.112.74 y la víctima 64.235.145.35.","en":"B. The alert was generated from an embedded script and C. The attacker’s IP address is 222.43.112.74 The details of the IPS (Intrusion Prevention System) alert show a script value embedded into JSON ( JavaScript Object Notation) data. The IPS log also shows the flow of the attack with an arrow in the middle. The attacker was IP address 222.43.112.74 with port 3332, and the victim was 64.235.145.35 over port 80.","enw":"A. The alert was generated from a malformed User Agent header The user agent information is provided as additional supporting data associated with the alert. The agent itself is not the cause of this alert. D. The attacker’s IP address is 64.235.145.35 The attacker’s IP address is listed first, so the victim's IP address is 64.235.145.35. E. The alert was generated due to an invalid client port number The port number associated with the client, 3332, is a valid port number and not associated with the cause of the alert."},{"id":"A81","exam":"A","n":81,"type":"mc","dom":5,"obj":"5.2","objtxt":"SY0-701, Objective 5.2 - Risk Analysis","qparts":[{"k":"p","v":"Which of the following describes a monetary loss if one event occurs?"}],"opts":[{"k":"A","t":"ALE"},{"k":"B","t":"SLE"},{"k":"C","t":"RTO"},{"k":"D","t":"ARO"}],"ans":["B"],"es":"SLE (Single Loss Expectancy) es la pérdida monetaria de un solo evento. ALE es anual y ARO es la frecuencia anual.","en":"B. SLE SLE (Single Loss Expectancy) describes the financial impact of a single event.","enw":"A. ALE ALE (Annual Loss Expectancy) is the financial loss over an entire 12-month period. C. RTO RTO (Recovery Time Objectives) define a timeframe needed to restore a particular service level. D. ARO The ARO (Annualized Rate of Occurrence) is the number of times an event will occur in a 12-month period."},{"id":"A82","exam":"A","n":82,"type":"mc","dom":2,"obj":"2.3","objtxt":"SY0-701, Objective 2.3 - SQL Injection","qparts":[{"k":"p","v":"A user with restricted access has typed this text in a search field of an internal web-based application: USER77' OR '1'='1 After submitting this search request, all database records are displayed on the screen. Which of the following would BEST describe this search?"}],"opts":[{"k":"A","t":"Cross-site scripting"},{"k":"B","t":"Buffer overflow"},{"k":"C","t":"SQL injection"},{"k":"D","t":"SSL stripping"}],"ans":["C"],"es":"El texto ' OR '1'='1 es un ataque clásico de inyección SQL que evita la validación de entrada.","en":"C. SQL injection SQL (Structured Query Language) injection takes advantage of poor input validation to circumvent the application and allows the attacker to query the database directly.","enw":"A. Cross-site scripting Cross-site scripting takes advantage of a third-party trust to a web application. The attack demonstrated in this question does not use another user's credentials or access rights to obtain information. B. Buffer overflow A buffer overflow uses an application vulnerability to submit more information than an application can properly manage. The attack syntax in this question is specific to SQL injections, and it does not appear to be manipulating a buffer overflow vulnerability. D. SSL stripping SSL stripping is a downgrade attack that modifies web site addresses to allow access to encrypted information. The attack in this question does not appear to include a third-party."},{"id":"A83","exam":"A","n":83,"type":"mc","dom":1,"obj":"1.2","objtxt":"SY0-701, Objective 1.2 - An Overview of Malware","qparts":[{"k":"p","v":"A user has opened a helpdesk ticket complaining of poor system performance, excessive pop up messages, and the cursor moving without anyone touching the mouse. This issue began after they opened a spreadsheet from a vendor containing part numbers and pricing information. Which of the following is MOST likely the cause of this user's issues?"}],"opts":[{"k":"A","t":"On-path"},{"k":"B","t":"Worm"},{"k":"C","t":"Trojan horse"},{"k":"D","t":"Logic bomb"}],"ans":["C"],"es":"Una hoja de cálculo que causa ventanas emergentes y control del cursor apunta a un troyano con acceso remoto.","en":"C. Trojan horse Since a Trojan horse is usually disguised as legitimate software, the victim often doesn’t realize they’re installing malware. Once the Trojan is installed, the attacker can install additional software to control the infected system.","enw":"A. On-path An on-path attack commonly occurs without any knowledge to the parties involved, and there’s usually no additional notification that an attack is underway. B. Worm A worm is malware that can replicate itself between systems without any user intervention, so a spreadsheet that requires additional a user to click warning messages would not be categorized as a worm. D. Logic bomb A logic bomb is malware that installs and operates silently until a certain event occurs. Once the logic bomb has been triggered, the results usually involve loss of data or a disabled operating system."},{"id":"A84","exam":"A","n":84,"type":"mc","dom":5,"obj":"5.4","objtxt":"SY0-701, Objective 5.4 - Compliance","qparts":[{"k":"p","v":"A web-based manufacturing company processes monthly charges to credit card information saved in the customer's profile. All of the customer information is encrypted and protected with additional authentication factors. Which of the following would be the justification for these security controls?"}],"opts":[{"k":"A","t":"Chain of custody"},{"k":"B","t":"Password vaulting"},{"k":"C","t":"Compliance reporting"},{"k":"D","t":"Sandboxing"}],"ans":["C"],"es":"Guardar datos de tarjetas exige cifrado y controles adicionales por cumplimiento normativo (compliance reporting).","en":"C. Compliance reporting The storage of sensitive information such as customer details and payment information may require additional reporting to ensure compliance with the proper security controls.","enw":"A. Chain of custody Chain of custody describes the control and integrity of collected evidence. Chain of custody would not involve the implementation of encryption and authentication factors in this example. B. Password vaulting Password vaults are used as secure storage and retrieval of authentication credentials. The protection of user data is not associated with password vaulting. D. Sandboxing Sandboxing is the process of running a service or system in a protected environment. This sandbox allows for testing and analysis without affecting other systems that may currently be in production."},{"id":"A85","exam":"A","n":85,"type":"mc","dom":2,"obj":"2.4","objtxt":"SY0-701, Objective 2.4 - Other Malware Types","qparts":[{"k":"p","v":"A security manager has created a report showing intermittent network communication from certain workstations on the internal network to one external IP address. These traffic patterns occur at random times during the day. Which of the following would be the MOST likely reason for these traffic patterns?"}],"opts":[{"k":"A","t":"On-path attack"},{"k":"B","t":"Keylogger"},{"k":"C","t":"Replay attack"},{"k":"D","t":"Brute force"}],"ans":["B"],"es":"Tráfico intermitente de estaciones a una sola IP externa encaja con un keylogger que envía lo capturado al atacante.","en":"B. Keylogger A keylogger captures keystrokes and occasionally transmits this information to the attacker for analysis. The traffic patterns identified by the security manager could potentially be categorized as malicious keylogger transfers.","enw":"A. On-path attack An on-path attack is an exploit often associated with a device monitoring data in the middle of a conversation. This question did not provide any evidence of third-party monitoring. C. Replay attack A replay attack is often used by an attacker to gain access to a service through the use of credentials gathered from a previous authentication. Internal devices communicating to an external server would not be a common pattern for a replay attack. D. Brute force A brute force attack attempts to find authentication credentials by attempting to guess a password. In this example, the source of the traffic and the traffic patterns don't match those seen with common brute force attempts."},{"id":"A86","exam":"A","n":86,"type":"mc","dom":4,"obj":"4.4","objtxt":"SY0-701, Objective 4.4 - Security Tools","qparts":[{"k":"p","v":"The security policies in a manufacturing company prohibit the transmission of customer information. However, a security administrator has received an alert that credit card numbers were transmitted as an email attachment. Which of the following was the MOST likely source of this alert message?"}],"opts":[{"k":"A","t":"IPS"},{"k":"B","t":"DLP"},{"k":"C","t":"RADIUS"},{"k":"D","t":"IPsec"}],"ans":["B"],"es":"DLP (Data Loss Prevention) identifica y bloquea datos sensibles, como números de tarjeta en un adjunto.","en":"B. DLP DLP (Data Loss Prevention) technologies can identify and block the transmission of sensitive data across the network.","enw":"A. IPS IPS (Intrusion Prevention System) signatures are useful for identifying known vulnerabilities, but they don't commonly provide a way to identify and block PII (Personally Identifiable Information) or sensitive data. C. RADIUS RADIUS (Remote Authentication Dial-In User Service) is an authentication protocol commonly used to validate user credentials. RADIUS would not be used to identify sensitive data transfers. D. IPsec IPsec (Internet Protocol Security) is a protocol suite for authenticating and encrypting network communication. IPsec does not include any features for identifying and alerting on sensitive information."},{"id":"A87","exam":"A","n":87,"type":"mc","dom":1,"obj":"1.2","objtxt":"SY0-701, Objective 1.2 - Deception and Disruption","qparts":[{"k":"p","v":"A security administrator has configured a virtual machine in a screened subnet with a guest login account and no password. Which of the following would be the MOST likely reason for this configuration?"}],"opts":[{"k":"A","t":"The server is a honeypot for attracting potential attackers"},{"k":"B","t":"The server is a cloud storage service for remote users"},{"k":"C","t":"The server will be used as a VPN concentrator"},{"k":"D","t":"The server is a development sandbox for third-party programming projects"}],"ans":["A"],"es":"Una VM con cuenta guest sin contraseña en una screened subnet es un honeypot para atraer atacantes.","en":"A. The server is a honeypot for attracting potential attackers A screened subnet is a good location to configure services that can be accessed from the Internet, and building a system that can be easily compromised is a common tactic for honeypot systems.","enw":"B. The server is a cloud storage service for remote users Although cloud storage is a useful service, configuring storage on a server with an open guest account is not a best practice. C. The server will be used as a VPN concentrator VPN (Virtual Private Networking) concentrators should be installed on secure devices, and configuring an open guest account would not be considered a secure configuration. D. The server is a development sandbox for third-party programming projects It would not be secure to configure a development sandbox on a system with an open guest account."},{"id":"A88","exam":"A","n":88,"type":"mc","dom":4,"obj":"4.5","objtxt":"SY0-701, Objective 4.5 - Email Security","qparts":[{"k":"p","v":"A security administrator is configuring a DNS server with a SPF record. Which of the following would be the reason for this configuration?"}],"opts":[{"k":"A","t":"Transmit all outgoing email over an encrypted tunnel"},{"k":"B","t":"List all servers authorized to send emails"},{"k":"C","t":"Digitally sign all outgoing email messages"},{"k":"D","t":"Obtain disposition instructions for emails marked as spam"}],"ans":["B"],"es":"Un registro SPF publica en DNS la lista de servidores autorizados a enviar correo del dominio.","en":"B. List all servers authorized to send emails SPF (Sender Policy Framework) is used to publish a list of all authorized email servers for a specific domain.","enw":"A. Transmit all outgoing email over an encrypted tunnel The option to use encrypted protocols for email transfer is configured in the email server and not in the DNS (Domain Name System) server. C. Digitally sign all outgoing email messages DKIM (Domain Keys Identified Mail) is used to publish the public key used for the digital signature for all outgoing email. D. Obtain disposition instructions for emails marked as spam A DMARC (Domain-based Message Authentication, Reporting, and Conformance) record announces the preferred email disposition if a message is identified as spam. DMARC options include accepting the messages, sending them to a spam folder, or simply rejecting the emails."},{"id":"A89","exam":"A","n":89,"type":"mc","dom":3,"obj":"3.1","objtxt":"SY0-701, Objective 3.1 - Other Infrastructure Concepts","qparts":[{"k":"p","v":"A company would like to securely deploy applications without the overhead of installing a virtual machine for each system. Which of the following would be the BEST way to deploy these applications?"}],"opts":[{"k":"A","t":"Containerization"},{"k":"B","t":"IoT"},{"k":"C","t":"Proxy"},{"k":"D","t":"RTOS"}],"ans":["A"],"es":"Containerization permite desplegar aplicaciones aisladas sin una VM completa por cada una.","en":"A. Containerization Application containerization uses a single virtual machine to use as a foundation for separate application \"containers.\" These containers are implemented as isolated instances, and an application in one container is not inherently accessible from other containers on the system.","enw":"B. IoT IoT (Internet of Things) is a broad category of embedded devices often installed in our homes and businesses. IoT devices are not commonly associated with the application deployment process. C. Proxy Proxies can be used as security devices, but they aren't commonly used for deploying application instances. D. RTOS RTOS (Real-Time Operating Systems) are designed for time-sensitive applications and services. Manufacturing equipment and transportation systems often incorporate an RTOS."},{"id":"A90","exam":"A","n":90,"type":"mc","dom":4,"obj":"4.3","objtxt":"SY0-701, Objective 4.3 - Penetration Testing","qparts":[{"k":"p","v":"A company has just purchased a new application server, and the security director wants to determine if the system is secure. The system is currently installed in a test environment and will not be available to users until the roll out to production next week. Which of the following would be the BEST way to determine if any part of the system can be exploited?"}],"opts":[{"k":"A","t":"Tabletop exercise"},{"k":"B","t":"Vulnerability scanner"},{"k":"C","t":"DDoS"},{"k":"D","t":"Penetration test"}],"ans":["D"],"es":"Una prueba de penetración intenta explotar activamente el sistema. Un escáner solo identifica vulnerabilidades.","en":"D. Penetration test A penetration test can be used to actively exploit potential vulnerabilities in a system or application. This could cause a denial of service or loss of data, so the best practice is to perform the penetration test during non\u0002production hours or in a test environment.","enw":"A. Tabletop exercise A tabletop exercise is used to talk through a security event with an incident response team around a conference room table. This is commonly performed as a training device instead of performing a full-scale disaster drill. B. Vulnerability scanner Vulnerability scanners may identify a vulnerability, but they do not actively attempt to exploit the vulnerability. C. DDoS A DDoS (Distributed Denial of Service) attack is often used to disable a service or application, but it doesn't provide any particular information regarding an application vulnerability."},{"id":"B1","exam":"B","n":1,"type":"pbq","mode":"match","dom":1,"obj":"SY0-701, Objetivo 1.4 - Certificados","prompt":"Match the certificate characteristic to the description.","choices":["CRL","OCSP","CA","CSR"],"items":[{"t":"A list of invalidated certificates","a":"CRL","w":"Certificate Revocation List: lista de certificados revocados que mantiene la CA."},{"t":"Send the public key to be signed","a":"CSR","w":"Certificate Signing Request: se envía la clave pública a la CA para que la firme."},{"t":"Deploy and manage certificates","a":"CA","w":"Certificate Authority: control administrativo de la PKI."},{"t":"The browser checks for a revoked certificate","a":"OCSP","w":"Online Certificate Status Protocol: consulta de estado de revocación."}],"es":"CRL lista revocados, CSR solicita la firma, CA administra y OCSP consulta la revocación en línea.","extra":null},{"id":"B2","exam":"B","n":2,"type":"pbq","mode":"match","dom":4,"obj":"SY0-701, Objetivos 4.1 y 4.6 - Seguridad de dispositivos","prompt":"An organization is deploying a mobile app to its sales team in the field. The application will be accessed from tablets for remote team members and a browser-based front-end on desktops for corporate office users. The application contains sensitive customer information, and two forms of authentication are required to launch the application. Select the best security features for each platform. A security feature will only be used once. Not all security features will be used.","choices":["Tablet for Field Sales","Desktop with Browser-based Front-end","Not used"],"items":[{"t":"MDM integration","a":"Tablet for Field Sales","w":"El MDM administra los dispositivos móviles."},{"t":"Full device encryption","a":"Tablet for Field Sales","w":"Un móvil se pierde con facilidad: hay que cifrar todo el dispositivo."},{"t":"Biometric authentication","a":"Tablet for Field Sales","w":"Reconocimiento facial o huella como segundo factor en la tablet."},{"t":"Anti-malware","a":"Desktop with Browser-based Front-end","w":"Protección común en escritorios."},{"t":"Host-based firewall","a":"Desktop with Browser-based Front-end","w":"Firewall local del equipo de escritorio."},{"t":"Infrared sensors","a":"Not used","w":"No aplica a estos dispositivos."},{"t":"OSINT","a":"Not used","w":"OSINT es recopilación de información abierta, no una característica de seguridad del dispositivo."}],"es":"Tablet: MDM, cifrado completo y biometría. Escritorio: anti-malware y firewall de host. Infrared sensors y OSINT no se usan.","extra":null},{"id":"B3","exam":"B","n":3,"type":"pbq","mode":"match","dom":4,"obj":"SY0-701, Objetivo 4.8 - Respuesta a incidentes","prompt":"Place the incident response activities in the correct order.","choices":["Preparation","Detection","Analysis","Containment","Eradication","Recovery","Lessons learned"],"items":[{"t":"Step 1","a":"Preparation","w":"Antes del incidente: herramientas, contactos, políticas."},{"t":"Step 2","a":"Detection","w":"Identificar que puede haber un incidente real y no un falso positivo."},{"t":"Step 3","a":"Analysis","w":"Evidencia detallada: alarmas, alertas, reportes."},{"t":"Step 4","a":"Containment","w":"Evitar que el código malicioso se propague."},{"t":"Step 5","a":"Eradication","w":"Eliminar el malware y parchar vulnerabilidades."},{"t":"Step 6","a":"Recovery","w":"Reconstruir sistemas y reemplazar datos comprometidos."},{"t":"Step 7","a":"Lessons learned","w":"Documentar y mejorar el proceso para la próxima vez."}],"es":"Orden: Preparation, Detection, Analysis, Containment, Eradication, Recovery, Lessons learned.","extra":null},{"id":"B4","exam":"B","n":4,"type":"pbq","mode":"match","dom":1,"obj":"SY0-701, Objetivo 1.4 - Tecnologías criptográficas","prompt":"Match the security technology to the implementation.","choices":["Hashing","Digital signature","SPF","Key escrow","Journaling","Obfuscation"],"items":[{"t":"Store a password on an authentication server","a":"Hashing","w":"Hash: función unidireccional, ideal para guardar contraseñas."},{"t":"Verify a sender’s identity","a":"Digital signature","w":"Firma digital: integridad, autenticación y no repudio."},{"t":"Authenticate the server sending an email","a":"SPF","w":"SPF: lista de servidores autorizados a enviar correo."},{"t":"Store keys with a third-party","a":"Key escrow","w":"Key escrow: un tercero guarda las claves de descifrado."},{"t":"Prevent data corruption when a system fails","a":"Journaling","w":"Journaling: se escribe el diario antes de confirmar los datos."},{"t":"Modify a script to make it difficult to understand","a":"Obfuscation","w":"Ofuscación: hacer algo difícil de entender."}],"es":"Cada tecnología corresponde a una sola implementación.","extra":null},{"id":"B5","exam":"B","n":5,"type":"pbq","mode":"match","dom":3,"obj":"SY0-701, Objetivo 3.3 - Estados de los datos","prompt":"Select the data state that best fits the description. Each data state will be used more than once.","choices":["Data in-transit","Data at-rest","Data in-use"],"items":[{"t":"All switches in a data center are connected with an 802.1Q trunk","a":"Data in-transit","w":"Se mueve por la red."},{"t":"Sales information is uploaded daily from a remote site using a satellite network","a":"Data in-transit","w":"Se mueve por la red."},{"t":"A company stores customer purchase information in a MySQL database","a":"Data at-rest","w":"Almacenado en un dispositivo."},{"t":"An application decrypts credit card numbers and expiration dates to validate for approval","a":"Data in-use","w":"Se procesa en memoria."},{"t":"An authentication program performs a hash of all passwords","a":"Data in-use","w":"Se procesa en memoria."},{"t":"An IPS identifies a SQL injection attack and removes the attack frames from the network","a":"Data in-transit","w":"Analiza tramas que viajan por la red."},{"t":"An automatic teller machine validates a user’s PIN before allowing a deposit","a":"Data in-use","w":"Se procesa en memoria."},{"t":"Each time a spreadsheet is updated, all of the cells containing formulas are automatically updated","a":"Data in-use","w":"Se procesa en memoria."},{"t":"All weekly backup tapes are transported to an offsite storage facility","a":"Data at-rest","w":"Almacenado en cintas."},{"t":"All user spreadsheets are stored on a cloud-based file sharing service","a":"Data at-rest","w":"Almacenado en un servicio en la nube."}],"es":"In-transit: viaja por la red. At-rest: está en un dispositivo de almacenamiento. In-use: está en memoria de un dispositivo.","extra":null},{"id":"B6","exam":"B","n":6,"type":"mc","dom":2,"obj":"2.5","objtxt":"SY0-701, Objective 2.5 - Hardening Techniques","qparts":[{"k":"p","v":"A security administrator has performed an audit of the organization’s production web servers, and the results have identified default configurations, web services running from a privileged account, and inconsistencies with SSL certificates. Which of the following would be the BEST way to resolve these issues?"}],"opts":[{"k":"A","t":"Server hardening"},{"k":"B","t":"Multi-factor authentication"},{"k":"C","t":"Enable HTTPS"},{"k":"D","t":"Run operating system updates"}],"ans":["A"],"es":"Server hardening: los hallazgos (configuración por defecto, servicios con cuenta privilegiada, certificados inconsistentes) se corrigen siguiendo guías de endurecimiento. MFA, HTTPS o parches por sí solos no los resuelven.","en":"A. Server hardening Many applications and services include secure configuration guides to assist in hardening the system. These hardening steps will make the system as secure as possible while simultaneously allowing the application to run efficiently.","enw":"B. Multi-factor authentication Although multi-factor authentication is always a good best practice, simply enabling multiple authentication methods would not resolve the issues identified during the audit. C. Enable HTTPS Most web servers will use HTTPS to ensure that network communication is encrypted. However, requiring encrypted network traffic would not correct the issues identified during the audit. D. Run operating system updates Keeping the system updated is another good best practice, but the issues identified during the audit were not related to OS patches. Many of the issues identified in the audit appear to be related to the configuration of the web server, so any resolution should focus on correcting these configuration issues."},{"id":"B7","exam":"B","n":7,"type":"mc","dom":1,"obj":"1.1","objtxt":"SY0-701, Objective 1.1 - Security Controls","qparts":[{"k":"p","v":"A shipping company stores information in small regional warehouses around the country. The company maintains an IPS at each warehouse to watch for suspicious traffic patterns. Which of the following would BEST describe the security control used at the warehouse?"}],"opts":[{"k":"A","t":"Deterrent"},{"k":"B","t":"Compensating"},{"k":"C","t":"Directive"},{"k":"D","t":"Detective"}],"ans":["D"],"es":"Un IPS detecta, alerta y registra intentos de intrusión: control detectivo. También puede bloquear, por lo que a veces se considera preventivo, pero de esta lista la respuesta es detective.","en":"D. Detective An IPS can detect, alert, and log an intrusion attempt. The IPS could also be categorized as a preventive control, since it has the ability to actively block known attacks.","enw":"A. Deterrent A deterrent discourages an intrusion attempt, but it doesn't directly prevent the access. An application splash screen or posted warning sign would be categorized as a deterrent. B. Compensating A compensating control can’t prevent an attack, but it can provide an alternative when an attack occurs. For example, a compensating control would include the re-imaging of a compromised server. C. Directive Directive control types are guidelines offered to help direct a subject towards security compliance. Training users on the proper storage of sensitive files would be an example of a directive control."},{"id":"B8","exam":"B","n":8,"type":"mc","dom":5,"obj":"5.1","objtxt":"SY0-701, Objective 5.1 - Data Roles and Responsibilities","qparts":[{"k":"p","v":"The Vice President of Sales has asked the IT team to create daily backups of the sales data. The Vice President is an example of a:"}],"opts":[{"k":"A","t":"Data owner"},{"k":"B","t":"Data controller"},{"k":"C","t":"Data steward"},{"k":"D","t":"Data processor"}],"ans":["A"],"es":"El vicepresidente es el data owner: la persona responsable de ese dato, normalmente un directivo. Los controllers, stewards y processors operan o gestionan el dato.","en":"A. Data owner The data owner is accountable for specific data, so this person is often a senior officer of the organization.","enw":"B. Data controller A data controller manages the processing of the data. For example, a payroll department would be a data controller, and a payroll servicing company would be the data processor. C. Data steward The data steward manages access rights to the data. In this example, the IT team would be the data steward. D. Data processor The data processor is often a third-party that processes data on behalf of the data controller."},{"id":"B9","exam":"B","n":9,"type":"mc","dom":4,"obj":"4.3","objtxt":"SY0-701, Objective 4.3 - Threat Intelligence","qparts":[{"k":"p","v":"A security engineer is preparing to conduct a penetration test of a third\u0002party website. Part of the preparation involves reading through social media posts for information about this site. Which of the following describes this practice?"}],"opts":[{"k":"A","t":"Partially known environment"},{"k":"B","t":"OSINT"},{"k":"C","t":"Exfiltration"},{"k":"D","t":"Active reconnaissance"}],"ans":["B"],"es":"OSINT (Open Source Intelligence) es obtener información de fuentes públicas como redes sociales y sitios web. La reconnaissance activa dejaría rastros en los logs.","en":"B. OSINT OSINT (Open Source Intelligence) describes the process of obtaining information from open sources such as social media sites, corporate websites, online forums, and other publicly available locations.","enw":"A. Partially known environment A partially known environment describes how aware an attacker might be about a test. The attacker may have access to some information about the test, but not all information is disclosed. C. Exfiltration Exfiltration describes the theft of data by an attacker. D. Active reconnaissance Active reconnaissance would show some evidence of data gathering. For example, performing a ping scan or DNS query wouldn’t exploit a vulnerability, but it would show that someone was gathering information."},{"id":"B10","exam":"B","n":10,"type":"mc","dom":4,"obj":"4.7","objtxt":"SY0-701, Objective 4.7 - Scripting and Automation","qparts":[{"k":"p","v":"A company would like
